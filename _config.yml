exclude:
  # Dashboard source is tracked here; its private app runs on the owner's Mac.
  - work-dashboard
  - _incantations.json
  - _scripts
  - _drafts
  - README.md
  # The cardiac simulator publishes as a single built file; its build inputs
  # stay in the repository but are not served.
  - cardiac/src
  - cardiac/build.py
  - cardiac/CONTRACT.md
  - cardiac/README.md
