<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardiac Cycle &amp; ECG Simulator</title>
<meta name="description" content="An interactive teaching simulator linking the cardiac cycle, the conduction system and the ECG, for prelicensure nursing and health-professional students.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FAF7F2'/%3E%3Cpath d='M2 20h5l3-9 4 16 4-13 3 6h9' fill='none' stroke='%23A0522D' stroke-width='2.2' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* 05-style.css */
/* 05-style.css — visual system.
   Tokens follow the build specification. Muted and quiet colours never carry
   meaning on their own; every state that matters also has a shape, an icon or a
   word attached to it. */

:root {
  --ink: #1A1A1A;
  --cream: #FAF7F2;
  --paper: #F5F0E8;
  --white: #FFFFFF;
  --accent: #A0522D;
  --accent-soft: #C08A6E;
  /* Text colour that sits ON --accent. Light theme wants white; the dark theme
     accent is a light peach, where white text falls to 2.8:1 — it needs ink. */
  --on-accent: #FFFFFF;
  --sage: #5E7059;
  --muted: #5F5A55;
  --quiet: #8A847C;
  --danger: #9B1C1C;
  --warn: #8A5A11;
  --rule: #DED7CC;
  --rule-strong: #C8BFB1;

  --flow-ox: #A84F39;
  --flow-deox: #3D7F91;
  --conduction: #C98A08;
  --conduction-bright: #EDB52E;

  --ecg-paper: #FFFCFA;
  --ecg-trace: #1A1A1A;
  --ecg-grid-minor: #F3D6D1;
  --ecg-grid-major: #E9AAA0;
  --wave-highlight: rgba(237, 181, 46, 0.26);

  --myo: #D8C4B4;
  --myo-edge: #A98B76;
  --blood-ox: #C4674C;
  --blood-deox: #4E8EA1;

  --font-ui: "Aptos", "Calibri", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --font-display: Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px; --s12: 48px;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(26, 22, 18, .06), 0 6px 18px rgba(26, 22, 18, .06);
}

:root[data-theme="dark"], html.dark {
  --ink: #EDE7DE;
  --cream: #16150F;
  --paper: #1E1D16;
  --white: #24231B;
  --accent: #D9915F;
  --accent-soft: #A9714F;
  --on-accent: #17140E;
  --sage: #94A88C;
  --muted: #ADA69B;
  --quiet: #857E73;
  --danger: #E2837D;
  --warn: #D9A94E;
  --rule: #34322A;
  --rule-strong: #47443A;

  --flow-ox: #D9765A;
  --flow-deox: #5FB0C6;
  --conduction: #EDB52E;
  --conduction-bright: #FFD35E;

  --ecg-paper: #14140F;
  --ecg-trace: #F2EDE4;
  --ecg-grid-minor: #38251F;
  --ecg-grid-major: #55322A;
  --wave-highlight: rgba(237, 181, 46, 0.20);

  --myo: #4A4034;
  --myo-edge: #6E6050;
  --blood-ox: #8E4433;
  --blood-deox: #2F5F70;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #EDE7DE; --cream: #16150F; --paper: #1E1D16; --white: #24231B;
    --accent: #D9915F; --accent-soft: #A9714F; --on-accent: #17140E; --sage: #94A88C;
    --muted: #ADA69B; --quiet: #857E73; --danger: #E2837D; --warn: #D9A94E;
    --rule: #34322A; --rule-strong: #47443A;
    --flow-ox: #D9765A; --flow-deox: #5FB0C6;
    --conduction: #EDB52E; --conduction-bright: #FFD35E;
    --ecg-paper: #14140F; --ecg-trace: #F2EDE4;
    --ecg-grid-minor: #38251F; --ecg-grid-major: #55322A;
    --wave-highlight: rgba(237, 181, 46, 0.20);
    --myo: #4A4034; --myo-edge: #6E6050; --blood-ox: #8E4433; --blood-deox: #2F5F70;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}

* { box-sizing: border-box; }

/* Several hidden elements are flex or grid containers, whose display would
   otherwise win over the [hidden] default. */
[hidden] { display: none !important; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--cream); color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px; line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

body { overflow: hidden; }
@media (max-width: 1023px) { body { overflow: auto; } }

button, select, input { font: inherit; color: inherit; }

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; left: var(--s3); top: -60px; z-index: 200;
  background: var(--accent); color: var(--on-accent); padding: var(--s2) var(--s4);
  border-radius: var(--radius); transition: top .15s;
}
.skip-link:focus { top: var(--s3); }

/* ------------------------------------------------------------------ shell */

.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100vh; height: 100dvh;
}

.topbar {
  display: flex; align-items: center; gap: var(--s2);
  padding: var(--s2) var(--s3);
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
  min-height: 52px;
  flex-wrap: wrap;
  row-gap: var(--s2);
}
.topbar .field { min-width: 0; }
.topbar .field select { max-width: 200px; text-overflow: ellipsis; }
@media (max-width: 1560px) {
  .topbar .brand small { display: none; }
  .wide-only { display: none; }
  .brand { font-size: 15px; }
  .topbar .field select { max-width: 168px; font-size: 13px; padding-left: 9px; }
  .segmented button { padding: 7px 12px; font-size: 13px; }
}
@media (max-width: 1240px) {
  .topbar .field > label { display: none; }
}

.brand {
  font-family: var(--font-display);
  font-size: 17px; font-weight: 600; letter-spacing: .01em;
  white-space: nowrap; margin: 0;
}
.brand small {
  display: block; font-family: var(--font-ui); font-weight: 500;
  font-size: 11px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase;
}

.topbar-spacer { flex: 1; }

/* Segmented control — the primary mode switch */
.segmented {
  display: inline-flex; background: var(--white);
  border: 1px solid var(--rule-strong); border-radius: 999px; padding: 3px;
  gap: 2px;
}
.segmented button {
  appearance: none; border: 0; background: transparent; cursor: pointer;
  padding: 7px 15px; border-radius: 999px; font-size: 14px; font-weight: 600;
  color: var(--muted); white-space: nowrap;
}
.segmented button[aria-pressed="true"] {
  background: var(--accent); color: var(--on-accent);
}
.segmented button:hover:not([aria-pressed="true"]) { background: var(--paper); color: var(--ink); }

.btn {
  appearance: none; cursor: pointer;
  background: var(--white); color: var(--ink);
  border: 1px solid var(--rule-strong); border-radius: var(--radius);
  padding: 8px 13px; font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 7px;
  min-height: 40px;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn[aria-pressed="true"], .btn.is-active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--on-accent); }
.btn-ghost { background: transparent; border-color: transparent; }
#aboutBtn { gap: 5px; }
.btn-ghost:hover { background: var(--white); }
.btn-icon { padding: 8px; min-width: 40px; justify-content: center; }
.btn:disabled { opacity: .42; cursor: not-allowed; }

.field { display: inline-flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > label { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.field select {
  appearance: none; background: var(--white) no-repeat right 9px center;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-size: 5px 5px, 5px 5px; background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;
  border: 1px solid var(--rule-strong); border-radius: var(--radius);
  padding: 8px 30px 8px 11px; min-height: 40px; font-size: 14px; font-weight: 600;
  cursor: pointer; max-width: 100%;
}

/* ------------------------------------------------------------------ stage */

.stage {
  display: grid;
  grid-template-columns: minmax(320px, 46fr) minmax(360px, 54fr) minmax(300px, 340px);
  gap: var(--s3); padding: var(--s3);
  min-height: 0; overflow: hidden;
}
.stage[data-view="twelve"] { grid-template-columns: minmax(230px, 300px) minmax(420px, 1fr) minmax(300px, 340px); }
.stage[data-rail="closed"] { grid-template-columns: minmax(320px, 46fr) minmax(360px, 54fr); }
.stage[data-rail="closed"][data-view="twelve"] { grid-template-columns: minmax(250px, 340px) 1fr; }

.panel {
  background: var(--white); border: 1px solid var(--rule);
  border-radius: var(--radius); box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; gap: var(--s2);
  padding: var(--s2) var(--s3); border-bottom: 1px solid var(--rule);
  background: var(--paper); flex: 0 0 auto;
}
.panel-title {
  font-size: 11px; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--muted); margin: 0;
}
.panel-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: var(--s3); }
.panel-body.flush { padding: 0; }

/* --------------------------------------------------------------- heart pane */

.heart-pane { position: relative; }
/* The heart column narrows sharply in 12-lead mode, so its heading takes a row
   of its own rather than squeezing the two selects into initials. */
.heart-pane .panel-head { flex-wrap: wrap; row-gap: var(--s2); }
.heart-pane .panel-title { flex: 1 0 100%; }
.heart-pane .panel-head .field { flex: 1 1 44%; min-width: 0; }
.heart-pane .panel-head .field select { width: 100%; }
.heart-pane .topbar-spacer { display: none; }
.heart-holder {
  flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center;
  padding: var(--s2);
}
.heart-svg { width: 100%; height: 100%; max-height: 100%; display: block; }

.layer { transition: opacity .16s ease; }

.vessel { stroke-linejoin: round; }
.vessel-deox { stroke: var(--blood-deox); }
.vessel-ox { stroke: var(--blood-ox); }
.vessel-edge { stroke: var(--myo-edge); stroke-linejoin: round; opacity: 1; }

.myo { fill: var(--myo); stroke: var(--myo-edge); stroke-width: 1.2; }
/* Oxygenated and deoxygenated differ by hue alone at close to equal luminance,
   which is invisible to a red-green colour-blind viewer and in greyscale. The
   hatch pattern on the deoxygenated side carries the same distinction without
   colour, and the labels name the chambers regardless. */
/* The cavity is drawn empty and the blood fills it to a level that tracks
   volume, so filling and ejection are things a learner watches happen rather
   than a silhouette that quietly changes size. */
/* An empty cavity should read as a chamber holding little blood, not as a hole
   punched through the heart, so it keeps a faint tint of what fills it. */
.cavity { stroke: var(--myo-edge); stroke-width: 1; }
.cavity-ox { fill: color-mix(in srgb, var(--blood-ox) 22%, var(--paper)); }
.cavity-deox { fill: color-mix(in srgb, var(--blood-deox) 20%, var(--paper)); }
.blood-ox { fill: var(--blood-ox); }
.blood-deox { fill: url(#deoxHatch); }
.blood-surface { stroke: var(--ink); stroke-width: 2; opacity: .38; }

/* Depolarising atrial muscle, in place of arcs drawn through the cavity. */
.atrial-glow {
  stroke: var(--conduction-bright); stroke-width: 7;
  filter: url(#condGlow); pointer-events: none;
}
.atrial-glow.is-chaotic { stroke-dasharray: 3 6; }
.av-junction { fill: var(--myo); stroke: var(--myo-edge); stroke-width: 1.2; }
/* The outflow tract is the same blood as the ventricle it leaves, so the route
   out of the chamber reads as continuous rather than as an artery that happens
   to start nearby. */
.outflow { stroke: var(--myo-edge); stroke-width: 1.2; }
.outflow-ox { fill: var(--blood-ox); opacity: .82; }
.outflow-deox { fill: var(--blood-deox); opacity: .78; }

/* Endocardial detail. Trabeculae stop the cavity reading as a flat cut-out;
   the papillary muscles and chordae are what make contraction legible as
   something the tissue does rather than a shape that changes size. */
.auricle { fill: var(--myo); stroke: var(--myo-edge); stroke-width: 1.2; }
.auricle-ox { fill: color-mix(in srgb, var(--blood-ox) 55%, var(--myo)); }
.auricle-deox { fill: color-mix(in srgb, var(--blood-deox) 50%, var(--myo)); }
/* The papillary muscles now sit against a pale empty cavity rather than a
   solid blood fill, so they need their own muscle tone to stay distinct from
   both the wall behind them and the chamber around them. */
.papillary { fill: color-mix(in srgb, var(--myo) 72%, var(--myo-edge)); stroke: var(--myo-edge); stroke-width: 1.3; }
.trabecula { stroke: var(--myo-edge); stroke-width: 2; opacity: .38; stroke-linecap: round; }
.chorda { stroke: #EFE6D8; stroke-width: 1.1; opacity: .62; }
.chorda.is-taut { stroke-width: 1.5; opacity: .92; }
:root[data-theme="dark"] .chorda, html.dark .chorda { stroke: #D7CDBC; }

/* Radiating sinus-node fibres and the internodal tracts. */
.cond-radial {
  stroke: var(--conduction); stroke-width: 2.2; stroke-linecap: round;
  opacity: calc(.4 + var(--lvl, 0) * .6);
}
.cond-tract { stroke-width: calc(3.4px + var(--lvl, 0) * 3.4px); }
.cond-fascicle { stroke-width: calc(2.6px + var(--lvl, 0) * 2.6px); opacity: calc(.44 + var(--lvl, 0) * .56); }
.cond-purkinje-1 { stroke-width: 2.6; }
.cond-purkinje-2 { stroke-width: 1.9; }
.cond-purkinje-3 { stroke-width: 1.3; opacity: calc(.42 + var(--lvl, 0) * .58); }

.chamber.is-hypertrophied .myo { fill: color-mix(in srgb, var(--myo) 78%, var(--accent)); }

/* Leaflets need to read against pale myocardium in the light theme and against
   dark myocardium in the dark one, so they take their colour from the wall edge
   rather than being a fixed near-white. */
.leaflet { stroke: var(--myo-edge); stroke-width: 3.6; stroke-linecap: round; fill: none; }
:root[data-theme="dark"] .leaflet, html.dark .leaflet { stroke: #E4DCCB; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .leaflet { stroke: #E4DCCB; } }
.valve-dot { fill: var(--ink); opacity: .5; }
.valve.is-open .leaflet { stroke: var(--sage); }

/* The conduction system is anatomy in its own right, so it stays clearly drawn
   at rest and brightens when it carries an impulse. Previously the resting
   pathway sat at 22% opacity on a 3 px line, which is close to invisible on a
   projector and unreadable at speed. */
.cond-track, .cond-purkinje {
  stroke: var(--conduction);
  stroke-linecap: round; stroke-linejoin: round;
  opacity: calc(.52 + var(--lvl, 0) * .48);
}
.cond-track {
  stroke-width: calc(5px + var(--lvl, 0) * 5px);
  paint-order: stroke;
}
/* The two bundle branches run close together down opposite faces of the septum,
   so they need to stay thinner than the shared trunk above them. */
.cond-bundle { stroke-width: calc(3.6px + var(--lvl, 0) * 3.4px); }
.cond-track-shadow { stroke: var(--myo-edge); stroke-width: 9; opacity: .35; fill: none;
  stroke-linecap: round; stroke-linejoin: round; }
.cond-purkinje { stroke-width: 2.2; }
.cond-track.is-active, .cond-purkinje.is-active { filter: url(#condGlow); stroke: var(--conduction-bright); }

/* The travelling impulse. A moving marker reads instantly at any playback
   speed, where a brightness change alone does not. */
.wavefront { fill: var(--conduction-bright); stroke: var(--ink); stroke-width: 1.4; }
.wavefront-group.is-held .wavefront { fill: var(--accent-soft); }
.wavefront-group.is-blocked .wavefront { fill: var(--danger); }
.wavefront-group.is-blocked .wavefront-halo { fill: var(--danger); }
.wavefront-halo { fill: var(--conduction-bright); opacity: .28; }

.node { fill: var(--conduction); stroke: var(--ink); stroke-width: 1.4; opacity: calc(.62 + var(--lvl, 0) * .38); }
.node.is-active { fill: var(--conduction-bright); filter: url(#condGlow); }
.node.is-delay { fill: var(--accent-soft); }
.node.is-blocked { fill: var(--danger); stroke: var(--danger); opacity: 1; }

.block-x { stroke: var(--danger); stroke-width: 4; stroke-linecap: round; }
.ectopic-mark { fill: none; stroke: var(--danger); stroke-width: 3; stroke-dasharray: 4 4; }

/* Flow arrows. A dark outline keeps them legible wherever they cross — a red
   arrow over the red left ventricle, a blue one over the blue right — and gives
   the two circulations a non-colour difference as well as a hue one. */
.flow-arrow path { stroke: var(--ink); stroke-width: 1.1; stroke-linejoin: round; paint-order: stroke; }
.flow-ox path { fill: var(--flow-ox); }
.flow-deox path { fill: var(--flow-deox); }
:root[data-theme="dark"] .flow-arrow path, html.dark .flow-arrow path { stroke: #17140E; }

.anno-line { stroke: var(--quiet); stroke-width: 1; fill: none; }
.anno-dot { fill: var(--accent); }
.anno-text { font: 600 13px var(--font-ui); fill: var(--ink); }
.anno { transition: opacity .18s ease; }

.heart-svg.has-spotlight .layer-chambers,
.heart-svg.has-spotlight .layer-vessels { opacity: .34; }
.heart-svg.has-spotlight [data-region].is-spotlit { opacity: 1 !important; }
.heart-svg.has-spotlight .chamber.is-spotlit,
.heart-svg.has-spotlight .valve.is-spotlit { filter: drop-shadow(0 0 7px var(--conduction-bright)); }

/* ---------------------------------------------------------------- ecg pane */

.ecg-pane .panel-body { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s2); }
.ecg-canvas-wrap { position: relative; flex: 1 1 auto; min-height: 130px; }
.ecg-canvas-wrap canvas { width: 100%; height: 100%; display: block; border-radius: 5px; }
.ecg-strip-wrap { flex: 0 0 auto; height: 168px; }
.ecg-detail-wrap { flex: 1 1 auto; min-height: 150px; }
.ecg-twelve-wrap { flex: 1 1 auto; min-height: 260px; }
.stage[data-view="twelve"] .ecg-pane .panel-body { gap: var(--s1); }

.lens-row {
  display: flex; gap: var(--s3); align-items: center;
  flex: 0 0 auto; padding: var(--s2);
  background: var(--paper); border: 1px solid var(--rule); border-radius: 6px;
}
.lens-canvas { flex: 0 0 132px; height: 132px; }
.lens-canvas canvas { width: 100%; height: 100%; display: block; }
.lens-note { margin: 0; font-size: 12.5px; color: var(--ink); }
.lens-note b { display: block; font-size: 11px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }

/* The explainer appears only when a wave is selected, directly under the
   tracing it explains, so the text and the thing it describes are never far
   apart. It replaces nothing permanently and adds nothing until asked for. */
.wave-explainer {
  flex: 0 0 auto; border: 1px solid var(--accent);
  border-left-width: 4px; border-radius: 0 7px 7px 0;
  background: color-mix(in srgb, var(--accent) 6%, var(--white));
  padding: var(--s2) var(--s3);
}
.wave-explainer-head { display: flex; align-items: center; gap: var(--s2); }
.wave-explainer h3 {
  margin: 0; flex: 1; font-family: var(--font-display); font-size: 16px;
}
.wave-explainer dl { margin: var(--s2) 0 0; display: grid; gap: 5px; }
.wave-explainer dt {
  font-size: 10px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--muted);
}
.wave-explainer dd { margin: 0 0 3px; font-size: 13.5px; line-height: 1.45; }
.wave-explainer dd.caution { color: var(--ink); border-left: 3px solid var(--danger); padding-left: 9px; }
.hint-inline { color: var(--accent); font-style: normal; font-weight: 600; }
.ecg-canvas-wrap canvas.is-pickable { cursor: crosshair; }

.readout-row {
  display: flex; flex-wrap: wrap; gap: var(--s2);
  flex: 0 0 auto;
}
.readout {
  background: var(--paper); border: 1px solid var(--rule);
  border-radius: 6px; padding: 4px 9px; min-width: 72px;
}
.readout dt { font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0; }
.readout dd { margin: 0; font-size: 15.5px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; }
.readout dd small { font-size: 11px; font-weight: 600; color: var(--muted); }
.readout[data-tone="warn"] { border-color: var(--warn); }
.readout[data-tone="warn"] dd { color: var(--warn); }
.readout[data-tone="critical"] { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, var(--paper)); }
.readout[data-tone="critical"] dd { color: var(--danger); }

.illustrative {
  font-size: 11px; color: var(--muted); font-style: italic;
}

/* --------------------------------------------------------------- timeline */

.timeline { flex: 0 0 auto; }
.tl-wrap { position: relative; display: flex; flex-direction: column; gap: 3px; }
.tl-track { display: flex; align-items: stretch; gap: var(--s2); min-height: 22px; }
.tl-label {
  flex: 0 0 66px; font-size: 10px; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; color: var(--muted); align-self: center; text-align: right;
}
.tl-lane {
  position: relative; flex: 1 1 auto; height: 22px;
  background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden;
}
.tl-block {
  position: absolute; top: 2px; bottom: 2px;
  border-radius: 3px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; color: var(--ink);
  white-space: nowrap;
}
.tl-block span { padding: 0 4px; overflow: hidden; text-overflow: ellipsis; }
.t-p    { background: color-mix(in srgb, var(--conduction) 34%, var(--white)); }
.t-av   { background: color-mix(in srgb, var(--accent-soft) 30%, var(--white)); }
.t-qrs  { background: color-mix(in srgb, var(--conduction) 62%, var(--white)); }
.t-t    { background: color-mix(in srgb, var(--sage) 34%, var(--white)); }
.t-av.is-blocked {
  background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--danger) 26%, var(--white)) 0 5px, var(--white) 5px 10px);
  border: 1.5px solid var(--danger); color: var(--danger);
}
.m-atrial { background: color-mix(in srgb, var(--flow-deox) 26%, var(--white)); }
.m-ivc    { background: color-mix(in srgb, var(--muted) 20%, var(--white)); }
.m-eject  { background: color-mix(in srgb, var(--flow-ox) 40%, var(--white)); }
.m-ivr    { background: color-mix(in srgb, var(--muted) 14%, var(--white)); }
.m-fill   { background: color-mix(in srgb, var(--flow-deox) 15%, var(--white)); }
/* The kick is a distinct phase, not a shade of filling: it is the part a
   student loses in fibrillation and the part a stiff ventricle leans on. */
.m-kick   { background: color-mix(in srgb, var(--flow-deox) 42%, var(--white)); }
.m-none   { background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--danger) 18%, var(--white)) 0 6px, var(--white) 6px 12px); color: var(--danger); }

.tl-cursor {
  position: absolute; top: 0; bottom: 0; left: 0; width: 2px;
  background: var(--accent); pointer-events: none;
  margin-left: 74px;
}

.tl-legend {
  display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3);
  margin: 5px 0 0 74px; font-size: 10.5px; color: var(--muted);
}
.tl-key { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.tl-key i { width: 13px; height: 13px; border-radius: 2px; display: inline-block; border: 1px solid var(--rule-strong); }

/* Timeline blocks must not rely on fill colour alone. Each family carries a
   distinct edge treatment, which survives greyscale, colour-blindness and
   Windows high-contrast mode. */
.t-p    { border-left: 3px solid var(--conduction); }
.t-av   { border-left: 3px dotted var(--accent); }
.t-qrs  { border-left: 3px double var(--conduction); }
.t-t    { border-left: 3px solid var(--sage); }
.m-atrial { border-left: 3px solid var(--flow-deox); }
.m-ivc, .m-ivr { border-left: 3px dashed var(--muted); }
.m-eject  { border-left: 3px solid var(--flow-ox); }
.m-fill   { border-left: 3px dotted var(--flow-deox); }
.m-kick   { border-left: 3px solid var(--flow-deox); }
.tl-key i.t-av, .tl-key i.m-fill { border-left-style: dotted; }
.tl-key i.t-qrs { border-left-style: double; }
.tl-key i.m-ivc { border-left-style: dashed; }

/* Correctness in a prediction is stated in words, not only in green and red. */
.quiz-option .verdict {
  margin-left: auto; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
}
.quiz-option.is-correct .verdict { color: var(--sage); }
.quiz-option.is-wrong .verdict { color: var(--danger); }
.quiz-option.is-correct .key::after { content: " ✓"; }
.quiz-option.is-wrong .key::after { content: " ✕"; }

/* ------------------------------------------------------------------- rail */

.rail .panel-body { padding: 0; }
.rail-tabs {
  display: flex; border-bottom: 1px solid var(--rule); background: var(--paper); flex: 0 0 auto;
}
.rail-tabs button {
  flex: 1; appearance: none; border: 0; background: transparent; cursor: pointer;
  padding: 10px 4px; font-size: 12px; font-weight: 700; color: var(--muted);
  border-bottom: 3px solid transparent; min-height: 44px;
}
.rail-tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); background: var(--white); }

.rail-panes { flex: 1 1 auto; min-height: 0; overflow: auto; }
.rail-pane { padding: var(--s3); }
.rail-pane[hidden] { display: none; }

.eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 var(--s1);
}
.headline {
  font-family: var(--font-display); font-size: 19px; line-height: 1.28;
  margin: 0 0 var(--s3);
}
.rail-pane h4 {
  font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--muted); margin: var(--s4) 0 var(--s2);
}
.rail-pane p { margin: 0 0 var(--s2); font-size: 14px; }
.rail-pane ul { margin: 0 0 var(--s2); padding-left: 18px; font-size: 14px; }
.rail-pane li { margin-bottom: 4px; }

/* Feature table — the systematic strip read */
.features { width: 100%; border-collapse: collapse; font-size: 13px; }
.features th {
  text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .04em;
  text-transform: uppercase; color: var(--muted); padding: 5px 8px 5px 0;
  vertical-align: top; width: 84px; white-space: nowrap;
}
.features td { padding: 5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }

/* Causal chain — the core teaching object */
.chain { list-style: none; margin: 0; padding: 0; counter-reset: chain; }
.chain li { position: relative; padding-left: 30px; padding-bottom: var(--s3); }
.chain li::before {
  counter-increment: chain; content: counter(chain);
  position: absolute; left: 0; top: 1px;
  width: 21px; height: 21px; border-radius: 50%;
  background: var(--accent); color: var(--on-accent);
  font-size: 11px; font-weight: 700; display: grid; place-items: center;
}
.chain li:not(:last-child)::after {
  content: ""; position: absolute; left: 10px; top: 25px; bottom: 3px;
  width: 2px; background: var(--rule-strong);
}
.chain .layer-tag {
  display: inline-block; font-size: 9px; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; padding: 2px 6px; border-radius: 3px; margin-bottom: 3px;
  background: var(--paper); color: var(--muted); border: 1px solid var(--rule);
}
.chain .layer-trigger    { color: var(--muted); }
.chain .layer-cellular   { color: #6C4E8C; border-color: #6C4E8C; }
.chain .layer-conduction { color: var(--warn); border-color: var(--warn); }
.chain .layer-ecg        { color: var(--accent); border-color: var(--accent); }
.chain .layer-mechanical { color: var(--flow-deox); border-color: var(--flow-deox); }
.chain .layer-clinical   { color: var(--danger); border-color: var(--danger); }
.chain .chain-label { font-weight: 700; font-size: 13px; display: block; }
.chain .chain-text { font-size: 13.5px; margin: 2px 0 0; color: var(--ink); }
.chain .more {
  appearance: none; background: none; border: 0; padding: 3px 0 0;
  color: var(--accent); font-size: 12px; font-weight: 700; cursor: pointer;
  text-decoration: underline; text-underline-offset: 2px;
}
.chain .detail {
  margin: var(--s2) 0 0; padding: var(--s2) var(--s3);
  background: var(--paper); border-left: 3px solid var(--accent);
  border-radius: 0 5px 5px 0; font-size: 13px;
}
.chain li.is-current { }
.chain li.is-current .chain-label { color: var(--accent); }

.callout {
  border: 1px solid var(--rule-strong); border-left: 4px solid var(--accent);
  border-radius: 0 6px 6px 0; padding: var(--s2) var(--s3);
  background: var(--paper); font-size: 13px; margin: 0 0 var(--s3);
}
.callout.limit { border-left-color: var(--danger); }
.callout.limit strong { color: var(--danger); }
.callout.variable { border-left-color: var(--warn); }
.callout h5 { margin: 0 0 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.pill-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: var(--s3); }
.pill {
  appearance: none; cursor: pointer;
  font-size: 12px; font-weight: 600; padding: 5px 10px; min-height: 32px;
  border: 1px solid var(--rule-strong); border-radius: 999px;
  background: var(--white); color: var(--muted);
}
.pill:hover { border-color: var(--accent); color: var(--accent); }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* ---------------------------------------------------------------- transport */

.transport {
  display: flex; align-items: center; gap: var(--s2);
  padding: var(--s2) var(--s4); border-top: 1px solid var(--rule);
  background: var(--paper); flex-wrap: wrap;
}
.transport .btn-icon { min-width: 44px; min-height: 44px; flex: 0 0 auto; }
.transport .spacer { flex: 0 0 var(--s2); }

.event-chip {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 14px; font-weight: 600; color: var(--ink);
  background: var(--white); border: 1px solid var(--rule-strong);
  border-radius: 999px; padding: 6px 15px; min-height: 36px;
  flex: 1 1 auto; min-width: 0; max-width: 72ch;
}
.event-chip > span:last-child {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.event-chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--conduction); flex: 0 0 auto; }

.speed-wrap { display: flex; align-items: center; gap: var(--s2); }
.speed-wrap input[type="range"] { width: 116px; accent-color: var(--accent); height: 28px; }
.speed-val { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 46px; }

.slider-row { display: grid; grid-template-columns: 1fr auto; gap: var(--s1) var(--s2); align-items: center; margin-bottom: var(--s3); }
.slider-row label { font-size: 13px; font-weight: 600; }
.slider-row .val { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.slider-row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); height: 30px; }
.slider-row .hint { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin: -4px 0 0; }

/* ------------------------------------------------------------------ modal */

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(20, 16, 12, .5);
  display: grid; place-items: center; padding: var(--s4); z-index: 100;
}
.modal-backdrop[hidden] { display: none; }
.modal {
  background: var(--white); border-radius: 10px; box-shadow: var(--shadow);
  max-width: 720px; width: 100%; max-height: 86vh; overflow: auto;
  border: 1px solid var(--rule-strong);
}
.modal-head {
  display: flex; align-items: flex-start; gap: var(--s3);
  padding: var(--s4) var(--s4) var(--s2); border-bottom: 1px solid var(--rule);
}
.modal-head h2 { font-family: var(--font-display); font-size: 21px; margin: 0; flex: 1; }
.modal-body { padding: var(--s4); }
.modal-body h3 { font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: var(--s4) 0 var(--s2); }
.modal-body p, .modal-body li { font-size: 14px; }
.modal-body ol.refs { font-size: 12.5px; padding-left: 20px; }
.modal-body ol.refs li { margin-bottom: 7px; }

/* ------------------------------------------------------------------- quiz */

.quiz-stem { font-size: 15px; font-weight: 600; margin: 0 0 var(--s3); line-height: 1.42; }
.quiz-options { list-style: none; margin: 0 0 var(--s3); padding: 0; display: grid; gap: 7px; }
.quiz-option {
  display: flex; gap: var(--s2); align-items: flex-start; width: 100%; text-align: left;
  padding: 11px 13px; min-height: 44px;
  border: 1px solid var(--rule-strong); border-radius: 7px; background: var(--white);
  cursor: pointer; font-size: 14px;
}
.quiz-option:hover { border-color: var(--accent); }
.quiz-option .key {
  flex: 0 0 22px; height: 22px; border-radius: 50%; background: var(--paper);
  border: 1px solid var(--rule-strong); display: grid; place-items: center;
  font-size: 11px; font-weight: 800;
}
.quiz-option[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--white)); }
.quiz-option[aria-pressed="true"] .key { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.quiz-option.is-correct { border-color: var(--sage); background: color-mix(in srgb, var(--sage) 14%, var(--white)); }
.quiz-option.is-correct .key { background: var(--sage); color: #fff; border-color: var(--sage); }
.quiz-option.is-wrong { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 9%, var(--white)); }
.quiz-option.is-wrong .key { background: var(--danger); color: #fff; border-color: var(--danger); }
.quiz-feedback {
  border-left: 4px solid var(--sage); background: var(--paper);
  padding: var(--s3); border-radius: 0 6px 6px 0; font-size: 13.5px; margin-bottom: var(--s3);
}
.quiz-feedback.is-wrong { border-left-color: var(--danger); }
.quiz-meta { font-size: 11px; color: var(--muted); display: flex; gap: var(--s3); flex-wrap: wrap; margin-top: var(--s2); }
.quiz-score { font-size: 13px; font-weight: 700; }

/* --------------------------------------------------------------- lessons */

.lesson-list { display: grid; gap: var(--s2); }
.lesson-card {
  text-align: left; width: 100%; padding: var(--s3);
  border: 1px solid var(--rule-strong); border-radius: 7px; background: var(--white);
  cursor: pointer;
}
.lesson-card:hover { border-color: var(--accent); }
.lesson-card strong { display: block; font-size: 14.5px; margin-bottom: 3px; }
.lesson-card span { font-size: 12.5px; color: var(--muted); }
.lesson-card .done { color: var(--sage); font-weight: 700; }

.step-head { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s2); }
.step-count { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .05em; }
.step-dots { display: flex; gap: 4px; flex: 1; }
.step-dot { width: 100%; height: 4px; border-radius: 2px; background: var(--rule-strong); }
.step-dot.is-done { background: var(--accent-soft); }
.step-dot.is-current { background: var(--accent); }
.step-title { font-family: var(--font-display); font-size: 18px; margin: 0 0 var(--s2); }
.step-text { font-size: 15px; line-height: 1.5; margin: 0 0 var(--s3); }
.step-nav { display: flex; gap: var(--s2); margin-top: var(--s3); }

.predict { border: 1px solid var(--accent); border-radius: 7px; padding: var(--s3); background: color-mix(in srgb, var(--accent) 5%, var(--white)); }
.predict h5 { margin: 0 0 var(--s2); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.predict p { font-size: 14.5px; font-weight: 600; margin: 0 0 var(--s2); }

/* --------------------------------------------------------- signal detection */

.sdt-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s2); margin: var(--s3) 0; }
.sdt-cell { border: 1px solid var(--rule); border-radius: 6px; padding: var(--s2); text-align: center; background: var(--paper); }
.sdt-cell dt { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px; }
.sdt-cell dd { margin: 0; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sdt-cell.hit dd { color: var(--sage); }
.sdt-cell.fa dd { color: var(--danger); }

/* ------------------------------------------------------------- responsive */

@media (max-width: 1180px) {
  .stage { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0,1fr) minmax(0,240px); }
  .stage[data-view="twelve"] { grid-template-columns: 200px 1fr; }
  .rail { grid-column: 1 / -1; }
  /* With the rail hidden there is no second row to fill, and reserving one
     leaves a 240 px band of dead space under the panels. */
  .stage[data-rail="closed"] { grid-template-rows: minmax(0, 1fr); }
  .stage[data-rail="closed"] .rail { display: none; }
}

@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100vh; }
  .stage {
    grid-template-columns: 1fr; grid-template-rows: none;
    overflow: visible;
  }
  .stage[data-view="twelve"] { grid-template-columns: 1fr; }
  .heart-holder { min-height: 320px; }
  .ecg-twelve-wrap { min-height: 420px; overflow-x: auto; }
  .ecg-twelve-wrap canvas { min-width: 640px; }
  .rail { max-height: none; }
  .transport { position: sticky; bottom: 0; z-index: 20; }
  .topbar { flex-wrap: wrap; }
}

@media (max-width: 560px) {
  .brand { font-size: 15px; }
  .transport { gap: 5px; padding: var(--s2); }
  .event-chip { max-width: 100%; order: 10; flex-basis: 100%; }
  .segmented button { padding: 7px 11px; font-size: 13px; }
}

/* Classroom projection: everything a size larger. */
:root[data-size="large"] {
  font-size: 19px;
}
:root[data-size="large"] .anno-text { font-size: 16px; }
:root[data-size="large"] .readout dd { font-size: 21px; }
:root[data-size="large"] .step-text { font-size: 18px; }
:root[data-size="large"] .quiz-stem { font-size: 18px; }
:root[data-size="large"] .quiz-option { font-size: 16px; }
:root[data-size="large"] .chain .chain-text { font-size: 15.5px; }
:root[data-size="large"] .rail-pane p, :root[data-size="large"] .rail-pane ul { font-size: 15.5px; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

@media (forced-colors: active) {
  .panel, .readout, .tl-lane, .quiz-option { border: 1px solid CanvasText; }
  .segmented button[aria-pressed="true"], .btn.is-active { forced-color-adjust: none; background: Highlight; color: HighlightText; }
  .cond-track.is-active, .node.is-active { stroke: Highlight; }
}

@media print {
  .transport, .topbar, .rail { display: none; }
  .app { height: auto; }
}

</style>

</head>
<body>
<a class="skip-link" href="#stage">Skip to the simulator</a>

<div class="app">

  <header class="topbar">
    <h1 class="brand">Cardiac Cycle &amp; ECG<small>Interactive teaching simulator</small></h1>

    <div class="segmented" role="group" aria-label="Learner mode">
      <button type="button" id="modeBasic" aria-pressed="true" title="Introductory: one rhythm lead">Basic</button>
      <button type="button" id="modeAdvanced" aria-pressed="false" title="Advanced: full 12-lead, conditions and haemodynamics">Advanced</button>
    </div>

    <div class="field">
      <label for="rhythmSelect">Rhythm</label>
      <select id="rhythmSelect"></select>
    </div>

    <div class="field" id="conditionField">
      <label for="conditionSelect">Condition</label>
      <select id="conditionSelect"></select>
    </div>

    <span class="topbar-spacer"></span>

    <div class="segmented" role="group" aria-label="ECG view" id="viewToggle" hidden>
      <button type="button" id="viewSingle" aria-pressed="false">Single lead</button>
      <button type="button" id="viewTwelve" aria-pressed="true">12-lead</button>
    </div>

    <button type="button" class="btn btn-ghost btn-icon" id="sizeToggle" aria-pressed="false"
            title="Classroom text size" aria-label="Toggle classroom text size">Aa</button>
    <button type="button" class="btn btn-ghost btn-icon" id="themeToggle"
            title="Light or dark" aria-label="Toggle light or dark theme">◐</button>
    <button type="button" class="btn btn-ghost" id="aboutBtn">About<span class="wide-only">this model</span></button>
  </header>

  <main class="stage" id="stage" data-view="single" data-rail="open">

    <section class="panel heart-pane" aria-labelledby="heartPanelTitle">
      <div class="panel-head">
        <h2 class="panel-title" id="heartPanelTitle">The heart</h2>
        <span class="topbar-spacer"></span>
        <div class="field">
          <label for="focusSelect" class="sr-only">Focus</label>
          <select id="focusSelect" aria-label="What to show in the heart">
            <option value="anatomy">Anatomy</option>
            <option value="conduction">Conduction</option>
            <option value="contraction">Contraction</option>
            <option value="flow">Blood flow</option>
            <option value="integrated">All together</option>
          </select>
        </div>
        <div class="field">
          <label for="labelSelect" class="sr-only">Labels</label>
          <select id="labelSelect" aria-label="Which labels to show">
            <option value="none">No labels</option>
            <option value="chambers">Chambers</option>
            <option value="valves">Valves</option>
            <option value="vessels">Vessels</option>
            <option value="conduction">Conduction</option>
          </select>
        </div>
      </div>
      <div class="heart-holder" id="heartHolder"></div>
    </section>

    <section class="panel ecg-pane" aria-labelledby="ecgPanelTitle">
      <div class="panel-head">
        <h2 class="panel-title" id="ecgPanelTitle">The tracing</h2>
        <span class="topbar-spacer"></span>
        <div class="field" id="leadField">
          <label for="leadSelect" class="sr-only">Lead</label>
          <select id="leadSelect" aria-label="Which lead to show"></select>
        </div>
      </div>
      <div class="panel-body">
        <div class="ecg-canvas-wrap ecg-strip-wrap" id="stripWrap">
          <canvas id="stripCanvas" aria-label="Rhythm strip"></canvas>
        </div>
        <div class="ecg-canvas-wrap ecg-detail-wrap" id="detailWrap">
          <canvas id="detailCanvas" aria-label="One complex magnified, with each wave named and the intervals marked"></canvas>
        </div>
        <div class="ecg-canvas-wrap ecg-twelve-wrap" id="twelveWrap" hidden>
          <canvas id="twelveCanvas" aria-label="Twelve-lead electrocardiogram, all leads recorded at the same moment"></canvas>
        </div>
        <div class="lens-row" id="lensRow" hidden>
          <div class="lens-canvas">
            <canvas id="lensCanvas" aria-label="The heart's net electrical vector during the QRS, with the limb-lead axes"></canvas>

/* 10-namespace.js */
/* 10-namespace.js — global namespace, constants, deterministic RNG, small math helpers. */
(function (w) {
  "use strict";

  var CARDIAC = {
    VERSION: "1.0.0",
    MODEL_VERSION: "vector-dipole-1.0",
    CONTENT_VERSION: "nr324-1.0",
    REVIEWED: "Educational model — not clinically validated",

    content: {
      sources: [],
      rhythms: {},
      conditions: {},
      mechanisms: {},
      questions: [],
      lessons: [],
      waveGuide: {}
    },
    engine: {},
    render: {},
    ui: {},
    state: null
  };

  /* ---------- constants ---------- */

  CARDIAC.FS = 500;                  // waveform sample rate, Hz
  CARDIAC.LEAD_ORDER = ["I", "II", "III", "aVR", "aVL", "aVF",
                        "V1", "V2", "V3", "V4", "V5", "V6"];
  CARDIAC.LIMB_LEADS = ["I", "II", "III", "aVR", "aVL", "aVF"];
  CARDIAC.PRECORDIAL = ["V1", "V2", "V3", "V4", "V5", "V6"];

  // 3 x 4 print grid: rows are read left to right.
  CARDIAC.GRID_ROWS = [
    ["I", "aVR", "V1", "V4"],
    ["II", "aVL", "V2", "V5"],
    ["III", "aVF", "V3", "V6"]
  ];

  CARDIAC.REGIONS = ["sa-node", "right-atrium", "left-atrium", "av-node",
    "his-bundle", "right-bundle", "left-bundle", "right-purkinje",
    "left-purkinje", "right-ventricle", "left-ventricle"];

  /* ---------- deterministic PRNG (mulberry32) ---------- */

  CARDIAC.rng = function (seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  /* ---------- math helpers ---------- */

  var M = {};

  M.clamp = function (v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); };

  M.lerp = function (a, b, t) { return a + (b - a) * t; };

  // Smooth 0->1 ramp with zero slope at both ends.
  M.smooth = function (t) {
    t = M.clamp(t, 0, 1);
    return t * t * (3 - 2 * t);
  };

  // Raised cosine bump on [0,1]; 0 at both ends, 1 at centre.
  M.hump = function (u) {
    if (u <= 0 || u >= 1) return 0;
    return 0.5 * (1 - Math.cos(2 * Math.PI * u));
  };

  // Skewed bump. k > 1 shifts the peak later (slow rise, fast fall — a normal
  // T wave). k = 1 is symmetric (the hyperkalaemic T). k < 1 peaks early.
  M.skewHump = function (u, k) {
    if (u <= 0 || u >= 1) return 0;
    return M.hump(k === 1 ? u : Math.pow(u, k));
  };

  // Flat-topped segment with smooth shoulders — used for ST deviation.
  M.plateau = function (u, edge) {
    if (u <= 0 || u >= 1) return 0;
    if (u < edge) return M.smooth(u / edge);
    if (u > 1 - edge) return M.smooth((1 - u) / edge);
    return 1;
  };

  M.norm3 = function (v) {
    var m = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]) || 1;
    return [v[0] / m, v[1] / m, v[2] / m];
  };

  M.dot3 = function (a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; };

  M.scale3 = function (v, s) { return [v[0] * s, v[1] * s, v[2] * s]; };

  // Rotate a vector in the frontal plane (about the anterior/posterior axis).
  M.rotFrontal = function (v, deg) {
    var r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    return [v[0] * c - v[1] * s, v[0] * s + v[1] * c, v[2]];
  };

  CARDIAC.M = M;

  w.CARDIAC = CARDIAC;
})(window);

</script>

  "lvh-3": {
    "detail": "Every depolarizing region adds a small current vector; the ECG records their sum. Thickening the left-posterior-lateral wall adds muscle whose vectors point left, back and down, so the summed QRS vector grows in that direction. The wall is also physically deeper, so the activation wavefront needs longer to travel from inner to outer surface — the QRS widens a little and its peak arrives later.",
    "figure": null

  "lvh-4": {
    "detail": "Lead polarity decides the sign. A lead whose positive electrode faces the enlarged leftward vector (I, aVL, V5, V6) sees the wave coming toward it and writes a taller upward R. A lead facing the opposite way (V1, V2) sees the same enlarged vector going away and writes a deeper downward S. One vector, opposite deflections — which is exactly why a single rhythm lead cannot judge it.",
    "figure": null
  },

  "lvh-5": {
    "detail": "Repolarization normally travels opposite to depolarization, keeping the T wave upright. A thickened wall repolarizes unevenly across its depth, and the inner layer, whose blood supply is squeezed hardest, recovers abnormally. The resulting ST-T vector points away from the thickened wall: downsloping ST depression with asymmetric T inversion in the lateral leads. Ischemia can look identical.",
    "figure": null
  },

  "lvh-7": {
    "detail": "Voltage criteria are fairly specific but insensitive — most people with echocardiographic hypertrophy do not meet them. Voltage also reflects everything between muscle and electrode: chest-wall thickness, adipose tissue, air-trapping lung disease, pericardial or pleural fluid, and electrode position. Echocardiography measures wall thickness and mass; the ECG only suggests.",
    "figure": null
  },

  "rvh-3": {
    "detail": "Left ventricular mass normally exceeds right ventricular mass several times over, so left-directed vectors dominate every beat and the right ventricle is electrically hidden. Right ventricular hypertrophy is therefore a late ECG finding: the right-anterior forces must grow enough to survive the cancellation. A normal ECG never excludes it, and early disease is commonly silent.",
    "figure": null
  },

  "rvh-4": {
    "detail": "V1 sits over the right ventricle. Normally the septum depolarizes left to right, toward V1, writing the small initial r; the much larger left ventricular forces then travel away, writing the deep S. When right-anterior mass grows, those later forces travel toward V1 instead, so R grows until it exceeds S. The same shift leaves persistent S waves in I, V5 and V6 and swings the axis rightward.",
    "figure": null
  },

  "hfref-3": {
    "detail": "Stroke volume = end-diastolic volume - end-systolic volume; ejection fraction = stroke volume / end-diastolic volume. Weak contraction leaves more blood behind, so end-systolic volume climbs. Stroke volume shrinks and, because the denominator does not shrink with it, the fraction falls too. A reduced fraction really does signal weak contraction; a preserved one proves nothing.",
    "figure": null
  },

  "hfref-5": {
    "detail": "Falling output is read by baroreceptors and the kidney as low volume. Sympathetic outflow raises heart rate and contractility; renin-angiotensin-aldosterone signaling constricts vessels and retains sodium and water. Pressure is defended, but a faster rate shortens diastole and raises oxygen demand, vasoconstriction raises afterload, and retained fluid raises the filling pressures already too high.",
    "figure": null
  },

  "hfpef-4": {
    "detail": "Ejection fraction is a ratio, not a volume. If end-diastolic volume falls from a normal value to a much smaller one, an unchanged percentage now represents a smaller stroke volume. The fraction stayed the same because the denominator fell alongside the numerator. Preserved ejection fraction therefore never means normal cardiac output, normal filling pressure, or adequate perfusion.",
    "figure": null
  },

  "hfpef-5": {
    "detail": "Diastole shortens faster than systole as rate rises, and a stiff ventricle fills slowly, so tachycardia steals the time it needs most. Atrial contraction — the atrial kick — contributes a larger share of end-diastolic volume when the ventricle is stiff, so atrial fibrillation removes an outsized share of filling. A fast, irregular rhythm does both, so decompensation can be abrupt.",
    "figure": null
  }

      var e = 1 - Math.pow(1 - u, 2.1);

      R = M.lerp(cur.right.edv, cur.right.esv, e);
      phase = "ventricular-ejection";
    } else if (tMs < cur.fillStart) {
      L = cur.left.esv; R = cur.right.esv; phase = "isovolumetric-relaxation";
    } else {
      var target = next || cur;
      var span = Math.max(60, (next ? next.closeMs : cur.fillStart + 600) - cur.fillStart);
      var f = M.clamp((tMs - cur.fillStart) / span, 0, 1);
      // Rapid early filling, diastasis, then the atrial kick at the end.
      // Passive filling and the kick get exactly the shares the end-diastolic
      // volume was built from, so what a learner watches climb agrees with what
      // the readouts say. Passive alone must visibly leave the ventricle short:
      // the gap the atria close is the whole reason the atrial kick is taught.
      var kfA = target.kick ? (target.kickFrac || 0) : 0;
      var passiveShape = (1 - Math.exp(-3.1 * f)) / (1 - Math.exp(-3.1));
      var shape = passiveShape * (1 - kfA);
      if (kfA > 0 && f > KICK_ONSET) {
        shape += M.smooth((f - KICK_ONSET) / (1 - KICK_ONSET)) * kfA;
      }
      shape = M.clamp(shape, 0, 1);
      L = M.lerp(cur.left.esv, target.left.edv, shape);
      R = M.lerp(cur.right.esv, target.right.edv, shape);
      phase = (kfA > 0 && f > KICK_ONSET) ? "atrial-systole"
            : (f < 0.4 ? "early-filling" : "late-filling");
    }
    return { left: L, right: R, phase: phase, beat: cur };
  }

  /* Atrial cavity volume: fills continuously from the great veins, empties into
   * the ventricle when the AV valve is open, and squeezes during atrial systole. */
  var ATRIAL_FULL = 0.86;     // just before it contracts
  var ATRIAL_EMPTY = 0.54;    // just after
  var ATRIAL_REFILL_TAU = 260;

  function atrialVolumeAt(schedule, hemo, tMs) {
    if (schedule.rhythmId === "af") {
      // Fibrillating atria quiver; they do not squeeze.
      return { volume: ATRIAL_FULL + 0.02 * Math.sin(tMs / 40), contracting: 0, quiver: true };
    }

    var last = null;
    for (var i = 0; i < schedule.events.length; i++) {
      var e = schedule.events[i];
      if (e.onsetMs > tMs) break;
      if (e.type === "atrial-systole") last = e;
    }
    if (!last) return { volume: ATRIAL_FULL, contracting: 0, quiver: false };

    var u = (tMs - last.onsetMs) / Math.max(1, last.durMs);
    if (u < 1) {
      // The squeeze. Emptying is one-way — the atrium does not rebound as it
      // relaxes, it stays down and refills from the great veins. A symmetric
      // bump put the atrium back to full the instant contraction ended, which
      // read as though nothing had been transferred to the ventricle at all.
      return {
        volume: M.lerp(ATRIAL_FULL, ATRIAL_EMPTY, M.smooth(u)),
        contracting: C.M.hump(u),
        quiver: false
      };
    }

    var since = tMs - (last.onsetMs + last.durMs);
    var refill = 1 - Math.exp(-since / ATRIAL_REFILL_TAU);
    return {
      volume: ATRIAL_EMPTY + (ATRIAL_FULL - ATRIAL_EMPTY) * refill,
      contracting: 0,
      quiver: false
    };
  }

  C.engine.hemo = {
    ejectionFractionFor: ejectionFractionFor,
    edvCapacity: edvCapacity,
    BASELINE: BASELINE,
    PRESETS: PRESETS,
    COMPENSATION: COMPENSATION,
    resolvePhysiology: resolvePhysiology,
    compute: compute,
    rollingOutput: rollingOutput,
    outputCategory: outputCategory,
    perfusionState: perfusionState,
    pulsePresent: pulsePresent,
    ARREST_STATES: ARREST_STATES,
    ventricularVolumeAt: ventricularVolumeAt,
    atrialVolumeAt: atrialVolumeAt
  };
})(window.CARDIAC);

<script>
/* 34-engine-frame.js */
/* 34-engine-frame.js — one snapshot for every renderer.
 *
 * The heart drawing, the ECG cursor, the timeline, the readouts and the screen
 * reader text all read this single object at the same simulation time. There is
 * one clock and one truth about what is happening.
 */
(function (C) {
  "use strict";

  var M = C.M;
  var R = C.engine.rhythm;
  var H = C.engine.hemo;

  var VALVES = ["tricuspid", "mitral", "pulmonic", "aortic"];

  var FLOW_PATHS = [
    { id: "svc-to-ra", from: "svc", to: "right-atrium", gate: null, rule: "venous" },
    { id: "ivc-to-ra", from: "ivc", to: "right-atrium", gate: null, rule: "venous" },
    { id: "pulmonary-veins-to-la", from: "pulmonary-veins", to: "left-atrium", gate: null, rule: "venous" },
    { id: "ra-to-rv", from: "right-atrium", to: "right-ventricle", gate: "tricuspid", rule: "filling" },
    { id: "la-to-lv", from: "left-atrium", to: "left-ventricle", gate: "mitral", rule: "filling" },
    { id: "rv-to-pulmonary-artery", from: "right-ventricle", to: "pulmonary-artery", gate: "pulmonic", rule: "ejection" },
    { id: "lv-to-aorta", from: "left-ventricle", to: "aorta", gate: "aortic", rule: "ejection" }
  ];

  /* --------------------------------------------------------- conduction map */

  var IDLE = { level: 0, state: "idle", progress: 0 };

  function regionActivation(schedule, tMs) {
    var map = {};
    for (var r = 0; r < C.REGIONS.length; r++) map[C.REGIONS[r]] = { level: 0, state: "idle", progress: 0 };

    var rhythm = schedule.rhythmId;

    /* Disorganised activity is not a wavefront travelling a path — it is many
     * wavefronts at once. Show it as such rather than as a normal impulse. */
    if (rhythm === "af") {
      var f = 0.45 + 0.35 * Math.abs(Math.sin(tMs / 37)) * Math.abs(Math.cos(tMs / 23));
      map["right-atrium"] = { level: f, state: "chaotic", progress: 0 };
      map["left-atrium"] = { level: f * 0.9, state: "chaotic", progress: 0 };
    }
    if (rhythm === "vf") {
      var g = 0.5 + 0.45 * Math.abs(Math.sin(tMs / 29) * Math.cos(tMs / 41));
      map["right-ventricle"] = { level: g, state: "chaotic", progress: 0 };
      map["left-ventricle"] = { level: g * 0.95, state: "chaotic", progress: 0 };
      map["right-purkinje"] = { level: g * 0.5, state: "chaotic", progress: 0 };
      map["left-purkinje"] = { level: g * 0.5, state: "chaotic", progress: 0 };
    }
    if (rhythm === "aflutter") {
      // Organised macro-reentry: one wavefront circling the right atrium.
      var cyc = schedule.continuous[0] ? schedule.continuous[0].cycleMs : 200;
      var ph = (tMs % cyc) / cyc;
      map["right-atrium"] = { level: 0.85, state: "reentry", progress: ph };
      map["left-atrium"] = { level: 0.5, state: "active", progress: (ph + 0.35) % 1 };
    }

    var events = schedule.events;
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (e.onsetMs > tMs + 1) break;
      var tail = e.type === "av-arrival" ? 0 : 90;   // brief afterglow so a fast
                                                     // event is still visible
      var u = (tMs - e.onsetMs) / e.durMs;
      var within = u >= 0 && u < 1;
      var glow = within ? 1 : (tMs - (e.onsetMs + e.durMs)) / tail;
      if (!within && (glow < 0 || glow > 1)) continue;
      var level = within ? (0.55 + 0.45 * Math.sin(Math.PI * Math.min(1, u * 1.6)))
                         : (1 - glow) * 0.45;
      if (level <= 0.02) continue;

      var regions = [e.region];
      if (e.region2) regions.push(e.region2);

      var state = "active";
      if (e.type === "av-arrival") {
        if (!e.conducted) {
          // The impulse arrived and stopped. That is the whole lesson.
          state = "blocked";
          level = Math.max(level, 0.8);
        } else {
          state = "delay";
        }
      }
      if (e.type === "ventricular-depolarization" && e.wide) state = "slow-spread";

      for (var k = 0; k < regions.length; k++) {
        var key = regions[k];
        if (!map[key]) continue;
        if (level >= map[key].level || state === "blocked") {
          map[key] = { level: Math.max(level, map[key].level), state: state,
                       progress: M.clamp(u, 0, 1), eventId: e.id, origin: e.origin };
        }
      }
    }

    /* The AV node holds the impulse for the whole PR interval — that pause is a
     * feature, not dead time, so keep it lit while it is happening. */
    for (var j = 0; j < events.length; j++) {
      var a = events[j];
      if (a.type !== "av-arrival" || !a.conducted) continue;
      if (a.onsetMs > tMs) break;
      var rel = tMs - a.onsetMs;
      var hold = (a.prMs || 160) - 45;
      if (rel >= 0 && rel < hold) {
        map["av-node"] = { level: 0.45 + 0.25 * (rel / hold), state: "delay",
                           progress: rel / hold, eventId: a.id };
      }
    }
    return map;
  }

  /* -------------------------------------------------------------- valves */

  function valveStates(schedule, tMs) {
    var v = {
      tricuspid: { open: true, since: -1e9 }, mitral: { open: true, since: -1e9 },
      pulmonic: { open: false, since: -1e9 }, aortic: { open: false, since: -1e9 }
    };
    var events = schedule.events;
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (e.onsetMs > tMs) break;
      var targets = [e.region, e.region2];
      for (var t = 0; t < 2; t++) {
        var name = targets[t];
        if (!name || !v[name]) continue;
        if (e.type === "av-valve-close" || e.type === "semilunar-valve-close") {
          v[name].open = false; v[name].since = e.onsetMs;
        } else if (e.type === "av-valve-open" || e.type === "semilunar-valve-open") {
          v[name].open = true; v[name].since = e.onsetMs;
        }
      }
    }
    for (var k = 0; k < VALVES.length; k++) {
      var n = VALVES[k];
      var age = tMs - v[n].since;
      v[n].motion = M.clamp(age / 55, 0, 1);          // leaflet travel, visual only
      v[n].openFraction = v[n].open ? M.smooth(v[n].motion) : 1 - M.smooth(v[n].motion);
      v[n].flowPermitted = v[n].open;
    }
    return v;
  }

  /* ---------------------------------------------------------------- flow */

  function flowStates(schedule, valves, phase, hemo, tMs, state) {
    var out = {};
    var stopped = hemo.noOutput || hemo.arrest;
    var ejecting = phase === "ventricular-ejection";
    var filling = phase === "early-filling" || phase === "late-filling" || phase === "atrial-systole";

    for (var i = 0; i < FLOW_PATHS.length; i++) {
      var p = FLOW_PATHS[i];
      var gateOpen = p.gate ? valves[p.gate].flowPermitted : true;
      var active = false, intensity = 0;

      if (p.rule === "venous") {
        active = !stopped;
        intensity = active ? 0.35 + 0.30 * hemo.physiology.preload : 0;
      } else if (p.rule === "filling") {
        active = gateOpen && filling && !stopped;
        intensity = active ? (phase === "atrial-systole" ? 0.95 : 0.70) : 0;
      } else {
        active = gateOpen && ejecting && !stopped;
        intensity = active ? 0.95 : 0;
      }
      // Hard invariant: nothing moves forward through a valve that is shut.
      if (p.gate && !gateOpen) { active = false; intensity = 0; }
      out[p.id] = { active: active, intensity: intensity, gate: p.gate, direction: "forward" };
    }
    return out;
  }

  /* -------------------------------------------------------------- snapshot */

  function frameAt(sim, tMs) {
    var schedule = sim.schedule, hemo = sim.hemo, state = sim.state;

    var vol = H.ventricularVolumeAt(hemo, tMs);
    var atr = H.atrialVolumeAt(schedule, hemo, tMs);
    var valves = valveStates(schedule, tMs);
    var phase = vol.phase;
    var flow = flowStates(schedule, valves, phase, hemo, tMs, state);
    var conduction = regionActivation(schedule, tMs);
    var roll = H.rollingOutput(hemo, tMs, 10000);
    var perf = H.perfusionState(state, roll.relative);

    var active = R.activeEvents(schedule, tMs);
    var lead = R.prevEvent(schedule, tMs + 1, R.STEP_TYPES);

    return {
      tMs: tMs,
      phase: phase,
      events: active,
      leadEvent: lead,
      conduction: conduction,
      valves: valves,
      flow: flow,
      volumes: { leftVentricle: vol.left, rightVentricle: vol.right,
                 atria: atr.volume, atrialContraction: atr.contracting, quiver: atr.quiver },
      beat: vol.beat,
      output: roll,
      outputCategory: H.outputCategory(roll.relative),
      perfusion: perf,
      arrest: hemo.arrest || hemo.noOutput,
      pulse: !hemo.noOutput && H.pulsePresent(state, roll.relative)
    };
  }

  /* ------------------------------------------------------- accessible text */

  var PHASE_TEXT = {
    "late-filling": "late ventricular filling",
    "atrial-systole": "atrial contraction topping up the ventricle",
    "isovolumetric-contraction": "ventricles squeezing with all four valves shut",
    "ventricular-ejection": "ejection through the open semilunar valves",
    "isovolumetric-relaxation": "ventricles relaxing with all four valves shut",
    "early-filling": "rapid early ventricular filling",
    "noncyclic": "no organised cycle"
  };

  var EVENT_TEXT = {
    "pacemaker-fire": "the pacemaker fires",
    "atrial-depolarization": "atrial depolarisation, drawn as the P wave",
    "av-arrival": "the impulse reaches the AV node",
    "av-release": "the AV node releases the impulse",
    "his-activation": "the His bundle activates",
    "bundle-activation": "the bundle branches activate",
    "purkinje-activation": "the Purkinje network activates",
    "ventricular-depolarization": "ventricular depolarisation, drawn as the QRS",
    "atrial-systole": "the atria contract",
    "av-valve-close": "the AV valves close (S1)",
    "semilunar-valve-open": "the semilunar valves open",
    "ventricular-ejection": "blood is ejected",
    "ventricular-repolarization": "ventricular repolarisation, drawn as the T wave",
    "semilunar-valve-close": "the semilunar valves close (S2)",
    "av-valve-open": "the AV valves open",
    "ventricular-filling": "the ventricles fill"
  };

  /* The label has to know where the impulse came from. Calling a flutter wave a
   * P wave, or a ventricular escape beat a normal QRS, would contradict the
   * teaching panel sitting next to it. */
  function eventLabel(e) {
    if (!e) return "Waiting for the first event";
    var base = EVENT_TEXT[e.type] || e.type;

    if (e.type === "atrial-depolarization") {
      if (e.origin === "flutter") base = "a flutter wave — organised atrial reentry, not a P wave";
      else if (e.origin === "ectopic-atrial") base = "an early atrial beat from a different focus, so the P wave looks different";
      else if (e.origin === "retrograde") base = "the atria activating backwards from the junction, usually hidden in the QRS or T";
    }
    if (e.type === "ventricular-depolarization" && e.wide) {
      base = e.origin === "escape-ventricular"
        ? "a ventricular escape beat — wide, because it never used the fast pathway"
        : "a ventricular beat that bypassed the fast pathway, so it is wide and slow";
    }
    if (e.type === "av-arrival" && e.conducted === false) {
      base = "the impulse reaches the AV node — blocked, so no QRS follows";
    }
    return base.charAt(0).toUpperCase() + base.slice(1);
  }

  function describe(sim, frame) {
    var s = sim.state, m = sim.measures;
    var parts = [];
    var rdef = C.content.rhythms[s.rhythm];
    parts.push((rdef ? rdef.label : s.rhythm) + ".");
    if (m.ventricularRate) parts.push("Ventricular rate about " + m.ventricularRate + " per minute" +
      (m.regular === false ? ", irregular." : ", regular."));
    if (m.atrialRate && m.atrialRate !== m.ventricularRate) parts.push("Atrial rate about " + m.atrialRate + ".");
    parts.push("Viewing lead " + s.selectedLead + ".");
    if (frame.leadEvent) parts.push("Now: " + eventLabel(frame.leadEvent) + ".");
    parts.push("Mechanically: " + (PHASE_TEXT[frame.phase] || frame.phase) + ".");
    var shut = [], open = [];
    for (var i = 0; i < VALVES.length; i++) (frame.valves[VALVES[i]].open ? open : shut).push(VALVES[i]);
    parts.push("Open valves: " + (open.length ? open.join(", ") : "none") + ".");
    parts.push("Relative cardiac output " + frame.outputCategory.label.toLowerCase() + ".");
    parts.push("Perfusion in this model: " + frame.perfusion + ".");
    if (frame.arrest) parts.push("This is an arrest state; there is no effective output.");
    return parts.join(" ");
  }

  C.engine.frame = {
    FLOW_PATHS: FLOW_PATHS,
    VALVES: VALVES,
    PHASE_TEXT: PHASE_TEXT,
    EVENT_TEXT: EVENT_TEXT,
    regionActivation: regionActivation,
    valveStates: valveStates,
    frameAt: frameAt,
    eventLabel: eventLabel,
    describe: describe
  };
})(window.CARDIAC);

<script>
/* 40-heart-geometry.js */
/* 40-heart-geometry.js — the anatomy, built from parameters rather than traced.
 *
 * Chambers, walls, valve planes, papillary muscles, chordae, the conduction
 * system and the Purkinje network are all derived from the same few functions,
 * so when a wall thickens or a cavity empties, everything attached to it moves
 * correctly instead of drifting.
 *
 * Building it parametrically rather than tracing a reference illustration is
 * what makes contraction possible at all: a flattened drawing cannot morph, and
 * every structure here has to be independently hideable, highlightable and
 * labellable.
 *
 * Frontal cutaway. The patient's right is on the viewer's left, as it is on a
 * chest film.
 */
(function (C) {
  "use strict";

  var M = C.M;

  var G = {
    // Extra room either side of the drawing so labels sit in gutters rather
    // than on top of the anatomy.
    viewBox: "-52 14 606 522",

    // Proportions matter: a real heart is about as wide as it is tall, so tall
    // narrow ventricles read as two separate organs rather than one.
    lv: { cx: 306, baseY: 244, apexY: 486, wCav: 64, wall: 32, lean: 40 },
    rv: { baseY: 252, apexY: 448, depth: 82, wall: 11 },

    // The atria overlap the ventricular base rather than floating above it, so
    // the four chambers read as one organ and each AV valve sits in a junction.
    ra: { cx: 172, cy: 198, rx: 57, ry: 45 },
    la: { cx: 328, cy: 194, rx: 54, ry: 43 }
  };

  /* Profile of a ventricle from base (s = 0) to apex (s = 1). */
  function profile(s) { return Math.sqrt(Math.max(0, 1 - Math.pow(s, 2.2))); }

  /* The ventricular long axis leans, so the apex sits down and to the patient's
   * left rather than straight below the valve plane. Every structure that hangs
   * off the ventricle reads this, which is why the whole mass tilts together. */
  function lvCx(s) { return G.lv.cx - G.lv.lean * Math.pow(M.clamp(s, 0, 1), 1.25); }

  /* Half-width of the LV cavity. `shrink` is systolic shortening: 0 is fully
   * relaxed. The base contributes less than the free wall and the apex, which is
   * why contraction reads as wall motion rather than the whole shape scaling. */
  function lvCavityHalfWidth(s, shrink) {
    var wall = 1 - 0.30 * Math.pow(1 - s, 1.5);
    return G.lv.wCav * profile(s) * (1 - shrink * wall);
  }

  function lvOuterHalfWidth(s, thicken) {
    var t = G.lv.wall * (thicken || 1) * (1 - 0.32 * s);
    return (G.lv.wCav + t) * profile(s);
  }

  function rvProfile(s) { return Math.sqrt(Math.max(0, 1 - Math.pow(s, 1.8))); }

  function rvDepthAt(s, shrink) {
    return G.rv.depth * rvProfile(s) * (1 - shrink * 0.72);
  }

  /* y for a given base-to-apex fraction. During systole the valve plane descends
   * toward the apex — a real motion, and a visible one. */
  function lvY(s, descend) {
    var b = G.lv.baseY + (descend || 0) * 14;
    return b + s * (G.lv.apexY - b);
  }
  function rvY(s, descend) {
    var b = G.rv.baseY + (descend || 0) * 12;
    return b + s * (G.rv.apexY - b);
  }
  /* The right ventricle spans a shorter length, so map its parameter onto the
   * left ventricle's before asking for a shared width. */
  function rvToLv(s) { return s * (G.rv.apexY - G.rv.baseY) / (G.lv.apexY - G.lv.baseY); }

  var STEPS = 24;

  function lvCavityPoints(shrink, descend) {
    var pts = [], i, s;
    for (i = 0; i <= STEPS; i++) {
      s = i / STEPS;
      pts.push([lvCx(s) - lvCavityHalfWidth(s, shrink), lvY(s, descend)]);
    }
    for (i = STEPS; i >= 0; i--) {
      s = i / STEPS;
      pts.push([lvCx(s) + lvCavityHalfWidth(s, shrink), lvY(s, descend)]);
    }
    return pts;
  }

  function lvOuterPoints(thicken, descend) {
    var pts = [], i, s;
    for (i = 0; i <= STEPS; i++) {
      s = i / STEPS;
      pts.push([lvCx(s) - lvOuterHalfWidth(s, thicken), lvY(s, descend)]);
    }
    for (i = STEPS; i >= 0; i--) {
      s = i / STEPS;
      pts.push([lvCx(s) + lvOuterHalfWidth(s, thicken), lvY(s, descend)]);
    }
    return pts;
  }

  /* The right ventricle is a crescent wrapped around the septal surface of the
   * left. Its inner boundary IS the left ventricle's outer wall. */
  function rvCavityPoints(shrink, lvThicken, descend) {

    for (i = 0; i <= STEPS; i++) {

      pts.push([x, rvY(s, descend)]);
    }

      x = lvCx(sl) - lvOuterHalfWidth(sl, lvThicken) - G.rv.wall - rvDepthAt(s, shrink);
      pts.push([x, rvY(s, descend)]);
    }

  }
