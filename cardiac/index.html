    var t = G.rv.wall * (rvThicken || 1);
    var pts = [], i, s, sl, x;
    for (i = 0; i <= STEPS; i++) {
      s = i / STEPS; sl = Math.min(1, rvToLv(s));
      pts.push([lvCx(sl) - lvOuterHalfWidth(sl, lvThicken), rvY(s, descend)]);
    }
    for (i = STEPS; i >= 0; i--) {
      s = i / STEPS; sl = Math.min(1, rvToLv(s));
      x = lvCx(sl) - lvOuterHalfWidth(sl, lvThicken) - t - rvDepthAt(s, 0) - t * 0.4;
      pts.push([x, rvY(s, descend)]);
    }
    return pts;
  }

  /* Trabeculae carneae — the muscular ridges lining the ventricular cavity.
   * Short arcs just inside the endocardial border, which is enough to stop the
   * cavity reading as a flat cut-out shape. */
  function trabeculae(side, shrink, lvThicken, descend) {
    var out = [], rand = C.rng(side === "left" ? 5150881 : 9902317);
    var n = side === "left" ? 9 : 7;
    for (var i = 0; i < n; i++) {
      var s = 0.20 + (i / n) * 0.64 + (rand() - 0.5) * 0.03;
      var wall = (i % 2 === 0) ? 1 : -1;
      var x0, y0;
      if (side === "left") {
        y0 = lvY(s, descend);
        x0 = lvCx(s) + wall * (lvCavityHalfWidth(s, shrink) - 3);
      } else {
        var sl = Math.min(1, rvToLv(s));
        var inner = lvCx(sl) - lvOuterHalfWidth(sl, lvThicken) - G.rv.wall;
        y0 = rvY(s, descend);
        x0 = wall > 0 ? inner - 4 : inner - rvDepthAt(s, shrink) + 4;
      }
      var len = 6 + rand() * 8;
      out.push([[x0, y0], [x0 - wall * len, y0 + 4 + rand() * 4]]);
    }
    return out;
  }

  /* Papillary muscles and chordae tendineae.
   *
   * These are the clearest illustration of contraction in the whole drawing:
   * the muscle shortens with the wall it springs from, and the chordae pull
   * taut the moment the valve shuts, which is what stops the leaflets inverting
   * into the atrium under ventricular pressure. */
  function papillary(side, shrink, lvThicken, descend) {
    var out = [];
    var specs = side === "left"
      ? [{ s: 0.58, wall: 1 }, { s: 0.56, wall: -1 }]
      : [{ s: 0.56, wall: -1 }, { s: 0.48, wall: 1 }];

    for (var i = 0; i < specs.length; i++) {
      var sp = specs[i];
      var base, dir;
      if (side === "left") {
        base = { x: lvCx(sp.s) + sp.wall * (lvCavityHalfWidth(sp.s, shrink) - 1), y: lvY(sp.s, descend) };
        dir = -sp.wall;
      } else {
        var sl = Math.min(1, rvToLv(sp.s));
        var inner = lvCx(sl) - lvOuterHalfWidth(sl, lvThicken) - G.rv.wall;
        base = { x: sp.wall > 0 ? inner - 2 : inner - rvDepthAt(sp.s, shrink) + 2, y: rvY(sp.s, descend) };
        dir = sp.wall > 0 ? -1 : 1;
      }
      // The muscle shortens and thickens as the ventricle contracts.
      var len = (32 - 8 * shrink) * (side === "left" ? 1 : 0.82);
      var lift = 0.66;
      var tip = { x: base.x + dir * len * 0.40, y: base.y - len * lift };
      var halfW = 6.5 + 1.5 * shrink;
      out.push({
        base: base, tip: tip,
        body: [
          [base.x - halfW, base.y + 3],
          [base.x + dir * len * 0.18 - halfW * 0.4, base.y - len * lift * 0.55],
          [tip.x, tip.y],
          [base.x + dir * len * 0.18 + halfW * 0.6, base.y - len * lift * 0.45],
          [base.x + halfW, base.y + 3]
        ]
      });
    }
    return out;
  }

  /* Atria, flattened where they meet the valve plane and rounded above. */
  function atriumPoints(a, shrink, bulge) {
    var pts = [], n = 28;
    for (var i = 0; i < n; i++) {
      var th = (i / n) * Math.PI * 2 - Math.PI / 2;
      var sy = Math.sin(th);
      var squash = sy > 0 ? 1 - 0.30 * Math.pow(sy, 2.4) : 1;
      var move = 0.35 + 0.65 * Math.max(0, -sy);
      var k = 1 - shrink * move;
      var rx = a.rx * k * squash * (1 + (bulge || 0) * 0.10);
      var ry = a.ry * k * (1 + (bulge || 0) * 0.08);
      pts.push([a.cx + rx * Math.cos(th), a.cy + ry * sy]);
    }
    return pts;
  }

  /* The auricle — the ear-shaped appendage that gives each atrium its
   * silhouette. Not decoration: the left atrial appendage is where thrombus
   * forms in atrial fibrillation, which the rhythm content already teaches. */
  function auriclePoints(side, shrink) {
    var a = side === "right" ? G.ra : G.la;
    var k = 1 - shrink * 0.7;
    var dir = side === "right" ? -1 : 1;
    var ox = a.cx + dir * a.rx * 0.70;
    var oy = a.cy - a.ry * 0.40;
    var L = 42 * k, H = 26 * k;
    return [
      [ox, oy + H * 0.44],
      [ox + dir * L * 0.34, oy + H * 0.64],
      [ox + dir * L * 0.78, oy + H * 0.18],
      [ox + dir * L, oy - H * 0.44],
      [ox + dir * L * 0.64, oy - H * 0.88],
      [ox + dir * L * 0.18, oy - H * 0.74],
      [ox - dir * 4, oy - H * 0.28]
    ];
  }

  /* The atrioventricular junction — the fibrous plane the atria sit on and the
   * ventricles hang from. Without it the atria read as discs floating above the
   * ventricles instead of as chambers opening into them. */
  function junctionPoints(descend, lvThicken) {
    var drop = (descend || 0) * 9;
    var rvOut = lvCx(0.02) - lvOuterHalfWidth(0.02, lvThicken) - G.rv.wall - rvDepthAt(0.02, 0) - 6;
    var lvOut = lvCx(0.02) + lvOuterHalfWidth(0.02, lvThicken);
    var top = G.lv.baseY - 16 + drop, bot = G.lv.baseY + 12 + drop;
    return [
      [rvOut, top + 6], [rvOut + 30, top], [G.lv.cx - 40, top - 2],
      [G.lv.cx + 20, top], [lvOut - 24, top + 1], [lvOut + 4, top + 8],
      [lvOut + 4, bot], [lvOut - 30, bot + 5], [G.lv.cx - 30, bot + 6],
      [rvOut + 26, bot + 4], [rvOut - 2, bot - 2]
    ];
  }

  /* The ventricular outflow tracts.
   *
   * Without these the great arteries merely start somewhere near the top of the
   * heart, and a learner cannot see which chamber they drain. Each tract is a
   * tapering channel of the SAME blood as its ventricle, running from inside
   * the cavity up to the semilunar valve, so the route out is continuous. */
  function outflowTract(side, shrink, lvThicken, descend) {
    var v = valveGeometry(descend, lvThicken)[side === "left" ? "aortic" : "pulmonic"];
    var mid = (v.x1 + v.x2) / 2, half = (v.x2 - v.x1) / 2;
    var root, lean;
    if (side === "left") {
      // Rises from the septal side of the LV cavity.
      root = { x: lvCx(0.18) - lvCavityHalfWidth(0.18, shrink) * 0.15, y: lvY(0.18, descend) };
      lean = 6;
    } else {
      var sl = Math.min(1, rvToLv(0.16));
      var inner = lvCx(sl) - lvOuterHalfWidth(sl, lvThicken) - G.rv.wall;
      root = { x: inner - rvDepthAt(0.16, shrink) * 0.55, y: rvY(0.16, descend) };
      lean = -4;
    }
    var w = Math.max(half * 0.9, 14);
    return [
      [root.x - w, root.y],
      [mid - half + lean, v.y + 4],
      [mid - half * 0.92 + lean, v.y - 2],
      [mid + half * 0.92 + lean, v.y - 2],
      [mid + half + lean, v.y + 4],
      [root.x + w, root.y]
    ];
  }

  /* ------------------------------------------------------- conduction system */

  function conductionAnchors(lvThicken) {
    var sept = function (s) {
      return { x: lvCx(s) - lvOuterHalfWidth(s, lvThicken) + 6, y: lvY(s, 0) };
    };
    var septL = function (s) {
      return { x: lvCx(s) - lvCavityHalfWidth(s, 0) + 3, y: lvY(s, 0) };
    };
    var septR = function (s) {
      return { x: lvCx(s) - lvOuterHalfWidth(s, lvThicken) - 4, y: lvY(s, 0) };
    };
    return {
      // In the atrial wall at the junction of the superior vena cava and the
      // right atrium — inside the wall, not on the vena cava itself.
      saNode: { x: 196, y: 152 },
      // Low in the interatrial septum, just above the valve plane.
      avNode: { x: 248, y: 228 },
      hisTop: { x: 246, y: 236 },
      hisBottom: sept(0.12),
      septum: sept, septumLeft: septL, septumRight: septR
    };
  }

  /* Short fibres radiating from the sinus node into the surrounding atrial
   * muscle — the reason the node looks like a starburst in every reference. */
  function saRadials(anchors) {
    var out = [], n = 9, a = anchors.saNode;
    for (var i = 0; i < n; i++) {
      var th = (i / n) * Math.PI * 2 + 0.4;
      var r0 = 8, r1 = 15 + (i % 3) * 4;
      out.push([
        [a.x + Math.cos(th) * r0, a.y + Math.sin(th) * r0 * 0.8],
        [a.x + Math.cos(th) * r1, a.y + Math.sin(th) * r1 * 0.8]
      ]);
    }
    return out;
  }

  /* Three internodal tracts, not one wire — and Bachmann's bundle branching off
   * toward the left atrium, which is how the left atrium is reached at all. A
   * single line cannot express either fact. */
  function internodalTracts(anchors) {
    var sa = anchors.saNode, av = anchors.avNode;
    return {
      anterior: [
        { x: sa.x + 4, y: sa.y + 7 },
        { x: 214, y: 172 }, { x: 232, y: 198 }, { x: av.x - 2, y: av.y - 8 }
      ],
      middle: [
        { x: sa.x - 2, y: sa.y + 9 },
        { x: 192, y: 182 }, { x: 216, y: 210 }, { x: av.x - 6, y: av.y - 4 }
      ],
      posterior: [
        { x: sa.x - 8, y: sa.y + 8 },
        { x: 162, y: 192 }, { x: 170, y: 226 }, { x: 210, y: 242 },
        { x: av.x - 8, y: av.y + 3 }
      ],
      bachmann: [
        { x: sa.x + 7, y: sa.y + 2 },
        { x: 240, y: 148 }, { x: 282, y: 150 }, { x: 322, y: 162 }
      ]
    };
  }

  function hisPath(anchors) {
    return [anchors.hisTop,
            { x: (anchors.hisTop.x + anchors.hisBottom.x) / 2 - 2,
              y: (anchors.hisTop.y + anchors.hisBottom.y) / 2 },
            anchors.hisBottom];
  }

  /* The right bundle stays a discrete cord down the right side of the septum.
   * The left bundle is a broad sheet that fans into anterior and posterior
   * fascicles — which is why the two behave so differently when they fail. */
  function bundlePath(anchors, side, fascicle) {
    var f = side === "left" ? anchors.septumLeft : anchors.septumRight;
    var pts = [anchors.hisBottom];
    var split = f(0.18);
    pts.push({ x: (anchors.hisBottom.x + split.x) / 2 + (side === "left" ? 5 : -5),
               y: (anchors.hisBottom.y + split.y) / 2 });
    var spread = fascicle === "anterior" ? -1 : fascicle === "posterior" ? 1 : 0;
    for (var i = 2; i <= 9; i++) {
      var s = i / 10.5;
      var p = f(s);
      var g = Math.pow((i - 2) / 7, 1.4);
      pts.push({ x: p.x + spread * 14 * g, y: p.y + spread * 5 * g });
    }
    return pts;
  }

  /* Purkinje network: a branching tree, not a bundle of parallel strokes. Each
   * fibre leaves the fascicle terminus, runs along the endocardium, then
   * divides — twice — so the network visibly ramifies. */
  function purkinjeTree(side, lvThicken) {
    var out = [], rand = C.rng(side === "left" ? 20240117 : 771103);
    var apexS = 0.92;

    var origin = side === "left"
      ? { x: lvCx(0.86) - lvCavityHalfWidth(0.86, 0) + 4, y: lvY(0.86, 0) }
      : (function () {
          var sl = Math.min(1, rvToLv(0.86));
          return { x: lvCx(sl) - lvOuterHalfWidth(sl, lvThicken) - G.rv.wall - 3, y: rvY(0.86, 0) };
        })();

    function endo(s, wall) {
      if (side === "left") {
        var half = lvCavityHalfWidth(s, 0) - 5;
        return lvCx(s) + (wall === "free" ? half : -half);
      }
      var sl = Math.min(1, rvToLv(s));
      var inner = lvCx(sl) - lvOuterHalfWidth(sl, lvThicken) - G.rv.wall;
      return wall === "free" ? inner - rvDepthAt(s, 0) + 6 : inner - 4;
    }
    function yAt(s) { return side === "left" ? lvY(s, 0) : rvY(s, 0); }

    // Three trunks a side, each carrying three branches that twig again. Dense
    // enough to read as a network, but every fibre stays pinned to the
    // endocardium — what made the earlier version a scribble was fibres cutting
    // across the middle of the cavity, not the number of them.
    var walls = side === "left" ? ["sept", "free", "free"] : ["free", "sept", "free"];
    for (var w = 0; w < walls.length; w++) {
      var wall = walls[w];
      var top = 0.34 + w * 0.13;
      var trunk = [{ x: origin.x, y: origin.y }];
      var steps = 5;
      for (var j = 1; j <= steps; j++) {
        var f = j / steps;
        var s = M.lerp(apexS, top, Math.pow(f, 0.85));
        // Reach the wall quickly, then run along it.
        var reach = Math.min(1, f * 2.8);
        trunk.push({ x: M.lerp(origin.x, endo(s, wall), reach) + (rand() - 0.5) * 1.5, y: yAt(s) });
      }
      out.push({ pts: trunk, order: 1 });

      for (var b = 0; b < 3; b++) {
        var at = 2 + b;
        if (at >= trunk.length) break;
        var from = trunk[at];
        var sHere = M.lerp(apexS, top, Math.pow(at / steps, 0.85));
        var sUp = Math.max(0.22, sHere - 0.09 - rand() * 0.04);
        var bx = endo(sUp, wall) + (wall === "free" ? -1 : 1) * (2 + rand() * 4);
        var branch = [from,
                      { x: (from.x + bx) / 2, y: (from.y + yAt(sUp)) / 2 },
                      { x: bx, y: yAt(sUp) }];
        out.push({ pts: branch, order: 2 });

        // Two twigs off each branch tip, which is what makes it ramify.
        for (var t2 = 0; t2 < 2; t2++) {
          var sTip = Math.max(0.16, sUp - 0.05 - t2 * 0.045);
          out.push({ pts: [branch[2], {
            x: bx + (wall === "free" ? -1 : 1) * (3 + t2 * 4) + (rand() - 0.5) * 3,
            y: yAt(sTip)
          }], order: 3 });
        }
      }
    }
    return out;
  }

  /* Label anchors that have to sit ON a generated path rather than at a
   * hand-typed coordinate — otherwise a geometry change silently leaves the
   * leader line pointing at empty myocardium. */
  function labelAnchors(lvThicken, descend) {
    var a = conductionAnchors(lvThicken);
    var rbb = bundlePath(a, "right"), lbb = bundlePath(a, "left");
    var pick = function (pts, u) { return pointAlong(pts, u); };
    var out = {
      "sa-node": a.saNode,
      "av-node": a.avNode,
      "his-bundle": pick(hisPath(a), 0.55),
      "right-bundle": pick(rbb, 0.62),
      "left-bundle": pick(lbb, 0.62),
      "bachmann": pick(internodalTracts(a).bachmann, 0.62)
    };
    ["left", "right"].forEach(function (side) {
      var tree = purkinjeTree(side, lvThicken);
      var mid = tree.filter(function (b) { return b.order === 2; });
      var t = mid.length ? mid[Math.floor(mid.length / 2)] : tree[0];
      out[side + "-purkinje"] = pointAlong(t.pts, 0.9);
    });
    ["left", "right"].forEach(function (side) {
      var pm = papillary(side, 0.2, lvThicken, descend || 0);
      if (pm.length) {
        if (side === "left") { out.papillary = pm[0].base; out.chordae = pm[0].tip; }
      }
    });
    return out;
  }

  /* ------------------------------------------------------------- valve planes */

  /* `axis` is the direction the leaflets point when shut: AV valves shut into
   * the ventricle below, semilunar valves shut across the vessel above. */
  function valveGeometry(descend, lvThicken) {
    var drop = (descend || 0) * 9;
    return {
      tricuspid: { x1: 126, x2: 194, y: 250 + drop, axis: 1,  span: 18 },
      mitral:    { x1: 288, x2: 354, y: 246 + drop, axis: 1,  span: 18 },
      // Both semilunar valves sit at the TOP OF THEIR OWN VENTRICLE. Placed any
      // higher they hover between the atria, and the great artery above them
      // reads as if it drains an atrium — which is the single most misleading
      // thing this drawing could say.
      pulmonic:  { x1: 168, x2: 206, y: 246 + drop * 0.6, axis: -1, span: 13 },
      aortic:    { x1: 252, x2: 290, y: 250 + drop * 0.6, axis: -1, span: 13 }
    };
  }

  /* ------------------------------------------------------------ path helpers */

  function smoothClosedPath(pts) {
    var n = pts.length;
    if (n < 3) return "";
    var d = "M" + pts[0][0].toFixed(1) + "," + pts[0][1].toFixed(1);
    for (var i = 0; i < n; i++) {
      var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += "C" + c1x.toFixed(1) + "," + c1y.toFixed(1) + " " +
                 c2x.toFixed(1) + "," + c2y.toFixed(1) + " " +
                 p2[0].toFixed(1) + "," + p2[1].toFixed(1);
    }
    return d + "Z";
  }

  function smoothOpenPath(pts) {
    if (!pts.length) return "";
    var d = "M" + pts[0].x.toFixed(1) + "," + pts[0].y.toFixed(1);
    for (var i = 1; i < pts.length; i++) {
      var prev = pts[i - 1], cur = pts[i];
      var mx = (prev.x + cur.x) / 2, my = (prev.y + cur.y) / 2;
      d += "Q" + prev.x.toFixed(1) + "," + prev.y.toFixed(1) + " " + mx.toFixed(1) + "," + my.toFixed(1);
    }
    var last = pts[pts.length - 1];
    d += "L" + last.x.toFixed(1) + "," + last.y.toFixed(1);
    return d;
  }

  function polyline(pts) {
    return pts.map(function (p, i) {
      return (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1);
    }).join("");
  }

  function pointAlong(pts, u) {
    if (!pts.length) return { x: 0, y: 0 };
    var segs = [], total = 0, i;
    for (i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i];
      var ax = a.x !== undefined ? a.x : a[0], ay = a.y !== undefined ? a.y : a[1];
      var bx = b.x !== undefined ? b.x : b[0], by = b.y !== undefined ? b.y : b[1];
      var len = Math.hypot(bx - ax, by - ay);
      segs.push({ ax: ax, ay: ay, bx: bx, by: by, len: len });
      total += len;
    }
    if (!total) { var p0 = pts[0]; return { x: p0.x !== undefined ? p0.x : p0[0], y: p0.y !== undefined ? p0.y : p0[1] }; }
    var target = M.clamp(u, 0, 1) * total, acc = 0;
    for (i = 0; i < segs.length; i++) {
      if (acc + segs[i].len >= target) {
        var f = (target - acc) / (segs[i].len || 1);
        return { x: M.lerp(segs[i].ax, segs[i].bx, f), y: M.lerp(segs[i].ay, segs[i].by, f),
                 angle: Math.atan2(segs[i].by - segs[i].ay, segs[i].bx - segs[i].ax) };
      }
      acc += segs[i].len;
    }
    var last = segs[segs.length - 1];
    return { x: last.bx, y: last.by, angle: Math.atan2(last.by - last.ay, last.bx - last.ax) };
  }

  /* ------------------------------------------------------------ flow routes */

  var FLOW_ROUTES = {
    "svc-to-ra":               [[198, 22], [197, 86], [196, 150]],
    "ivc-to-ra":               [[112, 500], [120, 420], [134, 320], [154, 240]],
    "pulmonary-veins-to-la":   [[470, 172], [424, 178], [390, 186]],
    "ra-to-rv":                [[172, 200], [176, 248], [166, 296], [152, 344]],
    "la-to-lv":                [[330, 198], [326, 250], [312, 302], [292, 356]],
    // Each outflow route starts INSIDE its ventricle and travels out through
    // the tract and the valve, so the arrows show which chamber the blood left.
    "rv-to-pulmonary-artery":  [[158, 330], [170, 288], [184, 252], [196, 208], [216, 168], [236, 140]],
    "lv-to-aorta":             [[292, 350], [284, 300], [274, 252], [278, 200], [292, 152], [330, 110], [382, 116], [412, 174]]
  };

  /* Labels live in two gutters either side of the drawing. */
  var LEFT_TX = 128, RIGHT_TX = 406;

  var LABELS = {
    "svc":             { x: 197, y: 70,  tx: LEFT_TX,  ty: 60,  text: "Superior vena cava" },
    "sa-node":         { x: 196, y: 152, tx: LEFT_TX,  ty: 110, text: "SA node" },

    "right-ventricle": { x: 140, y: 330, tx: LEFT_TX,  ty: 306, text: "Right ventricle" },
    "right-bundle":    { x: 226, y: 356, tx: LEFT_TX,  ty: 350, text: "Right bundle branch" },
    "papillary":       { x: 196, y: 352, tx: LEFT_TX,  ty: 394, text: "Papillary muscle" },

    "left-ventricle":  { x: 300, y: 350, tx: RIGHT_TX, ty: 464, text: "Left ventricle" },
    "left-purkinje":   { x: 286, y: 412, tx: RIGHT_TX, ty: 470, text: "Purkinje fibres" },
    "chordae":         { x: 240, y: 288, tx: RIGHT_TX, ty: 340, text: "Chordae tendineae" }
  };

  var LABEL_SETS = {
    chambers: ["right-atrium", "left-atrium", "right-ventricle", "left-ventricle", "septum"],

    ch.lv = chamber("left-ventricle", "ox");

     * illustration of contraction in the drawing: the muscle shortens with the
     * wall, and the chordae snap taut the instant the valve shuts. */
    ch.detail = {};
    ["right", "left"].forEach(function (side) {

        "data-region": side === "left" ? "left-ventricle" : "right-ventricle" }, layers.chambers);

        chord.push(el("path", { class: "chorda", fill: "none", "data-region": "chordae" }, g));

    // the tissue the atria rest on.

      right: el("path", { class: "outflow outflow-deox", "data-region": "right-ventricle" }, layers.chambers),
      left: el("path", { class: "outflow outflow-ox", "data-region": "left-ventricle" }, layers.chambers)
    };
    ch.junction = el("path", { class: "av-junction", "data-region": "junction" }, layers.chambers);
    ch.raAur = el("path", { class: "auricle auricle-deox", "data-region": "right-atrium" }, layers.chambers);
    ch.laAur = el("path", { class: "auricle auricle-ox", "data-region": "left-atrium" }, layers.chambers);

    ch.la = chamber("left-atrium", "ox");

    var valveEls = {};
    ["tricuspid", "mitral", "pulmonic", "aortic"].forEach(function (v) {

      right: el("path", { class: "atrial-glow", "data-region": "right-atrium", fill: "none" }, layers.conduction),

  /* Set a chamber's outline, then clip its blood to the volume it holds.
   *
   * Which END the blood retreats toward is not cosmetic — it is the physiology.
   *
   * Ventricles contract APEX FIRST, and the wave travels toward the base where
   * both valves sit. So the apex obliterates first and the last blood sits up
   * against the outflow, on its way out. Anchoring the blood to the top and
   * letting the empty space grow from the apex says that. A falling level would

    for (var i = 0; i < pts.length; i++) {

      if (pts[i][1] > bot) bot = pts[i][1];

    // Map the chamber's working volume range onto the visible one, so
    // end-diastole reads as nearly full and end-systole as nearly empty.
    var frac = M.clamp((volume - lo0) / (hi0 - lo0), 0.06, 0.97);
    var span = bot - top;
    var edgeY;

    if (anchor === "top") {
      // Blood hangs from the base; the empty apex grows upward as it ejects.
      edgeY = top + span * frac;
      part.clipRect.setAttribute("y", (top - 8).toFixed(1));
      part.clipRect.setAttribute("height", (edgeY - top + 8).toFixed(1));
    } else {
      // Blood sits in the floor; the level falls as it drains out below.
      edgeY = bot - span * frac;
      part.clipRect.setAttribute("y", edgeY.toFixed(1));
      part.clipRect.setAttribute("height", (bot - edgeY + 8).toFixed(1));
    }

    // sits close to the chamber behind it. Clipped to the cavity, so it appears
    // only across the width of the chamber it belongs to.
    part.surface.setAttribute("d", "M-120," + edgeY.toFixed(1) + " L660," + edgeY.toFixed(1));
    return edgeY;
  }

  /* ------------------------------------------------------------------ update */

  function update(view, sim, frame) {
    var s = sim.state;
    var lvThick = s.condition === "lvh" ? 1.62 : 1;
    var rvThick = s.condition === "rvh" ? 2.3 : 1;

    /* Cavity volumes -> wall motion. The base descends toward the apex during
     * ejection, which is what the annulus really does. */
    /* Map the physiologic volume range onto most of the available visual range,
     * so a normal beat has an obvious excursion — while a failing ventricle that
     * empties less still visibly moves less. Referencing a FIXED volume window
     * rather than each beat's own extremes is what preserves that difference. */
    var lvVol = frame.volumes.leftVentricle, rvVol = frame.volumes.rightVentricle;
    var excursion = function (v, max) {

    };

    var rvShrink = excursion(rvVol, 0.60);
    var descend = M.clamp(lvShrink / 0.66, 0, 1);

    // Fuller chamber, deeper blood. Gives filling a second visual channel
    // besides shape, which is much easier to read at speed.

    view.chambers.lv.blood.style.setProperty("--fill", fullness(lvVol).toFixed(3));
    view.chambers.rv.blood.style.setProperty("--fill", fullness(rvVol).toFixed(3));

    var lvCav = GEO.lvCavityPoints(lvShrink, descend);
    var lvOut = GEO.lvOuterPoints(lvThick, descend);
    var rvCav = GEO.rvCavityPoints(rvShrink, lvThick, descend);
    var rvOut = GEO.rvOuterPoints(rvThick, lvThick, descend);

    var lvCavD = GEO.smoothClosedPath(lvCav);
    var rvCavD = GEO.smoothClosedPath(rvCav);
    setFill(view.chambers.lv, lvCavD, lvCav, lvVol, 0.10, 0.52, "top");
    setFill(view.chambers.rv, rvCavD, rvCav, rvVol, 0.10, 0.52, "top");
    view.chambers.lv.wall.setAttribute("d", GEO.smoothClosedPath(lvOut) + lvCavD);
    view.chambers.rv.wall.setAttribute("d", GEO.smoothClosedPath(rvOut) + rvCavD);

    var aFill = M.clamp((frame.volumes.atria - 0.45) / 0.45, 0, 1);
    view.chambers.ra.blood.style.setProperty("--fill", aFill.toFixed(3));
    view.chambers.la.blood.style.setProperty("--fill", aFill.toFixed(3));
    var aShrink = M.clamp(frame.volumes.atrialContraction * 0.34, 0, 0.36);
    var quiver = frame.volumes.quiver ? (Math.sin(frame.tMs / 22) * 0.012) : 0;
    var raCav = GEO.atriumPoints(G.ra, aShrink + quiver, 0);
    var laCav = GEO.atriumPoints(G.la, aShrink + quiver, 0);
    var raCavD = GEO.smoothClosedPath(raCav);
    var laCavD = GEO.smoothClosedPath(laCav);
    setFill(view.chambers.ra, raCavD, raCav, frame.volumes.atria, 0.30, 0.95, "bottom");
    setFill(view.chambers.la, laCavD, laCav, frame.volumes.atria, 0.30, 0.95, "bottom");
    view.chambers.ra.wall.setAttribute("d",
      GEO.smoothClosedPath(GEO.atriumPoints({ cx: G.ra.cx, cy: G.ra.cy, rx: G.ra.rx + 9, ry: G.ra.ry + 9 }, aShrink * 0.5, 0)) + raCavD);
    view.chambers.la.wall.setAttribute("d",
      GEO.smoothClosedPath(GEO.atriumPoints({ cx: G.la.cx, cy: G.la.cy, rx: G.la.rx + 9, ry: G.la.ry + 9 }, aShrink * 0.5, 0)) + laCavD);

    /* Valves. openFraction is leaflet travel only; it never decides whether
     * blood may cross. That is the valve's flowPermitted flag. */
    /* Valves. Shut, the leaflets meet in the middle and seal the orifice; open,
     * they swing back against the walls and the orifice is clear. openFraction
     * is leaflet travel only — it never decides whether blood may cross. That is
     * the valve's flowPermitted flag. */
    view.chambers.raAur.setAttribute("d", GEO.smoothClosedPath(GEO.auriclePoints("right", aShrink)));
    view.chambers.laAur.setAttribute("d", GEO.smoothClosedPath(GEO.auriclePoints("left", aShrink)));

    view.chambers.tract.right.setAttribute("d",
      GEO.smoothClosedPath(GEO.outflowTract("right", rvShrink, lvThick, descend)));
    view.chambers.tract.left.setAttribute("d",
      GEO.smoothClosedPath(GEO.outflowTract("left", lvShrink, lvThick, descend)));

    view.chambers.junction.setAttribute("d",
      GEO.smoothClosedPath(GEO.junctionPoints(descend, lvThick)));

    /* Trabeculae, papillary muscles and chordae. The chordae run from each
     * papillary tip to the free edge of the leaflet it restrains, so they are
     * taut whenever the valve is shut and slack when it hangs open — which is
     * exactly what a learner needs to see to understand why the leaflets do not
     * invert when the ventricle squeezes. */
    var vgeo = GEO.valveGeometry(descend, lvThick);
    [["left", lvShrink, "mitral"], ["right", rvShrink, "tricuspid"]].forEach(function (spec) {
      var side = spec[0], shrink = spec[1], det = view.chambers.detail[side];
      var trabs = GEO.trabeculae(side, shrink, lvThick, descend);
      det.trab.forEach(function (el2, i) {
        if (i < trabs.length) { el2.setAttribute("d", GEO.polyline(trabs[i])); el2.setAttribute("opacity", 1); }
        else el2.setAttribute("opacity", 0);
      });

      var paps = GEO.papillary(side, shrink, lvThick, descend);
      var v = frame.valves[spec[2]], geo = vgeo[spec[2]];
      var open = v.openFraction;
      var mid = (geo.x1 + geo.x2) / 2, half = (geo.x2 - geo.x1) / 2;
      var tips = [
        { x: M.lerp(mid, geo.x1 + half * 0.22, open), y: geo.y + geo.span * (1 - 0.45 * open) },
        { x: M.lerp(mid, geo.x2 - half * 0.22, open), y: geo.y + geo.span * (1 - 0.45 * open) }
      ];
      paps.forEach(function (pm, i) {
        det.pap[i].setAttribute("d", GEO.smoothClosedPath(pm.body));
        for (var c = 0; c < 2; c++) {
          var target = tips[c];
          var el3 = det.chord[i * 2 + c];
          var dx = target.x - pm.tip.x, dy = target.y - pm.tip.y;
          var span = Math.hypot(dx, dy);
          // Slack when the valve is open; a straight taut line when it is shut.
          var sag = open * Math.min(16, span * 0.22);
          var mx = pm.tip.x + dx * 0.5 - dy / (span || 1) * sag * 0.35;
          var my = pm.tip.y + dy * 0.5 + sag;
          el3.setAttribute("d", "M" + pm.tip.x.toFixed(1) + "," + pm.tip.y.toFixed(1) +
            " Q" + mx.toFixed(1) + "," + my.toFixed(1) +
            " " + target.x.toFixed(1) + "," + target.y.toFixed(1));
          el3.classList.toggle("is-taut", open < 0.35);
        }
      });
    });

    var vg = GEO.valveGeometry(descend, lvThick);
    ["tricuspid", "mitral", "pulmonic", "aortic"].forEach(function (name) {
      var v = frame.valves[name], geo = vg[name], e = view.valves[name];
      var open = v.openFraction;
      var mid = (geo.x1 + geo.x2) / 2, half = (geo.x2 - geo.x1) / 2;
      var span = geo.span * geo.axis;

      // Shut: both tips meet at the midline. Open: each tip retreats toward its
      // own hinge and the leaflet lies almost flat against the wall.
      var tipL = M.lerp(mid, geo.x1 + half * 0.22, open);
      var tipR = M.lerp(mid, geo.x2 - half * 0.22, open);
      var tipY = geo.y + span * (1 - 0.45 * open);

      e.a.setAttribute("d", "M" + geo.x1.toFixed(1) + "," + geo.y.toFixed(1) +
        " Q" + (M.lerp(geo.x1, tipL, .55)).toFixed(1) + "," + (geo.y + span * 0.72).toFixed(1) +
        " " + tipL.toFixed(1) + "," + tipY.toFixed(1));
      e.b.setAttribute("d", "M" + geo.x2.toFixed(1) + "," + geo.y.toFixed(1) +
        " Q" + (M.lerp(geo.x2, tipR, .55)).toFixed(1) + "," + (geo.y + span * 0.72).toFixed(1) +
        " " + tipR.toFixed(1) + "," + tipY.toFixed(1));

      e.dot.setAttribute("cx", mid);
      e.dot.setAttribute("cy", geo.y);
      e.dot.setAttribute("r", 0);
      e.group.setAttribute("data-open", v.open ? "1" : "0");
      e.group.classList.toggle("is-open", !!v.open);
    });

    /* Conduction. Region intensity comes straight from the event schedule. */
    var anchors = GEO.conductionAnchors(lvThick);
    var cd = frame.conduction;

    setNode(view.cond.saNode, cd["sa-node"]);
    setNode(view.cond.avNode, cd["av-node"]);

    var hisPts = [anchors.hisTop, anchors.hisBottom];
    view.cond.his.setAttribute("d", GEO.smoothOpenPath(hisPts));
    view.cond.rbb.setAttribute("d", GEO.smoothOpenPath(GEO.bundlePath(anchors, "right")));
    view.cond.lbb.setAttribute("d", GEO.smoothOpenPath(GEO.bundlePath(anchors, "left")));
    view.cond.lbbAnt.setAttribute("d", GEO.smoothOpenPath(GEO.bundlePath(anchors, "left", "anterior")));
    view.cond.lbbPost.setAttribute("d", GEO.smoothOpenPath(GEO.bundlePath(anchors, "left", "posterior")));

    setTrack(view.cond.his, cd["his-bundle"]);
    setTrack(view.cond.rbb, cd["right-bundle"]);
    setTrack(view.cond.lbb, cd["left-bundle"]);
    setTrack(view.cond.lbbAnt, cd["left-bundle"]);
    setTrack(view.cond.lbbPost, cd["left-bundle"]);
    // The three tracts light in sequence, so the impulse visibly crosses the
    // atrium rather than the whole bundle flashing at once.
    var atrialSt = cd["right-atrium"];
    ["posterior", "middle", "anterior"].forEach(function (k, i) {
      var st = atrialSt ? { level: atrialSt.level * (1 - i * 0.12), state: atrialSt.state } : null;
      setTrack(view.cond.tracts[k], st);
    });
    setTrack(view.cond.tracts.bachmann, cd["left-atrium"] || atrialSt);
    view.cond.saRadials.forEach(function (r) { setTrack(r, cd["sa-node"]); });

    ["left", "right"].forEach(function (side) {
      var st = cd[side + "-purkinje"];
      view.cond.purkinje[side].forEach(function (p, i) {
        var lvl = st ? st.level : 0;
        // Fibres light in sequence, apex first, the way activation really spreads.
        var delay = i / (view.cond.purkinje[side].length + 1);
        var v = M.clamp((lvl - delay * 0.35) / 0.65, 0, 1);
        p.setAttribute("opacity", (0.20 + 0.80 * v).toFixed(2));
        p.setAttribute("stroke-width", (1.5 + 2.4 * v).toFixed(2));
        p.classList.toggle("is-active", v > 0.25);
      });
    });

    /* Atrial depolarisation lights the atrial wall itself. The right atrium
     * leads and the left follows via Bachmann's bundle, so they glow in turn
     * rather than together. */
    var atr = cd["right-atrium"], atrL = cd["left-atrium"];
    view.cond.atrialGlow.right.setAttribute("d", raCavD);
    view.cond.atrialGlow.left.setAttribute("d", laCavD);
    [["right", atr, 0], ["left", atrL || atr, 0.28]].forEach(function (spec) {
      var g = view.cond.atrialGlow[spec[0]], st = spec[1];
      var lvl = st ? M.clamp(st.level - spec[2] * 0.5, 0, 1) : 0;
      g.setAttribute("opacity", lvl.toFixed(2));
      g.classList.toggle("is-chaotic", !!st && st.state === "chaotic");
    });

    /* Place the travelling marker on whichever segment of the pathway the
     * impulse currently occupies. The AV node holds it, which is exactly the
     * point of the PR segment, so it sits there and pulses during the delay. */
    var routes = {
      // The marker follows the anterior tract, which is the shortest route from
      // the sinus node to the AV node and the one the impulse effectively takes.
      internodal: GEO.internodalTracts(anchors).anterior,
      his: GEO.hisPath(anchors),
      right: GEO.bundlePath(anchors, "right"),
      left: GEO.bundlePath(anchors, "left")
    };
    var marker = null;
    var pick = function (key, st) {
      if (!st || st.level < 0.08) return;
      marker = { pts: routes[key], u: M.clamp(st.progress, 0, 1), level: st.level, state: st.state };
    };
    pick("internodal", cd["right-atrium"]);
    if (cd["av-node"] && cd["av-node"].level > 0.08) {
      var avSt = cd["av-node"];
      marker = { pts: routes.internodal, u: 1, level: avSt.level, state: avSt.state, hold: true };
    }
    pick("his", cd["his-bundle"]);
    pick("left", cd["left-bundle"]);
    pick("right", cd["right-bundle"]);
    if (cd["left-purkinje"] && cd["left-purkinje"].level > 0.08) {
      marker = { pts: routes.left, u: 1, level: cd["left-purkinje"].level, state: "spread" };
    }

    var chaotic = (cd["right-atrium"] && cd["right-atrium"].state === "chaotic") ||
                  (cd["left-ventricle"] && cd["left-ventricle"].state === "chaotic");
    if (marker && !chaotic && !sim.reducedMotion) {
      var pos = GEO.pointAlong(marker.pts, marker.u);
      view.cond.wave.setAttribute("opacity", (0.35 + 0.65 * marker.level).toFixed(2));
      view.cond.waveDot.setAttribute("cx", pos.x.toFixed(1));
      view.cond.waveDot.setAttribute("cy", pos.y.toFixed(1));
      view.cond.waveHalo.setAttribute("cx", pos.x.toFixed(1));
      view.cond.waveHalo.setAttribute("cy", pos.y.toFixed(1));
      var held = marker.hold ? 1 + 0.22 * Math.sin(frame.tMs / 90) : 1;
      view.cond.waveHalo.setAttribute("r", (11 * held).toFixed(1));
      view.cond.wave.classList.toggle("is-held", !!marker.hold);
      view.cond.wave.classList.toggle("is-blocked", marker.state === "blocked");
    } else {
      view.cond.wave.setAttribute("opacity", 0);
    }

    /* A blocked impulse stops at the node, and says so. */
    var avState = cd["av-node"];
    view.cond.blockMark.setAttribute("opacity", (avState && avState.state === "blocked") ? 1 : 0);

    /* An ectopic beat starts somewhere it should not. Mark where. */
    var ect = null;
    for (var i = 0; i < frame.events.length; i++) {
      var e = frame.events[i];
      if (e.type === "ventricular-depolarization" && e.wide) ect = { x: 352, y: 396 };
      if (e.type === "atrial-depolarization" && e.origin === "ectopic-atrial") ect = { x: 340, y: 200 };
    }
    if (ect) {
      view.cond.ectopicMark.setAttribute("cx", ect.x);
      view.cond.ectopicMark.setAttribute("cy", ect.y);
      view.cond.ectopicMark.setAttribute("opacity", 0.9);
    } else {
      view.cond.ectopicMark.setAttribute("opacity", 0);
    }

    /* Flow. Arrow position derives from simulation time, so Pause freezes them
     * and scrubbing recomputes them — and unlike dots, a frozen arrow still
     * says which way the blood is going. Nothing crosses a shut valve. */
    /* The chamber-side leg of each route is rebuilt from the live geometry, so
     * it stays attached to the valve and the cavity as they move. */
    var leadIn = {
      "rv-to-pulmonary-artery": [
        { x: (vg.tricuspid.x1 + vg.tricuspid.x2) / 2 + 6, y: vg.pulmonic.y + 96 },
        { x: (vg.pulmonic.x1 + vg.pulmonic.x2) / 2 - 6, y: vg.pulmonic.y + 40 },
        { x: (vg.pulmonic.x1 + vg.pulmonic.x2) / 2, y: vg.pulmonic.y + 2 }
      ],
      "lv-to-aorta": [
        { x: (vg.mitral.x1 + vg.mitral.x2) / 2 - 12, y: vg.aortic.y + 104 },
        { x: (vg.aortic.x1 + vg.aortic.x2) / 2 - 4, y: vg.aortic.y + 44 },
        { x: (vg.aortic.x1 + vg.aortic.x2) / 2, y: vg.aortic.y + 2 }
      ],
      "ra-to-rv": [
        { x: (vg.tricuspid.x1 + vg.tricuspid.x2) / 2 + 4, y: vg.tricuspid.y - 46 },
        { x: (vg.tricuspid.x1 + vg.tricuspid.x2) / 2, y: vg.tricuspid.y + 4 },
        { x: (vg.tricuspid.x1 + vg.tricuspid.x2) / 2 - 10, y: vg.tricuspid.y + 62 }
      ],
      "la-to-lv": [
        { x: (vg.mitral.x1 + vg.mitral.x2) / 2 + 4, y: vg.mitral.y - 46 },
        { x: (vg.mitral.x1 + vg.mitral.x2) / 2, y: vg.mitral.y + 4 },
        { x: (vg.mitral.x1 + vg.mitral.x2) / 2 - 12, y: vg.mitral.y + 66 }
      ]
    };
    Object.keys(view.flow).forEach(function (id) {
      var fe = view.flow[id];
      var lead = leadIn[id], tail = fe.vesselRoute;
      fe.route = lead && tail ? lead.concat(tail)
               : lead ? lead
               : tail ? tail
               : fe.staticRoute;
    });

    var reduced = sim.reducedMotion;
    Object.keys(view.flow).forEach(function (id) {
      var f = frame.flow[id], fe = view.flow[id];
      if (!f.active) {
        fe.arrows.forEach(function (a) { a.setAttribute("opacity", 0); });
        return;
      }
      // Reduced motion keeps the arrows, parked at fixed stations. Direction is
      // the information here and it does not require movement to convey.
      var speed = 0.00020 + 0.00040 * f.intensity;
      var phase = reduced ? 0 : (frame.tMs * speed) % 1;
      fe.arrows.forEach(function (a, k) {
        var u = (phase + k / fe.count) % 1;
        var p = GEO.pointAlong(fe.route, u);
        var deg = (p.angle || 0) * 180 / Math.PI;
        var scale = 0.85 + 0.35 * f.intensity;
        a.setAttribute("transform", "translate(" + p.x.toFixed(1) + "," + p.y.toFixed(1) +
                       ") rotate(" + deg.toFixed(1) + ") scale(" + scale.toFixed(2) + ")");
        // Fade in and out at the ends of the route so arrows do not pop into
        // existence mid-vessel.
        var fade = reduced ? 1 : Math.min(1, Math.min(u, 1 - u) * 7);
        a.setAttribute("opacity", (0.45 + 0.55 * f.intensity * fade).toFixed(2));
      });
    });

    /* Re-anchor every label whose target is generated rather than fixed, so a
     * leader line always lands on the structure it names. Hand-typed anchors
     * drift the moment the geometry moves — that is how "Pulmonary artery"
     * ended up pointing at the aorta. */
    var dyn = GEO.labelAnchors(lvThick, descend);

    // Vessels: a point measured along the drawn path itself.
    var VESSEL_AT = { "svc": 0.62, "ivc": 0.42, "aorta": 0.26,
                      "pulmonary-artery": 0.55, "pulmonary-veins": 0.40 };
    for (var vk in VESSEL_AT) {
      var vp = view.vessels[vk === "pulmonary-veins" ? "pv1" : vk];
      if (!vp || !vp.getTotalLength) continue;
      try {
        var pt = vp.getPointAtLength(vp.getTotalLength() * VESSEL_AT[vk]);
        dyn[vk] = { x: pt.x, y: pt.y };
      } catch (e) { /* path not measurable in this environment */ }
    }

    // Chambers: the centre of the shape as it currently stands.
    var CHAMBER_OF = { "right-atrium": "ra", "left-atrium": "la",
                       "right-ventricle": "rv", "left-ventricle": "lv" };
    for (var ck in CHAMBER_OF) {
      var part = view.chambers[CHAMBER_OF[ck]];
      if (!part) continue;
      var cb = part.empty.getBBox();
      dyn[ck] = { x: cb.x + cb.width * 0.5, y: cb.y + cb.height * 0.55 };
    }

    // Valves: the middle of the annulus, which moves with the valve plane.
    ["tricuspid", "mitral", "aortic", "pulmonic"].forEach(function (vn) {
      var gv = vg[vn];
      dyn[vn] = { x: (gv.x1 + gv.x2) / 2, y: gv.y + gv.span * 0.35 };
    });

    var septS = 0.42;
    dyn.septum = { x: GEO.lvCx(septS) - GEO.lvOuterHalfWidth(septS, lvThick) + 8,
                   y: GEO.lvY(septS, descend) };

    for (var dk in dyn) {
      var lab = view.labels[dk];
      if (!lab) continue;
      var L = GEO.LABELS[dk];
      var dot = lab.querySelector(".anno-dot"), line = lab.querySelector(".anno-line");
      dot.setAttribute("cx", dyn[dk].x.toFixed(1));
      dot.setAttribute("cy", dyn[dk].y.toFixed(1));
      line.setAttribute("d", "M" + L.tx + "," + L.ty + " L" +
                        dyn[dk].x.toFixed(1) + "," + dyn[dk].y.toFixed(1));
    }

    /* Pathology: wall thickness is real geometry, not a colour wash. */
    view.chambers.lv.group.classList.toggle("is-hypertrophied", s.condition === "lvh");
    view.chambers.rv.group.classList.toggle("is-hypertrophied", s.condition === "rvh");
  }

  function setNode(node, st) {
    var lvl = st ? st.level : 0;
    node.setAttribute("data-level", lvl.toFixed(2));
    node.style.setProperty("--lvl", lvl.toFixed(3));
    node.classList.toggle("is-active", lvl > 0.15);
    node.classList.toggle("is-blocked", !!st && st.state === "blocked");
    node.classList.toggle("is-delay", !!st && st.state === "delay");
  }

  function setTrack(path, st) {
    var lvl = st ? st.level : 0;
    path.style.setProperty("--lvl", lvl.toFixed(3));
    path.classList.toggle("is-active", lvl > 0.15);
  }

  /* Atrial depolarisation spreads outward from the SA node across both atria.
   * Drawn as expanding arcs rather than two wires, because that is what it is. */
  function arcPath(origin, r) {
    var cx = origin.x, cy = origin.y;
    var a0 = 2.55, a1 = 0.05;   // sweep down-left, round the bottom, up to the left atrium
    return "M" + (cx + r * Math.cos(a0)).toFixed(1) + "," + (cy + r * Math.sin(a0) * 0.82).toFixed(1) +
           " A" + r.toFixed(1) + "," + (r * 0.82).toFixed(1) + " 0 0 0 " +
           (cx + r * Math.cos(a1)).toFixed(1) + "," + (cy + r * Math.sin(a1) * 0.82).toFixed(1);
  }

  /* Focus modes: one relationship at a time. */
  var FOCUS_LAYERS = {
    anatomy:     { vessels: 1, vesselsFront: 1, chambers: 1, valves: 0.85, conduction: 0.55, flow: 0, labels: 1, markers: 0 },
    conduction:  { vessels: 0.30, vesselsFront: 0.30, chambers: 0.40, valves: 0.30, conduction: 1, flow: 0, labels: 1, markers: 1 },
    contraction: { vessels: 0.5, vesselsFront: 0.5, chambers: 1, valves: 1, conduction: 0.22, flow: 0.55, labels: 1, markers: 0 },
    flow:        { vessels: 1, vesselsFront: 1, chambers: 0.88, valves: 1, conduction: 0.10, flow: 1, labels: 1, markers: 0 },
    integrated:  { vessels: 0.95, vesselsFront: 0.95, chambers: 1, valves: 1, conduction: 1, flow: 1, labels: 1, markers: 1 }
  };

  /* With labels off there is no need for the side gutters, so the drawing gets
   * the whole panel. */
  var BOX_LABELLED = "-52 14 606 522";
  var BOX_BARE = "86 14 400 522";

  function applyFocus(view, focus, labelSet, highlight) {
    var map = FOCUS_LAYERS[focus] || FOCUS_LAYERS.integrated;
    // Naming conduction structures while the conduction layer is dimmed to a
    // tenth leaves labels pointing at things the learner cannot see.
    if (labelSet === "conduction") {
      map = Object.keys(map).reduce(function (o, k) { o[k] = map[k]; return o; }, {});
      map.conduction = 1;
    }
    var wantsLabels = labelSet && labelSet !== "none";
    view.svg.setAttribute("viewBox", wantsLabels ? BOX_LABELLED : BOX_BARE);
    map.wavefront = map.conduction;
    Object.keys(view.layers).forEach(function (name) {
      var o = map[name];
      if (o === undefined) o = 1;
      view.layers[name].style.opacity = o;
      view.layers[name].style.pointerEvents = o < 0.2 ? "none" : "";
    });

    var set = GEO.LABEL_SETS[labelSet] || [];
    Object.keys(view.labels).forEach(function (key) {
      var on = set.indexOf(key) >= 0;
      view.labels[key].setAttribute("opacity", on ? 1 : 0);
    });

    // Spotlight: dim everything that is not the structure being talked about.
    var hi = highlight && highlight.length ? highlight : null;
    view.svg.classList.toggle("has-spotlight", !!hi);
    var all = view.svg.querySelectorAll("[data-region]");
    for (var i = 0; i < all.length; i++) {
      var r = all[i].getAttribute("data-region");
      all[i].classList.toggle("is-spotlit", !!hi && hi.indexOf(r) >= 0);
    }
  }

  C.render.heart = { create: create, update: update, applyFocus: applyFocus, FOCUS_LAYERS: FOCUS_LAYERS };
})(window.CARDIAC);

</script>
<script>
/* 42-render-ecg.js */
/* 42-render-ecg.js — the tracing.
 *
 * Drawn on real ECG paper geometry: 25 mm/s and 10 mm/mV, isotropic, so a
 * small square is 0.04 s wide and 0.1 mV tall and a learner can actually count
 * squares. All twelve leads come from the same dipole at the same instants, so
 * they cannot drift apart.
 */
(function (C) {
  "use strict";

  var M = C.M, E = C.engine.ecg, VEC = C.engine.vector;

  var MM_PER_SEC = 25, MM_PER_MV = 10;
  // The magnified single-complex view runs at double paper speed.
  var DETAIL_MM_PER_SEC = 50;

  function dpr() { return Math.min(window.devicePixelRatio || 1, 2); }

  function fitCanvas(canvas) {
    var r = canvas.getBoundingClientRect();
    var k = dpr();
    var w = Math.max(1, Math.round(r.width * k)), h = Math.max(1, Math.round(r.height * k));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    var ctx = canvas.getContext("2d");
    ctx.setTransform(k, 0, 0, k, 0, 0);
    return { ctx: ctx, w: r.width, h: r.height };
  }

  function css(name, fallback) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    return (v && v.trim()) || fallback;
  }

  /* ------------------------------------------------------------------- grid */

  /* The grid takes separate horizontal and vertical millimetre scales. A small
   * square always means 0.04 s by 0.1 mV, so counting squares stays valid even
   * when a magnified view stretches time relative to voltage. */
  function drawGrid(ctx, x, y, w, h, pxX, pxY) {
    pxY = pxY || pxX;
    ctx.save();
    ctx.fillStyle = css("--ecg-paper", "#fffdfb");
    ctx.fillRect(x, y, w, h);

    var minor = css("--ecg-grid-minor", "#F3D6D1");
    var major = css("--ecg-grid-major", "#E9AAA0");
    var i, p;

    ctx.lineWidth = 1;
    ctx.strokeStyle = minor;
    ctx.beginPath();
    for (i = 0; (p = i * pxX) <= w + 0.5; i++) {
      if (i % 5 === 0) continue;
      ctx.moveTo(x + p + 0.5, y); ctx.lineTo(x + p + 0.5, y + h);
    }
    for (i = 0; (p = i * pxY) <= h + 0.5; i++) {
      if (i % 5 === 0) continue;
      ctx.moveTo(x, y + p + 0.5); ctx.lineTo(x + w, y + p + 0.5);
    }
    ctx.stroke();

    ctx.strokeStyle = major;
    ctx.beginPath();
    for (i = 0; (p = i * 5 * pxX) <= w + 0.5; i++) { ctx.moveTo(x + p + 0.5, y); ctx.lineTo(x + p + 0.5, y + h); }
    for (i = 0; (p = i * 5 * pxY) <= h + 0.5; i++) { ctx.moveTo(x, y + p + 0.5); ctx.lineTo(x + w, y + p + 0.5); }
    ctx.stroke();
    ctx.restore();
  }

  /* ---------------------------------------------------------------- tracing */

  /* One vertical segment per pixel column, spanning the minimum and maximum of
   * the samples in that column, so a narrow QRS spike keeps its true height
   * instead of being decimated away. */
  function drawTrace(ctx, wv, state, lead, t0Ms, durMs, x, y, w, h, pxPerMm, opts) {
    opts = opts || {};
    var baselineY = opts.baselineY !== undefined
      ? opts.baselineY
      : y + h * (opts.baseline === undefined ? 0.62 : opts.baseline);
    var pxPerMv = (opts.pxPerMmY || pxPerMm) * MM_PER_MV * (opts.gain || 1);
    var cols = Math.max(2, Math.round(w));
    var msPerCol = durMs / cols;
    var subSteps = Math.max(1, Math.min(8, Math.round(msPerCol / 2)));

    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();

    ctx.lineWidth = opts.thin ? 1.3 : 1.7;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.strokeStyle = opts.color || css("--ecg-trace", "#1A1A1A");

    ctx.beginPath();
    for (var c = 0; c < cols; c++) {
      var lo = Infinity, hi = -Infinity;
      for (var s = 0; s < subSteps; s++) {
        var t = t0Ms + (c + s / subSteps) * msPerCol;
        var mv = E.sampleLead(wv, t, lead, state);
        if (mv < lo) lo = mv;
        if (mv > hi) hi = mv;
      }
      var yHi = baselineY - hi * pxPerMv;
      var yLo = baselineY - lo * pxPerMv;
      var px = x + c + 0.5;
      if (c === 0) ctx.moveTo(px, yHi);
      ctx.lineTo(px, yHi);
      ctx.lineTo(px, yLo);
    }
    ctx.stroke();
    ctx.restore();
    return { baselineY: baselineY, pxPerMv: pxPerMv };
  }

  /* Calibration mark: a 1 mV, 200 ms step. Standard on every real tracing. */
  function drawCalibration(ctx, x, baselineY, pxPerMm) {
    var w = 5 * pxPerMm, h = 10 * pxPerMm;
    ctx.save();
    ctx.strokeStyle = css("--ecg-trace", "#1A1A1A");
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.moveTo(x, baselineY);
    ctx.lineTo(x + w * 0.25, baselineY);
    ctx.lineTo(x + w * 0.25, baselineY - h);
    ctx.lineTo(x + w * 0.95, baselineY - h);
    ctx.lineTo(x + w * 0.95, baselineY);
    ctx.lineTo(x + w * 1.3, baselineY);
    ctx.stroke();
    ctx.restore();
    return w * 1.3;
  }

  /* What the signal actually spans in this window, so a view can be scaled to
   * hold it instead of clipping the top off the QRS. */
  function amplitudeRange(wv, state, leads, t0Ms, durMs, stepMs) {
    var lo = Infinity, hi = -Infinity;
    var step = stepMs || 4;
    for (var i = 0; i < leads.length; i++) {
      for (var t = t0Ms; t <= t0Ms + durMs; t += step) {
        var v = E.sampleLead(wv, t, leads[i], state);
        if (v < lo) lo = v;
        if (v > hi) hi = v;
      }
    }
    if (!isFinite(lo)) { lo = -0.5; hi = 1.0; }
    return { lo: lo, hi: hi };
  }

  /* --------------------------------------------------- wave-segment finding */

  /* Where each named wave sits in time, taken from the wavelets that actually
   * generated it. Used to point at "this T wave" rather than at a guess. */
  function segments(wv, t0Ms, t1Ms, tag) {
    var out = [];
    for (var i = 0; i < wv.list.length; i++) {
      var w = wv.list[i];
      if (tag && w.tag !== tag) continue;
      if (w.t0 + w.dur < t0Ms || w.t0 > t1Ms) continue;
      out.push({ tag: w.tag, t0: w.t0, t1: w.t0 + w.dur, eventId: w.eventId });
    }
    out.sort(function (a, b) { return a.t0 - b.t0; });
    var merged = [];
    for (var j = 0; j < out.length; j++) {
      var last = merged[merged.length - 1];
      if (last && out[j].tag === last.tag && out[j].t0 <= last.t1 + 30) {
        last.t1 = Math.max(last.t1, out[j].t1);
      } else merged.push(out[j]);
    }
    return merged;
  }

  var TAG_LABEL = { P: "P", QRS: "QRS", T: "T", U: "U", ST: "ST", f: "f", Ta: "" };

  /* The clickable anatomy of the tracing. Named waves come straight from the
   * wavelets that generated them; the intervals BETWEEN them are derived from
   * the gaps, which is how the PR segment and the ST segment become things a
   * learner can point at rather than stretches of empty paper. */
  var GAP_KEY = { "P>QRS": "pr", "QRS>T": "st", "T>P": "tp", "U>P": "tp", "T>QRS": "tp", "U>QRS": "tp" };

  function waveRegions(wv, schedule, t0Ms, durMs) {
    var t1 = t0Ms + durMs;
    var named = [];
    ["P", "QRS", "T", "U"].forEach(function (tag) {
      segments(wv, t0Ms, t1, tag).forEach(function (sg) {
        named.push({ key: tag.toLowerCase(), tag: tag, t0: sg.t0, t1: sg.t1 });
      });
    });
    named.sort(function (a, b) { return a.t0 - b.t0; });

    var out = named.slice();
    for (var i = 0; i < named.length - 1; i++) {
      var a = named[i], b = named[i + 1];
      var gap = b.t0 - a.t1;
      if (gap < 18) continue;
      var key = GAP_KEY[a.tag + ">" + b.tag];
      if (!key) continue;
      out.push({ key: key, tag: null, t0: a.t1, t1: b.t0 });
    }

    // Rhythms with no organised atrial activity get their baseline named for
    // what it actually is, rather than left unlabelled.
    if (schedule.rhythmId === "aflutter") out.push({ key: "flutter", tag: null, t0: t0Ms, t1: t1, weak: true });
    if (schedule.rhythmId === "af") out.push({ key: "fib", tag: null, t0: t0Ms, t1: t1, weak: true });

    out.sort(function (a, b) { return (a.weak ? 1 : 0) - (b.weak ? 1 : 0); });
    return out;
  }

  /* Which region a pointer is over. Strong regions win over the weak
   * whole-window ones, so clicking a QRS in flutter selects the QRS. */
  function regionAt(regions, tMs) {
    for (var i = 0; i < regions.length; i++) {
      if (tMs >= regions[i].t0 && tMs <= regions[i].t1) return regions[i];
    }
    return null;
  }

  function timeAtX(layout, canvas, clientX) {
    var r = canvas.getBoundingClientRect();
    var frac = M.clamp((clientX - r.left - layout.gx) / layout.gw, 0, 1);
    return layout.t0 + frac * layout.durMs;
  }

  /* Paint a band over a region and name it. */
  function drawRegionBand(ctx, layout, region, mode) {
    if (!region) return;
    var x1 = layout.gx + ((region.t0 - layout.t0) / layout.durMs) * layout.gw;
    var x2 = layout.gx + ((region.t1 - layout.t0) / layout.durMs) * layout.gw;
    x1 = Math.max(x1, layout.gx); x2 = Math.min(x2, layout.gx + layout.gw);
    if (x2 - x1 < 1.5) return;
    var g = C.content.waveGuide[region.key];
    ctx.save();
    ctx.fillStyle = mode === "selected"
      ? "color-mix(in srgb, " + css("--accent", "#A0522D") + " 26%, transparent)"
      : "color-mix(in srgb, " + css("--accent", "#A0522D") + " 13%, transparent)";
    ctx.fillRect(x1, layout.gy, x2 - x1, layout.gh);
    ctx.strokeStyle = css("--accent", "#A0522D");
    ctx.lineWidth = mode === "selected" ? 2 : 1;
    ctx.setLineDash(mode === "selected" ? [] : [4, 3]);
    ctx.beginPath();
    ctx.moveTo(x1, layout.gy); ctx.lineTo(x1, layout.gy + layout.gh);
    ctx.moveTo(x2, layout.gy); ctx.lineTo(x2, layout.gy + layout.gh);
    ctx.stroke();
    ctx.setLineDash([]);
    if (g && x2 - x1 > 26) {
      ctx.font = "700 11px " + css("--font-ui", "system-ui, sans-serif");
      ctx.fillStyle = css("--accent", "#A0522D");
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.fillText(g.label.split(" — ")[0], (x1 + x2) / 2, layout.gy + 3);
    }
    ctx.restore();
  }

  function drawHighlights(ctx, wv, t0Ms, durMs, x, y, w, h, tags) {
    if (!tags || !tags.length) return;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    for (var k = 0; k < tags.length; k++) {
      var segs = segments(wv, t0Ms, t0Ms + durMs, tags[k]);
      ctx.fillStyle = css("--wave-highlight", "rgba(237,181,46,0.24)");
      for (var i = 0; i < segs.length; i++) {
        var sx = x + ((segs[i].t0 - t0Ms) / durMs) * w;
        var sw = ((segs[i].t1 - segs[i].t0) / durMs) * w;
        if (sw < 1) continue;
        ctx.fillRect(sx, y + 2, sw, h - 4);
      }
    }
    ctx.restore();
  }

  /* ------------------------------------------------------------ single lead */

  function drawStrip(canvas, sim, opts) {
    opts = opts || {};
    var fit = fitCanvas(canvas);
    var ctx = fit.ctx, W = fit.w, H = fit.h;
    var state = sim.state, wv = sim.wave;

    var seconds = opts.seconds || state.stripSeconds || 6;
    var padL = 6, padR = 6, padT = 4, padB = 16;
    var gx = padL, gy = padT, gw = W - padL - padR, gh = H - padT - padB;
    var pxPerMm = gw / (MM_PER_SEC * seconds);

    ctx.clearRect(0, 0, W, H);
    drawGrid(ctx, gx, gy, gw, gh, pxPerMm);

    var durMs = seconds * 1000;
    // Sweep display: the window holds still and the trace is written across it,
    // the way a bedside monitor behaves.
    var winIndex = Math.floor(sim.tMs / durMs);
    var t0 = winIndex * durMs;
    var cursorFrac = (sim.tMs - t0) / durMs;

    drawHighlights(ctx, wv, t0, durMs, gx, gy, gw, gh, opts.highlightTags);

    var geom = drawTrace(ctx, wv, state, opts.lead || state.selectedLead, t0, durMs,
                         gx, gy, gw, gh, pxPerMm, { baseline: 0.60 });

    // Blank the short segment just ahead of the cursor so the sweep reads as a
    // sweep rather than as a wall of overlapping beats.
    if (!opts.static && sim.playing) {
      var cx = gx + cursorFrac * gw;
      var gap = Math.min(gw * 0.03, 26);
      ctx.save();
      ctx.fillStyle = css("--ecg-paper", "#fffdfb");
      ctx.globalAlpha = 0.92;
      ctx.fillRect(cx, gy + 1, gap, gh - 2);
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = css("--accent", "#A0522D");
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, gy); ctx.lineTo(cx, gy + gh); ctx.stroke();
      ctx.restore();
    } else {
      var cx2 = gx + cursorFrac * gw;
      ctx.save();
      ctx.strokeStyle = css("--accent", "#A0522D");
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(cx2, gy); ctx.lineTo(cx2, gy + gh); ctx.stroke();
      ctx.restore();
    }

    if (opts.calibration !== false) drawCalibration(ctx, gx + 4, geom.baselineY, pxPerMm);

    ctx.save();
    ctx.fillStyle = css("--muted", "#6B6560");
    ctx.font = "600 12px " + css("--font-ui", "system-ui, sans-serif");
    ctx.textBaseline = "top";
    ctx.fillText((opts.lead || state.selectedLead), gx + 6, gy + 4);
    ctx.textAlign = "right";
    ctx.fillText(seconds + " s  ·  25 mm/s  ·  10 mm/mV", gx + gw - 6, gy + gh + 2);
    ctx.restore();

    var layout = { t0: t0, durMs: durMs, gx: gx, gy: gy, gw: gw, gh: gh, pxPerMm: pxPerMm, geom: geom };
    drawRegionBand(ctx, layout, opts.hoverRegion, "hover");
    drawRegionBand(ctx, layout, opts.selectedRegion, "selected");
    return layout;
  }

  /* ------------------------------------------------------------ beat detail
   *
   * One complex, magnified, with each wave named and the intervals bracketed.
   * This is where a learner who has never read a strip finds out which bump is
   * which — and, because the waves are located from the wavelets that generated
   * them, the labels cannot drift out of step with the tracing.
   */
  function drawBeatDetail(canvas, sim, opts) {
    opts = opts || {};
    var fit = fitCanvas(canvas);
    var ctx = fit.ctx, W = fit.w, H = fit.h;
    var state = sim.state, wv = sim.wave;

    // Park on the last complete beat so the labels are not chasing the cursor.
    var beat = null, beats = sim.schedule.beats;
    for (var i = 0; i < beats.length; i++) {
      if (beats[i].tMs <= sim.tMs) beat = beats[i]; else { if (!beat) beat = beats[i]; break; }
    }

    var padL = 6, padR = 6, padT = 26, padB = 58;
    var gx = padL, gy = padT, gw = W - padL - padR, gh = H - padT - padB;
    ctx.clearRect(0, 0, W, H);

    if (!beat || sim.hemo.noOutput) {
      var pxNoX = gw / (DETAIL_MM_PER_SEC * 1.4);
      var t0no = sim.tMs - 700;
      var rngNo = amplitudeRange(wv, state, [opts.lead || state.selectedLead], t0no, 1400, 4);
      var spanNo = Math.max(1.5, (rngNo.hi - rngNo.lo) + 0.44);
      var pxNoY = gh / (spanNo * MM_PER_MV);
      drawGrid(ctx, gx, gy, gw, gh, pxNoX, pxNoY);
      drawTrace(ctx, wv, state, opts.lead || state.selectedLead, t0no, 1400, gx, gy, gw, gh, pxNoX,
                { pxPerMmY: pxNoY, baselineY: gy + ((rngNo.hi + 0.22) / spanNo) * gh });
      ctx.save();
      ctx.fillStyle = css("--muted", "#6B6560");
      ctx.font = "600 12px " + css("--font-ui", "system-ui, sans-serif");
      ctx.textAlign = "center";
      ctx.fillText(sim.schedule.rhythmId === "asystole"
        ? "No organised complexes to label"
        : "No organised complexes — nothing here is a P, QRS or T", W / 2, gy - 12);
      ctx.restore();
      return;
    }

    // Show one complex and a little breathing room, not two. At slow rates the
    // window is capped so the trace does not shrink into the middle.
    var rr = beat.rrMs || 800;
    var durMs = M.clamp(rr * 1.06, 620, 1500);
    var seconds = durMs / 1000;
    var t0 = beat.tMs - durMs * 0.30;

    // Time is deliberately magnified here, so the horizontal and vertical
    // millimetre scales are set independently: double paper speed across, and
    // whatever vertical scale holds the whole complex. Deriving both from the
    // width is what used to push a 1 mV R wave to 367 px in a 230 px canvas and
    // slice the top off the QRS. A small square still means 0.04 s by 0.1 mV,
    // so counting squares still works.
    var pxX = gw / (DETAIL_MM_PER_SEC * seconds);
    var rng = amplitudeRange(wv, state, [opts.lead || state.selectedLead], t0, durMs, 3);
    var padMv = 0.22;
    var spanMv = Math.max(1.5, (rng.hi - rng.lo) + padMv * 2);
    var pxY = gh / (spanMv * MM_PER_MV);
    var baseY = gy + ((rng.hi + padMv) / spanMv) * gh;

    drawGrid(ctx, gx, gy, gw, gh, pxX, pxY);
    drawHighlights(ctx, wv, t0, durMs, gx, gy, gw, gh, opts.highlightTags);
    var geom = drawTrace(ctx, wv, state, opts.lead || state.selectedLead, t0, durMs,
                         gx, gy, gw, gh, pxX, { pxPerMmY: pxY, baselineY: baseY });

    var toX = function (t) { return gx + ((t - t0) / durMs) * gw; };

    /* Wave names, placed over the wave that produced them. */
    var named = [];
    ["P", "QRS", "T", "U"].forEach(function (tag) {
      var segs = segments(wv, t0, t0 + durMs, tag);
      for (var s = 0; s < segs.length; s++) {
        var mid = (segs[s].t0 + segs[s].t1) / 2;
        if (mid < t0 + 60 || mid > t0 + durMs - 60) continue;
        named.push({ tag: tag, mid: mid, t0: segs[s].t0, t1: segs[s].t1 });
      }
    });

    ctx.save();
    ctx.font = "700 13px " + css("--font-ui", "system-ui, sans-serif");
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    named.forEach(function (n) {
      var x = toX(n.mid);
      ctx.fillStyle = css("--accent", "#A0522D");
      ctx.fillText(n.tag, x, gy - 6);
      ctx.strokeStyle = css("--accent", "#A0522D");
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, gy - 4); ctx.lineTo(x, gy + 4); ctx.stroke();
      ctx.globalAlpha = 1;
    });
    ctx.restore();

    /* Interval brackets along the bottom. */
    var pSeg = named.filter(function (n) { return n.tag === "P"; })[0];
    var qSeg = named.filter(function (n) { return n.tag === "QRS"; })[0];
    var tSeg = named.filter(function (n) { return n.tag === "T"; })[0];
    var by = gy + gh + 12;

    function bracket(a, b, label, row) {
      if (a === null || b === null || b <= a) return;
      var x1 = toX(a), x2 = toX(b);
      if (x2 - x1 < 12) return;
      var y = by + row * 15;
      ctx.save();
      ctx.strokeStyle = css("--muted", "#6B6560");
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x1, y - 4); ctx.lineTo(x1, y); ctx.lineTo(x2, y); ctx.lineTo(x2, y - 4);
      ctx.stroke();
      ctx.fillStyle = css("--muted", "#6B6560");
      ctx.font = "600 11px " + css("--font-ui", "system-ui, sans-serif");
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.fillText(label, (x1 + x2) / 2, y + 1);
      ctx.restore();
    }

    // Only measure a PR where a P actually conducted to this QRS. In complete
    // block the two are independent, so the distance between them is not a PR
    // interval and printing one would invent a relationship.
    var prMeasurable = sim.schedule.rhythmId !== "avb3" &&
                       sim.schedule.rhythmId !== "aflutter" &&
                       sim.schedule.rhythmId !== "af" &&
                       !!(beat && beat.prMs);
    if (!state.hideName) {
      if (pSeg && qSeg && prMeasurable) bracket(pSeg.t0, qSeg.t0, "PR " + ((qSeg.t0 - pSeg.t0) / 1000).toFixed(2) + " s", 0);
      if (qSeg && tSeg) bracket(qSeg.t0, tSeg.t1, "QT " + ((tSeg.t1 - qSeg.t0) / 1000).toFixed(2) + " s", 1);
      if (qSeg) bracket(qSeg.t0, qSeg.t1, "QRS " + ((qSeg.t1 - qSeg.t0) / 1000).toFixed(2) + " s", prMeasurable ? 2 : 0);
    }

    ctx.save();
    ctx.fillStyle = css("--muted", "#6B6560");
    ctx.font = "500 11px " + css("--font-ui", "system-ui, sans-serif");
    ctx.textAlign = "right"; ctx.textBaseline = "bottom";
    ctx.fillText("50 mm/s · small square = 0.04 s × 0.1 mV", gx + gw - 6, gy + gh - 5);
    ctx.restore();

    var layout = { t0: t0, durMs: durMs, gx: gx, gy: gy, gw: gw, gh: gh };
    drawRegionBand(ctx, layout, opts.hoverRegion, "hover");
    drawRegionBand(ctx, layout, opts.selectedRegion, "selected");
    return layout;
  }

  /* ---------------------------------------------------------- 12-lead grid */

  function drawTwelve(canvas, sim, opts) {
    opts = opts || {};
    var fit = fitCanvas(canvas);
    var ctx = fit.ctx, W = fit.w, H = fit.h;
    var state = sim.state, wv = sim.wave;

    var rows = C.GRID_ROWS;
    var padL = 4, padR = 4, padT = 4, padB = 4;
    var rhythmH = opts.rhythmStrip === false ? 0 : Math.max(56, (H - padT - padB) * 0.22);
    var gridH = H - padT - padB - rhythmH;
    var cellW = (W - padL - padR) / 4;
    var cellH = gridH / 3;

    ctx.clearRect(0, 0, W, H);

    // Every cell shows the SAME 2.5 seconds. This is a simultaneous display, not
    // the sequential columns of a printed ECG.
    var segMs = 2500;
    var t0 = Math.floor(sim.tMs / segMs) * segMs;
    var cursorFrac = (sim.tMs - t0) / segMs;

    var pxPerMm = cellW / (MM_PER_SEC * (segMs / 1000));

    /* One gain for the whole grid so leads stay comparable, but each cell is
     * centred on its OWN isoelectric line, the way a printed ECG is. Sizing
     * every cell to the range spanned by all twelve leads together would force
     * half gain on a perfectly normal tracing. Gain drops only when the tallest
     * single lead genuinely will not fit — which left ventricular hypertrophy
     * does — and the grid says so when it happens. */
    var perLead = {}, worstSpan = 0;
    for (var li = 0; li < C.LEAD_ORDER.length; li++) {
      var lk = C.LEAD_ORDER[li];
      var rl = amplitudeRange(wv, state, [lk], t0, segMs, 8);
      perLead[lk] = rl;
      worstSpan = Math.max(worstSpan, rl.hi - rl.lo);
    }
    var neededPx = (worstSpan + 0.25) * MM_PER_MV * pxPerMm;
    var gain = neededPx > (cellH - 8) ? 0.5 : 1;

    for (var r = 0; r < 3; r++) {
      for (var c = 0; c < 4; c++) {
        var lead = rows[r][c];
        var x = padL + c * cellW, y = padT + r * cellH;
        drawGrid(ctx, x, y, cellW - 1, cellH - 1, pxPerMm);
        drawHighlights(ctx, wv, t0, segMs, x, y, cellW - 1, cellH - 1, opts.highlightTags);
        drawTrace(ctx, wv, state, lead, t0, segMs, x, y, cellW - 1, cellH - 1, pxPerMm,
                  { thin: true, gain: gain,
                    baselineY: y + (cellH - 1) / 2 +
                      ((perLead[lead].hi + perLead[lead].lo) / 2) * MM_PER_MV * pxPerMm * gain,
                    color: lead === state.selectedLead ? css("--accent", "#A0522D") : null });

        ctx.save();
        ctx.font = "700 12px " + css("--font-ui", "system-ui, sans-serif");
        ctx.fillStyle = lead === state.selectedLead ? css("--accent", "#A0522D") : css("--ink", "#1A1A1A");
        ctx.textBaseline = "top";
        ctx.fillText(lead, x + 5, y + 3);
        ctx.restore();

        if (lead === state.selectedLead) {
          ctx.save();
          ctx.strokeStyle = css("--accent", "#A0522D");
          ctx.lineWidth = 2;
          ctx.strokeRect(x + 1, y + 1, cellW - 3, cellH - 3);
          ctx.restore();
        }

        ctx.save();
        ctx.strokeStyle = css("--rule", "#DED7CC");
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, cellW - 1, cellH - 1);
        ctx.restore();
      }
    }

    if (rhythmH > 0) {
      var ry = padT + gridH;
      var rPxPerMm = (W - padL - padR) / (MM_PER_SEC * (segMs / 1000) * 2.4);
      drawGrid(ctx, padL, ry, W - padL - padR, rhythmH - 2, rPxPerMm);
      drawTrace(ctx, wv, state, "II", t0 - segMs * 1.4, segMs * 2.4,
                padL, ry, W - padL - padR, rhythmH - 2, rPxPerMm, { baseline: 0.58 });
      ctx.save();
      ctx.font = "700 12px " + css("--font-ui", "system-ui, sans-serif");
      ctx.fillStyle = css("--ink", "#1A1A1A");
      ctx.textBaseline = "top";
      ctx.fillText("II — rhythm strip", padL + 5, ry + 3);
      ctx.textAlign = "right";
      ctx.fillStyle = css("--muted", "#6B6560");
      ctx.fillText("25 mm/s · " + (gain === 1 ? "10 mm/mV" : "5 mm/mV (half gain — complexes are too tall for full gain)"),
                   W - padR - 5, ry + 3);
      ctx.restore();
    }

    // One cursor across the whole grid, because all twelve are one moment.
    ctx.save();
    ctx.strokeStyle = css("--accent", "#A0522D");
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1.6;
    for (var cc = 0; cc < 4; cc++) {
      var lx = padL + cc * cellW + cursorFrac * (cellW - 1);
      ctx.beginPath(); ctx.moveTo(lx, padT); ctx.lineTo(lx, padT + gridH); ctx.stroke();
    }
    ctx.restore();

    return { t0: t0, segMs: segMs, cellW: cellW, cellH: cellH, padL: padL, padT: padT, gridH: gridH };
  }

  /* Which grid cell is under a pointer, so the learner can click a lead. */
  function leadAtPoint(canvas, layout, clientX, clientY) {
    var r = canvas.getBoundingClientRect();
    var x = clientX - r.left, y = clientY - r.top;
    if (y > layout.padT + layout.gridH) return "II";
    var c = Math.floor((x - layout.padL) / layout.cellW);
    var rw = Math.floor((y - layout.padT) / layout.cellH);
    if (c < 0 || c > 3 || rw < 0 || rw > 2) return null;
    return C.GRID_ROWS[rw][c];
  }

  /* ------------------------------------------------------------ vector loop */

  /* The QRS loop in the frontal plane. Shows directly why a lead that faces the
   * loop records a tall R and a lead that faces away records a deep S. */
  function drawVectorLoop(canvas, sim, opts) {
    opts = opts || {};
    var fit = fitCanvas(canvas);
    var ctx = fit.ctx, W = fit.w, H = fit.h;
    var cx = W / 2, cy = H / 2;
    var scale = Math.min(W, H) * 0.32;

    ctx.clearRect(0, 0, W, H);

    ctx.save();
    ctx.strokeStyle = css("--rule", "#DED7CC");
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, scale, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - scale, cy); ctx.lineTo(cx + scale, cy);
    ctx.moveTo(cx, cy - scale); ctx.lineTo(cx, cy + scale); ctx.stroke();
    ctx.restore();

    // Lead axes of the frontal plane.
    ctx.save();
    ctx.font = "600 11px " + css("--font-ui", "system-ui, sans-serif");
    C.LIMB_LEADS.forEach(function (lead) {
      var info = VEC.LEAD_INFO[lead];
      var a = info.angle * Math.PI / 180;
      var sel = lead === sim.state.selectedLead;
      ctx.strokeStyle = sel ? css("--accent", "#A0522D") : css("--quiet", "#9E9890");
      ctx.lineWidth = sel ? 2 : 1;
      ctx.beginPath();
      ctx.moveTo(cx - Math.cos(a) * scale * 0.9, cy - Math.sin(a) * scale * 0.9);
      ctx.lineTo(cx + Math.cos(a) * scale * 1.06, cy + Math.sin(a) * scale * 1.06);
      ctx.stroke();
      ctx.fillStyle = sel ? css("--accent", "#A0522D") : css("--muted", "#6B6560");
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(lead, cx + Math.cos(a) * scale * 1.2, cy + Math.sin(a) * scale * 1.2);
    });
    ctx.restore();

    // The loop itself, over the beat nearest the current time.
    var beat = null, beats = sim.schedule.beats;
    for (var i = 0; i < beats.length; i++) {
      if (beats[i].tMs <= sim.tMs + 260) beat = beats[i]; else break;
    }
    if (!beat) return;

    var span = 200, step = 2;
    var vscale = scale / 1.5;
    ctx.save();
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = css("--conduction", "#EDB52E");
    ctx.beginPath();
    var started = false;
    for (var t = beat.tMs - 20; t < beat.tMs + span; t += step) {
      var d = E.dipoleAt(sim.wave, t);
      var px = cx + d[0] * vscale, py = cy + d[1] * vscale;
      if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();

    // The instantaneous vector right now.
    var dn = E.dipoleAt(sim.wave, sim.tMs);
    var mag = Math.hypot(dn[0], dn[1]);
    if (mag > 0.02) {
      ctx.save();
      ctx.strokeStyle = css("--ink", "#1A1A1A");
      ctx.fillStyle = css("--ink", "#1A1A1A");
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + dn[0] * vscale, cy + dn[1] * vscale);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx + dn[0] * vscale, cy + dn[1] * vscale, 3.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.fillStyle = css("--muted", "#6B6560");
    ctx.font = "500 10px " + css("--font-ui", "system-ui, sans-serif");
    ctx.textAlign = "center";
    ctx.fillText("frontal plane", cx, H - 4);
    ctx.restore();
  }

  C.render.ecg = {
    MM_PER_SEC: MM_PER_SEC, MM_PER_MV: MM_PER_MV,
    drawStrip: drawStrip, drawTwelve: drawTwelve, drawVectorLoop: drawVectorLoop,
    drawBeatDetail: drawBeatDetail,
    leadAtPoint: leadAtPoint, segments: segments, TAG_LABEL: TAG_LABEL,
    waveRegions: waveRegions, regionAt: regionAt, timeAtX: timeAtX,
    fitCanvas: fitCanvas
  };
})(window.CARDIAC);

</script>
<script>
/* 43-render-timeline.js */
/* 43-render-timeline.js — two tracks, one clock.
 *
 * The electrical track and the mechanical track are drawn separately and are
 * allowed to overlap, because they do: ejection continues into early
 * repolarisation, and relaxation begins while the T wave is still being written.
 * Nothing is forced onto a seven-stage normal-cycle rail, so an irregular or
 * arrest rhythm never displays a cycle label it does not have.
 */
(function (C) {
  "use strict";

  var M = C.M;

  var ELECTRICAL = {
    "atrial-depolarization": { label: "P — atria depolarise", cls: "t-p" },
    "av-arrival":            { label: "AV node", cls: "t-av" },
    "ventricular-depolarization": { label: "QRS — ventricles depolarise", cls: "t-qrs" },
    "ventricular-repolarization": { label: "T — ventricles repolarise", cls: "t-t" }
  };

  var MECHANICAL = {
    "atrial-systole":        { label: "Atrial contraction", cls: "m-atrial" },
    "ventricular-ejection":  { label: "Ejection", cls: "m-eject" }
  };

  function create(host) {
    host.innerHTML = "";
    host.classList.add("timeline");
    var wrap = document.createElement("div");
    wrap.className = "tl-wrap";

    function track(name, label) {
      var t = document.createElement("div");
      t.className = "tl-track tl-" + name;
      var l = document.createElement("span");
      l.className = "tl-label";
      l.textContent = label;
      var lane = document.createElement("div");
      lane.className = "tl-lane";
      t.appendChild(l); t.appendChild(lane);
      wrap.appendChild(t);
      return lane;
    }

    var elec = track("elec", "Electrical");
    var mech = track("mech", "Mechanical");

    var cursor = document.createElement("div");
    cursor.className = "tl-cursor";
    wrap.appendChild(cursor);

    host.appendChild(wrap);

    var legend = document.createElement("div");
    legend.className = "tl-legend";
    [["t-p", "P"], ["t-av", "AV delay"], ["t-qrs", "QRS"], ["t-t", "T"],
     ["m-atrial", "Atrial squeeze"], ["m-ivc", "Isovolumetric"], ["m-eject", "Ejection"],
     ["m-fill", "Passive filling"], ["m-kick", "Atrial kick"]].forEach(function (pair) {
      var s = document.createElement("span");
      s.className = "tl-key";
      var sw = document.createElement("i");
      sw.className = pair[0];
      s.appendChild(sw);
      s.appendChild(document.createTextNode(pair[1]));
      legend.appendChild(s);
    });
    host.appendChild(legend);

    return { host: host, wrap: wrap, elec: elec, mech: mech, cursor: cursor, legend: legend };
  }

  /* A label that does not fit is worse than no label: it becomes "Ej…" and reads
   * as noise. Below the threshold the block keeps its colour, its tooltip and
   * its accessible name, and the legend carries the meaning. */
  /* Lane width is read once per update and passed in. Reading clientWidth per
     block forced a synchronous layout about seventy times a frame. */
  var laneW = 400;

  function block(lane, cls, left, width, label, extra) {
    var b = document.createElement("div");
    b.className = "tl-block " + cls + (extra || "");
    b.style.left = left.toFixed(2) + "%";
    b.style.width = Math.max(0.35, width).toFixed(2) + "%";
    var px = (width / 100) * laneW;
    if (px >= label.length * 6.2 + 8) {
      var s = document.createElement("span");
      s.textContent = label;
      b.appendChild(s);
    } else if (px >= 18) {
      var short = label.split(/[ —(]/)[0];
      if (px >= short.length * 5.4 + 5) {
        var s2 = document.createElement("span");
        s2.textContent = short;
        b.appendChild(s2);
      }
    }
    b.title = label;
    b.setAttribute("aria-label", label);
    lane.appendChild(b);
    return b;
  }

  function update(view, sim, frame, t0Ms, durMs) {
    view.elec.innerHTML = "";
    view.mech.innerHTML = "";

    // The block labels name the rhythm's features outright ("Blocked",
    // "Flutter wave"), which would hand the learner the answer mid-challenge.
    var hide = sim.state && sim.state.hideName;
    if (hide) {
      view.cursor.style.left = "0%";
      view.host.setAttribute("data-hidden", "1");
      return;
    }
    view.host.removeAttribute("data-hidden");
    laneW = view.elec.clientWidth || 400;

    var t1 = t0Ms + durMs;
    var events = sim.schedule.events;
    var pct = function (t) { return ((t - t0Ms) / durMs) * 100; };

    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (e.onsetMs > t1) break;
      var end = e.onsetMs + e.durMs;
      if (end < t0Ms) continue;

      var spec = ELECTRICAL[e.type];
      if (spec) {
        if (e.type === "av-arrival") {
          // The AV delay is the pause itself — show its whole length, and show
          // clearly when the impulse got there and stopped.
          var hold = e.conducted ? (e.prMs || 160) - 45 : 70;
          var b = block(view.elec, spec.cls, pct(e.onsetMs), (hold / durMs) * 100,
                        e.conducted ? "AV delay" : "Blocked",
                        e.conducted ? "" : " is-blocked");
          if (!e.conducted) b.setAttribute("data-blocked", "1");
        } else {
          var lbl = spec.label;
          if (e.type === "ventricular-depolarization" && e.wide) lbl = "QRS — wide, not via the fast path";
          if (e.type === "atrial-depolarization" && e.origin === "flutter") lbl = "Flutter wave";
          if (e.type === "atrial-depolarization" && e.origin === "ectopic-atrial") lbl = "P — early, different focus";
          block(view.elec, spec.cls, pct(e.onsetMs), (e.durMs / durMs) * 100, lbl);
        }
      }

      var mspec = MECHANICAL[e.type];
      if (mspec) {
        var mlabel = mspec.label;
        if (e.type === "ventricular-ejection" && frame && frame.arrest) mlabel = "No effective ejection";
        block(view.mech, mspec.cls, pct(e.onsetMs), (e.durMs / durMs) * 100, mlabel);
      }
    }

    /* Filling and the isovolumetric periods come from the beat record, so they
     * only appear where a real beat produced them. */
    var beats = sim.hemo.beats;
    for (var b2 = 0; b2 < beats.length; b2++) {
      var bt = beats[b2];
      if (bt.tMs > t1 + 500) break;
      if (bt.ejectEnd < t0Ms - 500) continue;
      if (!sim.hemo.noOutput && !sim.hemo.arrest) {
