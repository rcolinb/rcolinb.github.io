        block(view.mech, "m-ivc", pct(bt.closeMs), ((bt.ejectStart - bt.closeMs) / durMs) * 100, "Isovolumetric contraction");
        block(view.mech, "m-ivr", pct(bt.ejectEnd), ((bt.fillStart - bt.ejectEnd) / durMs) * 100, "Isovolumetric relaxation");
        var nextB = beats[b2 + 1];
        var fillEnd = nextB ? nextB.closeMs : bt.fillStart + 600;
        var fillSpan = fillEnd - bt.fillStart;
        if (bt.kick) {
          var kickAt = bt.fillStart + fillSpan * 0.72;
          block(view.mech, "m-fill", pct(bt.fillStart), ((kickAt - bt.fillStart) / durMs) * 100,
                "Passive filling \u2014 most of the ventricle fills here, before the atria contract");
          block(view.mech, "m-kick", pct(kickAt), ((fillEnd - kickAt) / durMs) * 100,
                "Atrial kick \u2014 atria contract and top up the last "
                + Math.round((bt.kickFrac || 0) * 100) + "% of filling");
        } else {
          block(view.mech, "m-fill", pct(bt.fillStart), (fillSpan / durMs) * 100,
                "Passive filling only \u2014 no atrial kick");
        }
      }
    }

    if (sim.hemo.noOutput) {
      block(view.mech, "m-none", 0, 100, sim.schedule.rhythmId === "asystole"
        ? "No organised electrical activity, so no contraction"
        : "No coordinated contraction — no effective output");
    } else if (sim.hemo.arrest) {
      block(view.mech, "m-none", 0, 100, "Organised complexes, but no effective output in this patient state");
    }

    var cf = M.clamp((sim.tMs - t0Ms) / durMs, 0, 1);
    view.cursor.style.left = (cf * 100).toFixed(2) + "%";
  }

  C.render.timeline = { create: create, update: update };
})(window.CARDIAC);

</script>
<script>
/* 51-ui-panels.js */
/* 51-ui-panels.js — the teaching rail.
 *
 * "Rhythm" answers what am I looking at. "Why" answers how did it get that way,
 * which is the reason this product exists. "Set up" is where the learner changes
 * one thing at a time and watches what follows.
 */
(function (C) {
  "use strict";

  var M = C.M;

  function h(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== false) n.setAttribute(k, attrs[k]);
    }
    if (kids) [].concat(kids).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function section(title, kids) {
    var f = document.createDocumentFragment();
    f.appendChild(h("h4", { text: title }));
    [].concat(kids).forEach(function (c) { if (c) f.appendChild(c); });
    return f;
  }

  function list(items, cls) {
    return h("ul", cls ? { class: cls } : null, (items || []).map(function (t) {
      return h("li", { text: t });
    }));
  }

  /* Whichever record the learner is currently looking at: the condition when one
   * is selected, otherwise the rhythm. */
  function activeRecord(state) {
    if (state.condition && state.condition !== "normal") {
      var c = C.content.conditions[state.condition];
      if (c) return { kind: "condition", rec: c };
    }
    var r = C.content.rhythms[state.rhythm];
    return { kind: "rhythm", rec: r };
  }

  /* ------------------------------------------------------------ rhythm pane */

  function renderRhythm(pane, app) {
    var s = app.state;
    var r = C.content.rhythms[s.rhythm];
    pane.innerHTML = "";
    if (!r) { pane.appendChild(h("p", { text: "No record for this rhythm." })); return; }

    pane.appendChild(h("p", { class: "eyebrow", text: r.family.replace(/-/g, " ") }));
    pane.appendChild(h("h3", { class: "headline", text: r.label }));
    pane.appendChild(h("p", { text: r.headline }));

    /* With a condition applied, the strip no longer matches the plain rhythm
     * description below, so say so before the learner reads on. */
    var cond = s.condition !== "normal" ? C.content.conditions[s.condition] : null;
    if (cond) {
      var kids = [
        h("h5", { text: "Condition applied — the strip will not match the rhythm alone" }),
        h("p", { text: cond.label + ". " + (cond.headline || "") })
      ];
      if (cond.ecgFindings && cond.ecgFindings.length) kids.push(list(cond.ecgFindings.slice(0, 4)));
      kids.push(h("button", {
        type: "button", class: "pill", text: "Why does it do that?",
        onclick: function () { app.setTab("why"); }
      }));
      kids.push(h("button", {
        type: "button", class: "pill", text: "Remove condition",
        onclick: function () { app.setCondition("normal"); }
      }));
      pane.appendChild(h("div", { class: "callout variable" }, kids));
    }

    if (r.features) {
      var tb = h("tbody");
      [["Rate", "rate"], ["Regularity", "regularity"], ["P waves", "pWaves"],
       ["PR", "prInterval"], ["QRS", "qrs"]].forEach(function (row) {
        if (!r.features[row[1]]) return;
        tb.appendChild(h("tr", null, [h("th", { text: row[0] }), h("td", { text: r.features[row[1]] })]));
      });
      pane.appendChild(section("Reading the strip", h("table", { class: "features" }, tb)));
    }

    if (r.mechanical) {
      pane.appendChild(section("What the pump does", h("p", { text: r.mechanical })));
    }
    if (r.perfusionNote) {
      pane.appendChild(h("div", { class: "callout" }, [
        h("h5", { text: "Perfusion" }), h("p", { text: r.perfusionNote })
      ]));
    }
    if (r.complications && r.complications.length) {
      pane.appendChild(section("Watch for", list(r.complications)));
    }
    if (r.nursing) {
      var n = r.nursing;
      var kids = [];
      if (n.assess && n.assess.length) { kids.push(h("p", { class: "eyebrow", text: "Assess" })); kids.push(list(n.assess)); }
      if (n.act && n.act.length) { kids.push(h("p", { class: "eyebrow", text: "Act" })); kids.push(list(n.act)); }
      if (n.escalate) { kids.push(h("p", { class: "eyebrow", text: "Escalate" })); kids.push(h("p", { text: n.escalate })); }
      pane.appendChild(section("Nursing priorities", kids));
    }
    if (r.limits && r.limits.length) {
      pane.appendChild(h("div", { class: "callout limit" }, [
        h("h5", { text: "What this view cannot tell you" }),
        list(r.limits)
      ]));
    }
    if (r.compare && r.compare.length) {
      var row = h("div", { class: "pill-row" });
      r.compare.forEach(function (id) {
        var other = C.content.rhythms[id];
        if (!other) return;
        row.appendChild(h("button", {
          type: "button", class: "pill", text: "Compare with " + other.short || other.label,
          onclick: function () { app.setRhythm(id); }
        }));
      });
      if (row.childNodes.length) pane.appendChild(section("Easily confused with", row));
    }
    pane.appendChild(sourceLine(r.sourceIds));
  }

  function sourceLine(ids) {
    if (!ids || !ids.length) return document.createDocumentFragment();
    var names = ids.map(function (id) {
      var s = (C.content.sources || []).filter(function (x) { return x.id === id; })[0];
      if (!s) return null;
      var m = /^([^(]+)\(/.exec(s.cite);
      return m ? m[1].trim().replace(/,$/, "") : s.id;
    }).filter(Boolean);
    if (!names.length) return document.createDocumentFragment();
    return h("p", { class: "illustrative", text: "Sources: " + names.join("; ") + "." });
  }

  /* --------------------------------------------------------------- why pane */

  var LAYER_NAME = {
    trigger: "Trigger", cellular: "Cell level", conduction: "Conduction",
    ecg: "On the ECG", mechanical: "The pump", clinical: "For the patient"
  };

  /* Which wave on the strip a chain link is talking about, so selecting the link
   * lights up the part of the tracing it explains. */
  function tagsForLink(link) {
    var t = (link.label + " " + link.text).toLowerCase();
    var tags = [];
    if (/\bt wave|t-wave|repolaris|repolariz|peaked t|flat t/.test(t)) tags.push("T");
    if (/\bp wave|p-wave|atrial depolaris|atrial depolariz|fibrillatory|flutter wave/.test(t)) tags.push("P");
    if (/\bqrs|ventricular depolaris|ventricular depolariz|widen/.test(t)) tags.push("QRS");
    if (/\bu wave|u-wave/.test(t)) tags.push("U");
    if (/\bst segment|st depress|st elev/.test(t)) tags.push("ST");
    return tags;
  }

  function renderWhy(pane, app) {
    var s = app.state;
    var active = activeRecord(s);
    var rec = active.rec;
    pane.innerHTML = "";
    if (!rec) { pane.appendChild(h("p", { text: "No mechanism recorded." })); return; }

    pane.appendChild(h("p", { class: "eyebrow", text: "Cause and effect" }));
    pane.appendChild(h("h3", { class: "headline", text: rec.label }));

    if (active.kind === "condition") {
      // Switch what is being explained, not what is loaded. Silently deleting
      // the learner's condition to change the topic of a panel is a surprise.
      var row = h("div", { class: "pill-row" }, [
        h("button", {
          type: "button", class: "pill", text: "Read the underlying rhythm instead",
          "data-fkey": "why-rhythm",
          onclick: function () { app.setTab("rhythm"); }
        }),
        h("button", {
          type: "button", class: "pill", text: "Remove " + (rec.short || rec.label),
          "data-fkey": "why-remove",
          onclick: function () { app.setCondition("normal"); }
        })
      ]);
      pane.appendChild(row);
    }

    pane.appendChild(h("p", { class: "illustrative",
      text: "Each step should make the next one feel inevitable. Open a step for the detail behind it." }));

    var ol = h("ol", { class: "chain" });
    (rec.chain || []).forEach(function (link) {
      var li = h("li");
      li.appendChild(h("span", { class: "layer-tag layer-" + link.layer, text: LAYER_NAME[link.layer] || link.layer }));
      li.appendChild(h("span", { class: "chain-label", text: link.label }));
      li.appendChild(h("p", { class: "chain-text", text: link.text }));

      var detail = C.content.mechanisms[link.id];
      var tags = tagsForLink(link);

      if (detail || tags.length) {
        var open = false;
        var box = null;
        var btn = h("button", {
          type: "button", class: "more",
          text: detail ? "Go deeper" : "Show me on the tracing",
          "aria-expanded": "false",
          onclick: function () {
            open = !open;
            btn.setAttribute("aria-expanded", open ? "true" : "false");
            btn.textContent = open ? "Close" : (detail ? "Go deeper" : "Show me on the tracing");
            if (open) {
              if (detail && !box) { box = h("p", { class: "detail", text: detail.detail }); li.appendChild(box); }
              else if (box) box.hidden = false;
              app.setHighlight(tags);
              [].forEach.call(ol.querySelectorAll("li"), function (x) { x.classList.remove("is-current"); });
              li.classList.add("is-current");
            } else {
              if (box) box.hidden = true;
              app.setHighlight([]);
              li.classList.remove("is-current");
            }
          }
        });
        li.appendChild(btn);
      }
      ol.appendChild(li);
    });
    pane.appendChild(ol);

    if (rec.ecgFindings && rec.ecgFindings.length) {
      pane.appendChild(h("div", { class: "callout variable" }, [
        h("h5", { text: "What may appear on the ECG" }),
        list(rec.ecgFindings)
      ]));
    }
    if (rec.nonspecific) {
      pane.appendChild(h("div", { class: "callout variable" }, [
        h("h5", { text: "Or it may not" }), h("p", { text: rec.nonspecific })
      ]));
    }
    if (rec.requiresTwelveLead) {
      pane.appendChild(h("div", { class: "callout limit" }, [
        h("h5", { text: "Needs more than one lead" }),
        h("p", { text: "This pattern is a relationship between leads. A single rhythm strip cannot show it, and cannot rule it in or out." }),
        s.mode === "basic" ? h("button", {
          type: "button", class: "pill", text: "Switch to Advanced 12-lead",
          onclick: function () { app.setMode("advanced"); }
        }) : null
      ]));
    }
    if (rec.limits && rec.limits.length && active.kind === "condition") {
      pane.appendChild(h("div", { class: "callout limit" }, [
        h("h5", { text: "Limits" }), list(rec.limits)
      ]));
    }
    var mod = C.engine.ecg.MODS[s.condition];
    if (mod && mod.note) {
      pane.appendChild(h("div", { class: "callout" }, [
        h("h5", { text: "How the model draws it" }), h("p", { text: mod.note })
      ]));
    }
    pane.appendChild(sourceLine(rec.sourceIds));
  }

  /* ------------------------------------------------------------- setup pane */

  function slider(label, value, opts, onInput) {
    var row = h("div", { class: "slider-row" });
    var id = "sl-" + Math.random().toString(36).slice(2, 8);
    var val = h("span", { class: "val", text: opts.format(value) });
    row.appendChild(h("label", { for: id, text: label }));
    row.appendChild(val);
    var input = h("input", {
      type: "range", id: id, min: opts.min, max: opts.max, step: opts.step || 1, value: value,
      // Without valuetext a screen reader reads "62" for a control whose scale
      // is qualitative, which tells the learner nothing.
      "aria-valuetext": opts.format(value),
      oninput: function () {
        var v = parseFloat(input.value);
        var t = opts.format(v);
        val.textContent = t;
        input.setAttribute("aria-valuetext", t);
        onInput(v);
      }
    });
    row.appendChild(input);
    if (opts.hint) row.appendChild(h("p", { class: "hint", text: opts.hint }));
    return row;
  }

  function renderSetup(pane, app) {
    var s = app.state;
    pane.innerHTML = "";

    /* --- rate --- */
    var spec = C.engine.rhythm.RATE_SPEC[s.rhythm];
    var rateKids = [];
    if (spec && spec.kind !== "none") {
      rateKids.push(slider(spec.label, s.rates[spec.key] !== undefined ? s.rates[spec.key] : spec.def,
        { min: spec.min, max: spec.max, format: function (v) { return Math.round(v) + " / min"; },
          hint: spec.kind === "atrial" ? "The ventricular rate follows from how many impulses get through." : null },
        function (v) { app.setRate(spec.key, v); }));
      if (spec.kind === "dual") {
        rateKids.push(slider(spec.label2, s.rates[spec.key2] !== undefined ? s.rates[spec.key2] : spec.def2,
          { min: spec.min2, max: spec.max2, format: function (v) { return Math.round(v) + " / min"; },
            hint: "The escape pacemaker is completely independent of the atria." },
          function (v) { app.setRate(spec.key2, v); }));
      }
    } else {
      rateKids.push(h("p", { class: "illustrative", text: "This rhythm has no countable rate to set." }));
    }
    if (s.rhythm === "aflutter") {
      var ratios = [["2", "2:1"], ["3", "3:1"], ["4", "4:1"], ["variable", "Variable"]];
      var rr = h("div", { class: "pill-row" });
      ratios.forEach(function (p) {
        rr.appendChild(h("button", {
          type: "button", class: "pill", text: p[1], "data-fkey": "ratio-" + p[0],
          "aria-pressed": String(String(s.flutterRatio) === p[0]),
          onclick: function () { app.setFlutterRatio(p[0] === "variable" ? "variable" : parseInt(p[0], 10)); }
        }));
      });
      rateKids.push(h("p", { class: "eyebrow", text: "AV conduction ratio" }));
      rateKids.push(rr);
    }
    pane.appendChild(section("Rate", rateKids));

    /* --- patient state --- */
    var psOptions = patientStatesFor(s.rhythm);
    if (psOptions.length > 1) {
      var ps = h("div", { class: "pill-row" });
      psOptions.forEach(function (o) {
        ps.appendChild(h("button", {
          type: "button", class: "pill", text: o.label, "data-fkey": "pstate-" + o.id,
          "aria-pressed": String(s.patientState === o.id),
          onclick: function () { app.setPatientState(o.id); }
        }));
      });
      pane.appendChild(section("Patient state", [
        ps,
        h("p", { class: "illustrative",
          text: "The same tracing can belong to very different patients. This is a finding you get from the patient, never from the monitor." })
      ]));
    }

    /* --- physiology --- */
    var phys = C.engine.hemo.resolvePhysiology(s);
    var pk = [];
    var VARS = [
      ["preload", "Preload — filling volume", "How much the ventricle is filled before it contracts."],
      ["contractility", "Contractility", "How forcefully the muscle shortens, independent of how full it is."],
      ["compliance", "Compliance — stiffness", "How readily the ventricle accepts volume. Low compliance means a stiff ventricle."],
      ["systemicAfterload", "Systemic afterload", "The load the LEFT ventricle ejects against."],
      ["pulmonaryAfterload", "Pulmonary afterload", "The load the RIGHT ventricle ejects against. Not the same variable."]
    ];
    var shown = s.mode === "advanced" ? VARS : VARS.slice(0, 3);
    shown.forEach(function (v) {
      pk.push(slider(v[1], Math.round(phys[v[0]] * 100),
        { min: 0, max: 100, format: function (x) { return qualitative(x); }, hint: v[2] },
        function (x) { app.setPhysiology(v[0], x / 100); }));
    });
    pk.push(h("button", { type: "button", class: "btn", text: "Reset to baseline",
      onclick: function () { app.resetPhysiology(); } }));
    pane.appendChild(section("Loading conditions", pk));

    /* --- compensation --- */
    if (s.mode === "advanced") {
      var comp = h("div", { class: "pill-row" });
      Object.keys(C.engine.hemo.COMPENSATION).forEach(function (id) {
        var c = C.engine.hemo.COMPENSATION[id];
        comp.appendChild(h("button", {
          type: "button", class: "pill", text: c.label, "data-fkey": "comp-" + id,
          "aria-pressed": String(s.compensation === id),
          onclick: function () { app.setCompensation(id); }
        }));
      });
      var kids = [comp];
      var cur = C.engine.hemo.COMPENSATION[s.compensation];
      if (cur && cur.scale) {
        kids.push(h("div", { class: "callout" }, [
          h("h5", { text: "Timescale: " + cur.scale }),
          h("p", { text: "Buys: " + cur.buys }),
          h("p", { text: "Costs: " + cur.costs }),
          h("p", { class: "illustrative", text: "Playback seconds are not physiologic hours. Nothing here is retained fluid appearing beat to beat." })
        ]));
      }
      pane.appendChild(section("Compensation", kids));
    }

    /* --- signal quality: the signal-detection lesson --- */
    pane.appendChild(section("Signal quality", [
      slider("Artifact and noise", Math.round((s.noise || 0) * 100),
        { min: 0, max: 100, format: function (v) { return v === 0 ? "Clean" : v < 35 ? "Slight" : v < 70 ? "Moderate" : "Heavy"; },
          hint: "Deciding whether a P wave is really there is a judgement made in noise. Turn this up and see where your own threshold sits." },
        function (v) { app.setNoise(v / 100); })
    ]));

    /* --- seed --- */
    if (s.mode === "advanced") {
      pane.appendChild(section("Reproducibility", [
        h("p", { class: "illustrative", text: "Irregular rhythms are generated from a seed, so the same seed always gives the same strip." }),
        h("button", { type: "button", class: "btn", text: "New random pattern",
          onclick: function () { app.randomizeSeed(); } })
      ]));
    }
  }

  function qualitative(x) {
    if (x < 12) return "very low";
    if (x < 32) return "low";
    if (x < 44) return "below normal";
    if (x <= 56) return "baseline";
    if (x < 70) return "above normal";
    if (x < 88) return "high";
    return "very high";
  }

  function patientStatesFor(rhythm) {
    if (rhythm === "vf") return [{ id: "vf-arrest", label: "Arrest — no pulse" }];
    if (rhythm === "asystole") return [{ id: "asystole-arrest", label: "Arrest — no pulse" }];
    if (rhythm === "vt") return [
      { id: "vt-with-pulse", label: "VT with a pulse" },
      { id: "pulseless-vt", label: "Pulseless VT" }
    ];
    return [
      { id: "perfusing-default", label: "Perfusing" },
      { id: "pea", label: "PEA — organised rhythm, no pulse" }
    ];
  }

  C.ui.panels = {
    h: h, section: section, list: list, slider: slider,
    renderRhythm: renderRhythm, renderWhy: renderWhy, renderSetup: renderSetup,
    patientStatesFor: patientStatesFor, activeRecord: activeRecord, sourceLine: sourceLine
  };
})(window.CARDIAC);

</script>
<script>
/* 52-ui-quiz.js */
/* 52-ui-quiz.js — retrieval practice and a signal-detection drill.
 *
 * Questions delay their key until the learner commits, because feedback before
 * commitment removes the retrieval that makes the practice worth anything.
 * The keyed answer is not written into the page before the reveal.
 *
 * The rhythm challenge is deliberately a signal-detection task rather than a
 * quiz: the learner sets a threshold for "something is wrong here", and the
 * scoring separates missing a real abnormality from calling a normal strip
 * abnormal. Those are different errors with different clinical costs, and a
 * single percentage score hides both.
 */
(function (C) {
  "use strict";

  var P = C.ui.panels, h = P.h;

  var session = {
    tab: "questions",
    order: null, index: 0,
    selected: null, phase: "answering",
    right: 0, done: 0,
    sdt: { active: false, answer: null, phase: "idle", hits: 0, misses: 0, fa: 0, cr: 0, current: null }
  };

  function pool(state) {
    var lvl = state.mode === "basic" ? ["basic"] : ["basic", "advanced"];
    return C.content.questions.filter(function (q) { return lvl.indexOf(q.level) >= 0; });
  }

  function shuffle(arr, seed) {
    var r = C.rng(seed >>> 0), a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function render(pane, app) {
    pane.innerHTML = "";

    var tabs = h("div", { class: "pill-row" }, [
      h("button", { type: "button", class: "pill", text: "Questions", "data-fkey": "qtab-questions",
        "aria-pressed": String(session.tab === "questions"),
        onclick: function () { session.tab = "questions"; render(pane, app); } }),
      h("button", { type: "button", class: "pill", text: "Rhythm challenge", "data-fkey": "qtab-sdt",
        "aria-pressed": String(session.tab === "sdt"),
        onclick: function () { session.tab = "sdt"; render(pane, app); } })
    ]);
    pane.appendChild(tabs);

    if (session.tab === "sdt") renderChallenge(pane, app);
    else renderQuestions(pane, app);
  }

  /* ---------------------------------------------------------------- items */

  function renderQuestions(pane, app) {
    var items = pool(app.state);
    if (!items.length) { pane.appendChild(h("p", { text: "No items available." })); return; }

    if (!session.order || session.order.length !== items.length) {
      session.order = shuffle(items, app.state.seed);
      session.index = 0; session.selected = null; session.phase = "answering";
    }
    var q = session.order[session.index % session.order.length];

    pane.appendChild(h("p", { class: "eyebrow",
      text: q.domain.replace(/-/g, " ") + " · " + q.process.replace(/-/g, " ") }));

    if (q.setup) {
      pane.appendChild(h("button", {
        type: "button", class: "pill", text: "Load this on the simulator",
        onclick: function () { app.applySetup(q.setup); }
      }));
    }

    pane.appendChild(h("p", { class: "quiz-stem", text: q.stem }));

    var ul = h("ul", { class: "quiz-options" });
    q.options.forEach(function (o) {
      var chosen = session.selected === o.id;
      var cls = "quiz-option";
      if (session.phase === "revealed") {
        if (o.id === q.correct) cls += " is-correct";
        else if (chosen) cls += " is-wrong";
      }
      var btn = h("button", {
        type: "button", class: cls, "aria-pressed": String(chosen),
        "data-fkey": "opt-" + o.id,
        disabled: session.phase === "revealed" ? "disabled" : null,
        onclick: function () {
          if (session.phase === "revealed") return;
          session.selected = o.id;
          render(pane, app);
        }
      }, [
        h("span", { class: "key", text: o.id }),
        h("span", { text: o.text })
      ]);
      ul.appendChild(h("li", null, btn));
    });
    pane.appendChild(ul);

    // The key and rationale enter the page only at reveal.
    if (session.phase === "revealed") {
      var correct = session.selected === q.correct;
      pane.appendChild(h("div", { class: "quiz-feedback" + (correct ? "" : " is-wrong") }, [
        h("p", { html: "<strong>" + (correct ? "Correct." : "Not this time.") +
                 "</strong> The best answer is " + q.correct + "." }),
        h("p", { text: q.rationale })
      ]));
    }

    var nav = h("div", { class: "step-nav" });
    if (session.phase !== "revealed") {
      nav.appendChild(h("button", {
        type: "button", class: "btn btn-primary", text: "Check my answer",
        "data-fkey": "quiz-commit",
        disabled: session.selected ? null : "disabled",
        onclick: function () {
          session.phase = "revealed";
          session.done++;
          if (session.selected === q.correct) session.right++;
          app.announce(session.selected === q.correct ? "Correct." : "Not correct. Rationale shown.");
          app.pause();
          render(pane, app);
        }
      }));
    } else {
      nav.appendChild(h("button", {
        type: "button", class: "btn btn-primary", text: "Next question",
        "data-fkey": "quiz-commit",
        onclick: function () {
          session.index++; session.selected = null; session.phase = "answering";
          render(pane, app);
        }
      }));
    }
    nav.appendChild(h("button", {
      type: "button", class: "btn", text: "Shuffle",
      "data-fkey": "quiz-shuffle",
      onclick: function () {
        session.order = shuffle(pool(app.state), (Math.random() * 1e9) | 0);
        session.index = 0; session.selected = null; session.phase = "answering";
        render(pane, app);
      }
    }));
    pane.appendChild(nav);

    pane.appendChild(h("p", { class: "quiz-meta" }, [
      h("span", { class: "quiz-score", text: session.right + " of " + session.done + " correct" }),
      h("span", { text: "Item " + ((session.index % session.order.length) + 1) + " of " + session.order.length })
    ]));
    pane.appendChild(h("p", { class: "illustrative",
      text: "Formative practice written for this simulator. Not NCLEX items and not endorsed by NCSBN." }));
  }

  /* ------------------------------------------------------ signal detection */

  var CHALLENGE_SET = [
    { rhythm: "nsr", condition: "normal", abnormal: false, name: "Normal sinus rhythm" },
    { rhythm: "nsr", condition: "normal", abnormal: false, name: "Normal sinus rhythm" },
    { rhythm: "sinus-brady", condition: "normal", abnormal: true, name: "Sinus bradycardia" },
    { rhythm: "sinus-tachy", condition: "normal", abnormal: true, name: "Sinus tachycardia" },
    { rhythm: "af", condition: "normal", abnormal: true, name: "Atrial fibrillation" },
    { rhythm: "aflutter", condition: "normal", abnormal: true, name: "Atrial flutter" },
    { rhythm: "pvc", condition: "normal", abnormal: true, name: "Premature ventricular complexes" },
    { rhythm: "pac", condition: "normal", abnormal: true, name: "Premature atrial complexes" },
    { rhythm: "avb1", condition: "normal", abnormal: true, name: "First-degree AV block" },
    { rhythm: "mobitz1", condition: "normal", abnormal: true, name: "Mobitz I" },
    { rhythm: "mobitz2", condition: "normal", abnormal: true, name: "Mobitz II" },
    { rhythm: "avb3", condition: "normal", abnormal: true, name: "Third-degree AV block" },
    { rhythm: "vt", condition: "normal", abnormal: true, name: "Ventricular tachycardia" },
    { rhythm: "nsr", condition: "hyperkalemia", abnormal: true, name: "Sinus rhythm with hyperkalaemic changes" },
    { rhythm: "nsr", condition: "hypokalemia", abnormal: true, name: "Sinus rhythm with hypokalaemic changes" },
    { rhythm: "nsr", condition: "normal", abnormal: false, name: "Normal sinus rhythm" }
  ];

  function nextChallenge(app) {
    var s = session.sdt;
    var pick = CHALLENGE_SET[Math.floor(Math.random() * CHALLENGE_SET.length)];
    var noise = [0, 0, 0.18, 0.35, 0.55][Math.floor(Math.random() * 5)];
    s.current = pick;
    s.phase = "answering";
    s.answer = null;
    app.applySetup({ rhythm: pick.rhythm, condition: pick.condition, lead: "II" }, { hideName: true });
    app.setNoise(noise);
    app.play();
  }

  function renderChallenge(pane, app) {
    var s = session.sdt;

    pane.appendChild(h("p", { class: "eyebrow", text: "Detection under uncertainty" }));
    pane.appendChild(h("h3", { class: "headline", text: "Is something wrong with this strip?" }));

    if (s.phase === "idle") {
      pane.appendChild(h("p", { text: "You will see strips one at a time, some clean and some noisy. Decide whether the rhythm is normal or abnormal before you look for a name." }));
      pane.appendChild(h("p", { class: "illustrative", text: "Missing a real abnormality and calling a normal strip abnormal are different mistakes. Both are counted separately here, because in practice they cost different things." }));
      pane.appendChild(h("button", {
        type: "button", class: "btn btn-primary", text: "Start",
        onclick: function () { nextChallenge(app); render(pane, app); }
      }));
      return;
    }

    if (s.phase === "answering") {
      pane.appendChild(h("p", { text: "Look at the strip, then commit." }));
      var row = h("div", { class: "step-nav" }, [
        h("button", { type: "button", class: "btn", text: "Normal", onclick: function () { judge(app, pane, false); } }),
        h("button", { type: "button", class: "btn", text: "Abnormal", onclick: function () { judge(app, pane, true); } })
      ]);
      pane.appendChild(row);
    } else {
      var truth = s.current.abnormal, said = s.answer;
      var outcome = truth && said ? "Hit" : truth && !said ? "Miss"
                   : !truth && said ? "False alarm" : "Correct rejection";
      pane.appendChild(h("div", { class: "quiz-feedback" + (truth === said ? "" : " is-wrong") }, [
        h("p", { html: "<strong>" + outcome + ".</strong> This was: " + s.current.name + "." }),
        h("p", { text: truth === said ? "Your call matched the strip."
          : (truth ? "You called it normal; there was a real abnormality to find."
                   : "You called it abnormal; this one was normal. Noise can make a clean strip look suspicious.") })
      ]));
      pane.appendChild(h("button", {
        type: "button", class: "btn btn-primary", text: "Next strip",
        onclick: function () { nextChallenge(app); render(pane, app); }
      }));
    }

    var total = s.hits + s.misses + s.fa + s.cr;
    if (total) {
      var dl = h("dl", { class: "sdt-grid" }, [
        cell("Hits", s.hits, "hit", "abnormal, called abnormal"),
        cell("Misses", s.misses, "", "abnormal, called normal"),
        cell("False alarms", s.fa, "fa", "normal, called abnormal"),
        cell("Correct rejections", s.cr, "", "normal, called normal")
      ]);
      pane.appendChild(dl);
      pane.appendChild(h("p", { class: "illustrative", text: interpret(s) }));
    }
  }

  function cell(label, n, cls, sub) {
    return h("div", { class: "sdt-cell " + cls }, [
      h("dt", { text: label }), h("dd", { text: String(n) }),
      h("p", { class: "illustrative", text: sub })
    ]);
  }

  function judge(app, pane, said) {
    var s = session.sdt;
    s.answer = said;
    s.phase = "revealed";
    var truth = s.current.abnormal;
    if (truth && said) s.hits++;
    else if (truth && !said) s.misses++;
    else if (!truth && said) s.fa++;
    else s.cr++;
    app.pause();
    app.revealName();
    render(pane, app);
  }

  function interpret(s) {
    var signal = s.hits + s.misses, noise = s.fa + s.cr;
    if (signal < 3 || noise < 2) return "Keep going — a few more strips and the pattern in your errors will be readable.";
    var hitRate = s.hits / signal, faRate = s.fa / noise;
    if (hitRate > 0.8 && faRate < 0.25) return "You are separating the two well: you catch most real abnormalities without over-calling normal strips.";
    if (hitRate > 0.8 && faRate >= 0.25) return "You catch nearly everything, but you are also flagging normal strips. That is a liberal threshold — safe, but it generates alarm fatigue on a real unit.";
    if (hitRate <= 0.6 && faRate < 0.2) return "You rarely over-call, but you are missing real abnormalities. That is a conservative threshold, and misses are the more costly error here.";
    return "Your hits and false alarms are running close together, which usually means the strips are genuinely hard to tell apart rather than that your threshold is off. Slow the playback and check P waves one at a time.";
  }

  C.ui.quiz = { render: render, session: session };
})(window.CARDIAC);

</script>
<script>
/* 53-ui-lessons.js */
/* 53-ui-lessons.js — guided sequences.
 *
 * One idea per step, one sentence of text, and the simulator parked exactly
 * where that idea is visible. Playback pauses whenever a prediction is open, and
 * the prompt never covers the thing the learner needs to look at to answer it.
 */
(function (C) {
  "use strict";

  var P = C.ui.panels, h = P.h;

  var state = {
    lessonId: null, step: 0,
    predictChoice: null, predictRevealed: false,
    completed: {}
  };

  function lessonsFor(mode) {
    return C.content.lessons.filter(function (l) {
      return mode === "advanced" ? true : l.level !== "advanced";
    });
  }

  function render(pane, app) {
    pane.innerHTML = "";
    if (!state.lessonId) return renderIndex(pane, app);
    return renderStep(pane, app);
  }

  function renderIndex(pane, app) {
    pane.appendChild(h("p", { class: "eyebrow", text: "Guided sequences" }));
    pane.appendChild(h("h3", { class: "headline", text: "Work through one idea at a time" }));

    var box = h("div", { class: "lesson-list" });
    lessonsFor(app.state.mode).forEach(function (l) {
      var done = state.completed[l.id];
      box.appendChild(h("button", {
        type: "button", class: "lesson-card",
        onclick: function () { start(l.id, app, pane); }
      }, [
        h("strong", { text: l.label + (done ? "  ✓" : "") }),
        h("span", { text: l.blurb + "  ·  " + l.steps.length + " steps" })
      ]));
    });
    pane.appendChild(box);

    if (app.state.mode === "basic") {
      pane.appendChild(h("p", { class: "illustrative",
        text: "Two more sequences on ion channels and on the pump unlock in Advanced mode." }));
    }
  }

  function start(id, app, pane) {
    state.lessonId = id; state.step = 0;
    state.predictChoice = null; state.predictRevealed = false;
    applyStep(app);
    render(pane, app);
  }

  function currentLesson() {
    return C.content.lessons.filter(function (l) { return l.id === state.lessonId; })[0];
  }

  function applyStep(app) {
    var l = currentLesson();
    if (!l) return;
    var s = l.steps[state.step];
    if (!s) return;
    app.pause();
    if (s.focus) app.setFocus(s.focus);
    if (s.rhythm) app.setRhythm(s.rhythm, { keepLesson: true });
    if (s.condition) app.setCondition(s.condition, { keepLesson: true });
    if (s.patientState) app.setPatientState(s.patientState);
    if (s.lead) app.setLead(s.lead);
    if (s.leadView) app.setLeadView(s.leadView);
    app.setSpotlight(s.highlight || []);
    app.seek(s.seek);
    app.announce(s.title + ". " + s.text);
  }

  function renderStep(pane, app) {
    var l = currentLesson();
    if (!l) { state.lessonId = null; return renderIndex(pane, app); }
    var s = l.steps[state.step];

    pane.appendChild(h("button", {
      type: "button", class: "pill", text: "◀ All sequences",
      onclick: function () {
        state.lessonId = null; app.setSpotlight([]); render(pane, app);
      }
    }));

    var dots = h("div", { class: "step-dots" });
    l.steps.forEach(function (_, i) {
      dots.appendChild(h("span", {
        class: "step-dot" + (i < state.step ? " is-done" : i === state.step ? " is-current" : "")
      }));
    });
    pane.appendChild(h("div", { class: "step-head" }, [
      h("span", { class: "step-count", text: (state.step + 1) + " / " + l.steps.length }),
      dots
    ]));

    pane.appendChild(h("h3", { class: "step-title", text: s.title }));
    pane.appendChild(h("p", { class: "step-text", text: s.text }));

    if (s.predict) {
      pane.appendChild(renderPredict(s.predict, app, pane, s.id));
    }

    var nav = h("div", { class: "step-nav" });
    nav.appendChild(h("button", {
      type: "button", class: "btn", text: "◀ Back", "data-fkey": "lesson-back",
      disabled: state.step === 0 ? "disabled" : null,
      onclick: function () {
        state.step--; state.predictChoice = null; state.predictRevealed = false;
        applyStep(app); render(pane, app);
      }
    }));
    var last = state.step === l.steps.length - 1;
    nav.appendChild(h("button", {
      type: "button", class: "btn btn-primary", text: last ? "Finish" : "Next ▶",
      "data-fkey": "lesson-next",
      disabled: (s.predict && !state.predictRevealed) ? "disabled" : null,
      onclick: function () {
        if (last) {
          state.completed[l.id] = true;
          state.lessonId = null; app.setSpotlight([]);
          app.announce("Sequence complete.");
        } else {
          state.step++; state.predictChoice = null; state.predictRevealed = false;
          applyStep(app);
        }
        render(pane, app);
      }
    }));
    pane.appendChild(nav);

    if (s.predict && !state.predictRevealed) {
      pane.appendChild(h("p", { class: "illustrative", text: "Commit to a prediction before moving on." }));
    }
  }

  /* The authored predictions all list the correct option first. Presented in
   * that order a learner discovers within two steps that A is always right and
   * stops predicting, which destroys the whole point of asking. Options are
   * therefore presented in a deterministic per-step shuffle: stable across
   * re-renders and across reloads, but not the authored order. */
  function optionOrder(stepId, count) {
    var r = C.rng(hashString(stepId));
    var idx = [];
    for (var i = 0; i < count; i++) idx.push(i);
    for (var j = idx.length - 1; j > 0; j--) {
      var k = Math.floor(r() * (j + 1));
      var t = idx[j]; idx[j] = idx[k]; idx[k] = t;
    }
    return idx;
  }

  function hashString(str) {
    var hv = 2166136261;
    for (var i = 0; i < str.length; i++) {
      hv ^= str.charCodeAt(i);
      hv = Math.imul(hv, 16777619);
    }
    return hv >>> 0;
  }

  function renderPredict(p, app, pane, stepId) {
    var box = h("div", { class: "predict" });
    box.appendChild(h("h5", { text: "Predict first" }));
    box.appendChild(h("p", { text: p.q }));

    var order = optionOrder(stepId, p.options.length);
    var ul = h("ul", { class: "quiz-options" });
    order.forEach(function (orig, slot) {
      var chosen = state.predictChoice === orig;
      var cls = "quiz-option";
      if (state.predictRevealed) {
        if (orig === p.correct) cls += " is-correct";
        else if (chosen) cls += " is-wrong";
      }
      ul.appendChild(h("li", null, h("button", {
        type: "button", class: cls, "aria-pressed": String(chosen),
        "data-fkey": "predict-" + slot,
        disabled: state.predictRevealed ? "disabled" : null,
        onclick: function () { state.predictChoice = orig; render(pane, app); }
      }, [
        h("span", { class: "key", text: String.fromCharCode(65 + slot) }),
        h("span", { text: p.options[orig] }),
        state.predictRevealed
          ? h("span", { class: "verdict", text: orig === p.correct ? "correct" : (chosen ? "not this one" : "") })
          : null
      ])));
    });
    box.appendChild(ul);

    if (!state.predictRevealed) {
      box.appendChild(h("button", {
        type: "button", class: "btn btn-primary", text: "Show me",
        "data-fkey": "predict-reveal",
        disabled: state.predictChoice === null ? "disabled" : null,
        onclick: function () {
          state.predictRevealed = true;
          app.announce(p.reveal);
          render(pane, app);
        }
      }));
    } else {
      box.appendChild(h("div", { class: "quiz-feedback" + (state.predictChoice === p.correct ? "" : " is-wrong") }, [
        h("p", { text: p.reveal })
      ]));
    }
    return box;
  }

  C.ui.lessons = { render: render, state: state, lessonsFor: lessonsFor };
})(window.CARDIAC);

</script>
<script>
/* 60-app.js */
/* 60-app.js — state, the single clock, and wiring.
 *
 * One monotonic time source drives everything. Simulation time is anchored to an
 * origin and a playback rate rather than accumulated frame by frame, so a
 * dropped frame cannot shift the physiology, and animation speed is a completely
 * separate quantity from the patient's heart rate.
 */
(function (C) {
  "use strict";

  var M = C.M, R = C.engine.rhythm, E = C.engine.ecg, H = C.engine.hemo, F = C.engine.frame;
  var P = C.ui.panels, h = P.h;

  var SCHEDULE_MS = 90000;

  var app = {
    state: null,
    schedule: null, wave: null, hemo: null, measures: null,
    tMs: 0, playing: false,
    reducedMotion: false,
    heartView: null, timelineView: null,
    _origin: 0, _originT: 0, _raf: null, _dirty: true
  };

  function defaults() {
    return {
      mode: "basic",
      leadView: "single",
      selectedLead: "II",
      focus: "anatomy",
      labelSet: "chambers",
      rhythm: "nsr",
      rates: {},
      flutterRatio: 2,
      condition: "normal",
      compensation: "off",
      patientState: "perfusing-default",
      physiology: null,
      seed: 4182,
      noise: 0,
      playbackRate: 0.25,
      stripSeconds: 6,
      highlightTags: [],
      spotlight: [],
      hideName: false,
      tab: "rhythm"
    };
  }

  /* --------------------------------------------------------------- rebuild */

  function rebuild(preserveTime) {
    // A selected wave belongs to a specific schedule; keeping it across a
    // rhythm or condition change would point at a wave that no longer exists.
    if (app._selectedWave) {
      app._selectedWave = null;
      var box = document.getElementById("waveExplainer");
      if (box) box.hidden = true;
    }
    var t = preserveTime ? app.tMs : null;
    app.schedule = R.build(app.state, SCHEDULE_MS);
    app.wave = E.buildWavelets(app.schedule, app.state);
    app.hemo = H.compute(app.schedule, app.state);
    app.measures = E.measure(app.schedule, app.wave, app.state);
    app.tMs = (t === null) ? app.schedule.startMs : t;
    setOrigin();
    app._dirty = true;
  }

  function setOrigin() {
    app._origin = app.tMs;
    app._originT = performance.now();
  }

  /* Dragging a slider fires an input event per pixel, and each one would
   * regenerate ninety seconds of schedule, waveform and beat mechanics. Coalesce
   * them into one rebuild per frame so the drag stays smooth. */
  var _pendingRebuild = false;
  function rebuildSoon() {
    if (_pendingRebuild) return;
    _pendingRebuild = true;
    requestAnimationFrame(function () {
      _pendingRebuild = false;
      rebuild(true);
    });
  }

  /* ------------------------------------------------------------------ loop */

  function tick() {
    app._raf = requestAnimationFrame(tick);
    if (app.playing) {
      var wall = performance.now() - app._originT;
      var next = app._origin + wall * app.state.playbackRate;
      if (next > SCHEDULE_MS - 4000) {
        // Roll back to the teaching start rather than run off the end of the
        // generated schedule.
        app.tMs = app.schedule.startMs;
        setOrigin();
      } else {
        app.tMs = next;
      }
      app._dirty = true;
    }
    if (app._dirty) { draw(); app._dirty = false; }
  }

  function draw() {
    var frame = F.frameAt(app, app.tMs);
    app.frame = frame;

    C.render.heart.update(app.heartView, app, frame);

    var stripCanvas = document.getElementById("stripCanvas");
    var twelveCanvas = document.getElementById("twelveCanvas");
    var showTwelve = app.state.leadView === "twelve";

    // The 12-lead grid already carries a Lead II rhythm strip along its bottom,
    // so showing a second one would only steal height from the grid.
    document.getElementById("twelveWrap").hidden = !showTwelve;
    document.getElementById("stripWrap").hidden = showTwelve;
    document.getElementById("detailWrap").hidden = showTwelve;

    var layout;
    if (showTwelve) {
      app._twelveLayout = C.render.ecg.drawTwelve(twelveCanvas, app, {
        highlightTags: app.state.highlightTags
      });
      layout = { t0: app._twelveLayout.t0, durMs: app._twelveLayout.segMs };
    } else {
      layout = C.render.ecg.drawStrip(stripCanvas, app, {
        seconds: app.state.stripSeconds, highlightTags: app.state.highlightTags,
        hoverRegion: app._hover && app._hover.on === "strip" ? app._hover.region : null,
        selectedRegion: regionInWindow(app._selectedWave, layoutWindow(app._stripLayout))
      });
      app._stripLayout = layout;
      app._detailLayout = C.render.ecg.drawBeatDetail(document.getElementById("detailCanvas"), app, {
        highlightTags: app.state.highlightTags,
        hoverRegion: app._hover && app._hover.on === "detail" ? app._hover.region : null,
        selectedRegion: regionInWindow(app._selectedWave, layoutWindow(app._detailLayout))
      });
    }

    renderLens();
    C.render.timeline.update(app.timelineView, app, frame, layout.t0, layout.durMs);
    renderReadouts(frame);
    renderEventChip(frame);

    document.getElementById("stateSummary").textContent = app.state.hideName
      ? "Rhythm challenge in progress. The rhythm name and measurements are hidden until you commit."
      : F.describe(app, frame);
  }

  /* The lead-as-lens overlay: the net electrical vector drawn against the
   * frontal lead axes, so "why is the QRS upright here and inverted there"
   * becomes a matter of looking at which way the arrow points. */
  function renderLens() {
    var show = app.state.mode === "advanced" && !app.state.hideName;
    var row = document.getElementById("lensRow");
    row.hidden = !show;
    if (!show) return;

    C.render.ecg.drawVectorLoop(document.getElementById("lensCanvas"), app);

    var lead = app.state.selectedLead;
    var info = C.engine.vector.LEAD_INFO[lead];
    var d = E.dipoleAt(app.wave, app.tMs);
    var proj = C.engine.vector.projectLead(d, lead);
    var mag = Math.hypot(d[0], d[1], d[2]);
    var sense = mag < 0.04 ? "there is almost no net vector at this instant, so the trace sits on the baseline"
      : proj > 0.05 ? "the wavefront is heading toward this lead's positive electrode, so the trace goes up"
      : proj < -0.05 ? "the wavefront is heading away from this lead's positive electrode, so the trace goes down"
      : "the wavefront is running nearly perpendicular to this lead, so it records very little";

    var note = document.getElementById("lensNote");
    note.innerHTML = "";
    note.appendChild(h("b", { text: "Lead " + lead + " — " + info.plane + " plane, " + info.angle + "°" }));
    note.appendChild(document.createTextNode(
      "This lead views the " + info.view + ". Right now " + sense + ". " +
      "The loop is the same beat seen as a rotating vector; every lead is that one vector projected onto a different axis."));
  }

  /* ------------------------------------------------------- wave interaction */

  function layoutWindow(l) { return l ? { t0: l.t0, t1: l.t0 + l.durMs } : null; }

  function regionInWindow(sel, win) {
    if (!sel || !win) return null;
    return (sel.t1 > win.t0 && sel.t0 < win.t1) ? sel : null;
  }

  function pickRegion(canvas, layout, clientX) {
    if (!layout) return null;
    var regions = C.render.ecg.waveRegions(app.wave, app.schedule, layout.t0, layout.durMs);
    return C.render.ecg.regionAt(regions, C.render.ecg.timeAtX(layout, canvas, clientX));
  }

  /* Selecting a wave pauses there, spotlights what the heart is doing at that
   * instant, and explains it beside the tracing. One click, three connections. */
  function selectWave(region) {
    app._selectedWave = region || null;
    var box = document.getElementById("waveExplainer");
    if (!region) {
      box.hidden = true;
      api.setHighlight([]);
      api.setSpotlight([]);
      app._dirty = true;
      return;
    }
    var g = C.content.waveGuide[region.key];
    if (!g) { box.hidden = true; return; }

    api.pause();
    // Land a little inside the region so the heart shows it mid-event.
    api.seek({ kind: "time", ms: region.t0 + (region.t1 - region.t0) * 0.45 });
    api.setSpotlight(g.spotlight || []);
    // The band drawn over the selected region is the highlight. Also tinting
    // every other P and QRS in the six-second window buries it in noise.
    api.setHighlight([]);

    document.getElementById("waveTitle").textContent = g.label;
    var body = document.getElementById("waveBody");
    body.innerHTML = "";
    [["Electrically", g.electrical, ""], ["In the heart, right now", g.mechanical, ""],
     ["Careful", g.caution, "caution"]].forEach(function (row) {
      if (!row[1]) return;
      body.appendChild(h("dt", { text: row[0] }));
      body.appendChild(h("dd", { text: row[1], class: row[2] || null }));
    });
    box.hidden = false;
    // The panel scrolls, so an explainer that opens below the fold reads as
    // nothing having happened.
    if (box.scrollIntoView) box.scrollIntoView({ block: "nearest", behavior: "smooth" });
    api.announce(g.label + ". " + g.mechanical);
    app._dirty = true;
  }

  /* -------------------------------------------------------------- readouts */

  function renderReadouts(frame) {
    var host = document.getElementById("readouts");
    var m = app.measures, s = app.state;
    var items = [];
    if (s.hideName) {
      host.innerHTML = "";
      host.appendChild(h("div", { class: "readout" }, [
        h("dt", { text: "Measurements" }),
        h("dd", { text: "Hidden" })
      ]));
      return;
    }

    items.push(["Ventricular rate", m.ventricularRate ? m.ventricularRate : "—",
                m.ventricularRate ? "/min" : "", null]);
    if (m.atrialRate && m.atrialRate !== m.ventricularRate) {
      items.push(["Atrial rate", m.atrialRate, "/min", null]);
    }
    items.push(["Rhythm", m.regular === null ? "—" : (m.regular ? "Regular" : "Irregular"), "", null]);
    if (m.prMs && s.rhythm !== "af" && s.rhythm !== "avb3" && s.rhythm !== "vt") {
      items.push(["PR", (m.prMs / 1000).toFixed(2), "s", m.prMs > 200 ? "warn" : null]);
    }
    if (m.qrsMs) items.push(["QRS", (m.qrsMs / 1000).toFixed(2), "s", m.qrsMs >= 120 ? "warn" : null]);
    if (s.mode === "advanced") {
      if (m.qtMs) items.push(["QT", (m.qtMs / 1000).toFixed(2), "s", null]);
      if (m.axis !== null && m.axis !== undefined && s.leadView === "twelve") {
        items.push(["QRS axis", m.axis + "°", "", m.axisLabel === "normal axis" ? null : "warn"]);
      }
    }

    var cat = frame.outputCategory;
    items.push(["Relative output", cat.label, "", cat.tone === "ok" ? null : cat.tone]);
    items.push(["Pulse", frame.pulse ? "Present" : "Absent", "",
                frame.pulse ? null : "critical"]);
    items.push(["Perfusion", frame.perfusion.charAt(0).toUpperCase() + frame.perfusion.slice(1), "",
                frame.perfusion === "adequate" ? null : frame.perfusion === "absent" ? "critical" : "warn"]);

    host.innerHTML = "";
    items.forEach(function (it) {
      var d = h("div", { class: "readout" });
      if (it[3]) d.setAttribute("data-tone", it[3]);
      d.appendChild(h("dt", { text: it[0] }));
      var dd = h("dd", { text: String(it[1]) });
      if (it[2]) dd.appendChild(h("small", { text: " " + it[2] }));
      d.appendChild(dd);
      host.appendChild(d);
    });
  }

  function renderEventChip(frame) {
    document.getElementById("eventText").textContent = app.state.hideName
      ? "Read the strip yourself, then commit in the Quiz tab"
      : F.eventLabel(frame.leadEvent);
  }

  function setHiddenOption(sel) {
    var opt = sel.querySelector('option[value="__hidden"]');
    if (!opt) {
      opt = document.createElement("option");
      opt.value = "__hidden"; opt.textContent = "— hidden for the challenge —";
      sel.insertBefore(opt, sel.firstChild);
    }
    sel.value = "__hidden";
  }
  function clearHiddenOption(sel) {
    var opt = sel.querySelector('option[value="__hidden"]');
    if (opt) opt.remove();
  }

  /* -------------------------------------------------------------- rail tabs */

  var TABS = ["rhythm", "why", "setup", "quiz", "learn"];

  function renderRail() {
    var tab = app.state.tab;
    TABS.forEach(function (id) {
      var btn = document.getElementById("tab-" + id);
      var pane = document.getElementById("pane-" + id);
      var on = id === tab;
      btn.setAttribute("aria-selected", String(on));
      btn.setAttribute("tabindex", on ? "0" : "-1");
      pane.hidden = !on;
    });
    /* The rail panes rebuild themselves wholesale, which throws away the focused
     * element and drops the keyboard user back to the top of the document after
     * every click. Remember what had focus and give it back. */
    var active = document.activeElement;
    var focusKey = (active && active.closest && active.closest(".rail-pane"))
      ? (active.getAttribute("data-fkey") || null) : null;

    var pane = document.getElementById("pane-" + tab);
    if (tab === "rhythm") {
      if (app.state.hideName) {
        pane.innerHTML = "";
        pane.appendChild(h("p", { class: "eyebrow", text: "Rhythm challenge in progress" }));
        pane.appendChild(h("h3", { class: "headline", text: "Name hidden" }));
        pane.appendChild(h("p", { text: "Read the strip yourself, then commit in the Quiz tab." }));
      } else P.renderRhythm(pane, api);
    }
    else if (tab === "why") P.renderWhy(pane, api);
    else if (tab === "setup") P.renderSetup(pane, api);
    else if (tab === "quiz") C.ui.quiz.render(pane, api);
    else if (tab === "learn") C.ui.lessons.render(pane, api);

    if (focusKey) {
      var back = pane.querySelector('[data-fkey="' + focusKey.replace(/"/g, '') + '"]');
      if (back && !back.disabled) back.focus();
    }
  }

  /* ------------------------------------------------------------------- api */

  var api = {
    get state() { return app.state; },

    announce: function (msg) {
      var live = document.getElementById("liveRegion");
      live.textContent = "";
      setTimeout(function () { live.textContent = msg; }, 30);
    },

    play: function () {
      // Reduced motion turns autoplay OFF by default, but a learner who asks for
      // it twice clearly wants it; refusing outright leaves a dead Play button.
      if (app.reducedMotion && !app._motionOverride) {
        app._motionOverride = true;
        api.announce("Reduced motion is on, so playback stays off. Step with the arrow keys, or press Play again to run it anyway.");
        return;
      }
      app.playing = true; setOrigin(); syncPlayButton();
    },
    pause: function () { app.playing = false; app.tMs = app.tMs; setOrigin(); syncPlayButton(); app._dirty = true; },
    toggle: function () { app.playing ? api.pause() : api.play(); },

    seek: function (target) {
      if (!target) return;
      if (target.kind === "start" || target.kind === "canonical-start") app.tMs = app.schedule.startMs;
      else if (target.kind === "time") app.tMs = M.clamp(target.ms || 0, 0, SCHEDULE_MS - 5000);
      else if (target.kind === "event") {
        var occ = target.occurrence || 1, n = 0, found = null;
        for (var i = 0; i < app.schedule.events.length; i++) {
          var e = app.schedule.events[i];
          if (e.onsetMs < app.schedule.startMs - 1) continue;
          if (e.type === target.eventType) { n++; if (n >= occ) { found = e; break; } }
        }
        if (found) app.tMs = found.onsetMs + Math.min(12, found.durMs / 3);
        else app.tMs = app.schedule.startMs;
      }
      setOrigin(); app._dirty = true;
    },

    restart: function () {
      app.tMs = app.schedule.startMs; app.playing = false;
      setOrigin(); syncPlayButton(); app._dirty = true;
      api.announce("Restarted: " + app.schedule.canonicalStartNote);
    },

    step: function (dir) {
      var e = dir > 0 ? R.nextEvent(app.schedule, app.tMs, R.STEP_TYPES)
                      : R.prevEvent(app.schedule, app.tMs, R.STEP_TYPES);
      if (!e) return;
      app.playing = false; syncPlayButton();
      // Land exactly on the event onset. Landing slightly PAST it used to leave
      // the previous-event search inside the same event, so Back moved once and
      // then did nothing.
      app.tMs = e.onsetMs;
      setOrigin(); app._dirty = true;
      api.announce(F.eventLabel(e));
    },

    setMode: function (mode) {
      app.state.mode = mode;
      app.state.leadView = mode === "advanced" ? "twelve" : "single";
      app.state.labelSet = mode === "advanced" ? "none"
        : (app.state.labelSet === "none" ? "chambers" : app.state.labelSet);
      applyHeartFocus();
      if (mode === "basic" && app.state.condition !== "normal") {
        var c = C.content.conditions[app.state.condition];
        if (c && c.requiresTwelveLead) app.state.condition = "normal";
      }
      syncChrome(); rebuild(true); renderRail(); syncControls();
      api.announce(mode === "advanced" ? "Advanced mode. Twelve-lead view." : "Basic mode. Single rhythm lead.");
    },

    setRhythm: function (id, opts) {
      if (!R.DEFS[id]) return;
      app.state.rhythm = id;
      app.state.rates = {};
      app.state.flutterRatio = id === "aflutter" ? 2 : app.state.flutterRatio;
      var allowed = P.patientStatesFor(id);
      if (!allowed.filter(function (o) { return o.id === app.state.patientState; }).length) {
        app.state.patientState = allowed[0].id;
      }
      if (!(opts && opts.keepName)) app.state.hideName = false;
      rebuild(false);
      syncControls(); renderRail();
      var rec = C.content.rhythms[id];
      if (rec && !app.state.hideName) api.announce(rec.label + ". " + rec.headline);
    },

    setCondition: function (id) {
      app.state.condition = id;
      app.state.physiology = null;
      rebuild(true); syncControls(); renderRail();
      var rec = C.content.conditions[id];
      if (rec && !app.state.hideName) api.announce(rec.label + ". " + (rec.headline || ""));
    },

    setLead: function (lead) {
      if (C.LEAD_ORDER.indexOf(lead) < 0) return;
      app.state.selectedLead = lead;
      syncControls(); app._dirty = true;
    },

    setLeadView: function (v) {
      app.state.leadView = v;
      // In the 12-lead view the heart shrinks to an orientation inset, where
      // label gutters would cost more room than the labels are worth.
      app.state.labelSet = (v === "twelve") ? "none"
        : (app.state.labelSet === "none" ? "chambers" : app.state.labelSet);
      applyHeartFocus();
      syncChrome(); syncControls(); app._dirty = true;
    },

    setFocus: function (f) {
      app.state.focus = f;
      if (f === "conduction" && app.state.labelSet === "chambers") app.state.labelSet = "conduction";
      applyHeartFocus(); syncControls(); app._dirty = true;
    },

    setLabelSet: function (l) { app.state.labelSet = l; applyHeartFocus(); app._dirty = true; },

    setSpotlight: function (regions) { app.state.spotlight = regions || []; applyHeartFocus(); app._dirty = true; },

    setHighlight: function (tags) { app.state.highlightTags = tags || []; app._dirty = true; },

    setRate: function (key, v) {
      app.state.rates[key] = v;
      rebuildSoon();
    },

    setFlutterRatio: function (r) { app.state.flutterRatio = r; rebuild(false); renderRail(); },

    setPatientState: function (id) {
      app.state.patientState = id;
      rebuild(true); renderRail(); app._dirty = true;
      api.announce(id === "pea" ? "Pulseless electrical activity: the rhythm is organised, the patient has no pulse."
        : id === "pulseless-vt" ? "Pulseless ventricular tachycardia." : "Perfusing patient state.");
    },

    setPhysiology: function (key, v) {
      if (!app.state.physiology) app.state.physiology = {};
      var base = H.resolvePhysiology({ condition: app.state.condition, compensation: "off" });
      for (var k in base) if (app.state.physiology[k] === undefined) app.state.physiology[k] = base[k];
      app.state.physiology[key] = v;
      rebuildSoon();
    },

    resetPhysiology: function () {
      app.state.physiology = null;
      rebuild(true); renderRail(); app._dirty = true;
    },

    setCompensation: function (id) { app.state.compensation = id; rebuild(true); renderRail(); app._dirty = true; },

    setNoise: function (v) { app.state.noise = v; app._dirty = true; },

    randomizeSeed: function () {
      app.state.seed = (Math.random() * 4294967295) >>> 0;
      rebuild(false); renderRail();
    },

    applySetup: function (setup, opts) {
      if (!setup) return;
      // Set the flag FIRST: setRhythm and setCondition both announce the name
      // into the live region, which a screen-reader user would hear.
      app.state.hideName = !!(opts && opts.hideName);
      if (setup.rhythm) api.setRhythm(setup.rhythm, { keepName: true });
      api.setCondition(setup.condition || "normal");
      if (setup.lead) api.setLead(setup.lead);
      syncControls(); renderRail();
    },

    revealName: function () { app.state.hideName = false; syncControls(); renderRail(); },

    setTab: function (t) { app.state.tab = t; renderRail(); }
  };

  /* -------------------------------------------------------------- chrome */

  function applyHeartFocus() {
    C.render.heart.applyFocus(app.heartView, app.state.focus, app.state.labelSet, app.state.spotlight);
  }

  function syncPlayButton() {
    var b = document.getElementById("playBtn");
    b.textContent = app.playing ? "❚❚" : "▶";
    b.setAttribute("aria-label", app.playing ? "Pause" : "Play");
    b.setAttribute("aria-pressed", String(app.playing));
  }

  function syncChrome() {
    var adv = app.state.mode === "advanced";
    document.getElementById("modeBasic").setAttribute("aria-pressed", String(!adv));
    document.getElementById("modeAdvanced").setAttribute("aria-pressed", String(adv));
    document.getElementById("viewToggle").hidden = !adv;
    document.getElementById("viewSingle").setAttribute("aria-pressed", String(app.state.leadView === "single"));
    document.getElementById("viewTwelve").setAttribute("aria-pressed", String(app.state.leadView === "twelve"));
    document.getElementById("stage").setAttribute("data-view", app.state.leadView);
    document.getElementById("twelveWrap").hidden = app.state.leadView !== "twelve";
    document.getElementById("stripWrap").classList.toggle("ecg-strip-wrap", true);
  }

  function syncControls() {
    var s = app.state;

    /* During the rhythm challenge the answer must not be readable anywhere on
     * screen, or the drill measures nothing. */
    var rSel = document.getElementById("rhythmSelect");
    var cSel = document.getElementById("conditionSelect");
    buildConditionOptions(cSel);
    rSel.disabled = cSel.disabled = !!s.hideName;
    if (s.hideName) {
      setHiddenOption(rSel);
      setHiddenOption(cSel);
    } else {
      clearHiddenOption(rSel); clearHiddenOption(cSel);
      if (rSel.value !== s.rhythm) rSel.value = s.rhythm;
      if (cSel.value !== s.condition) cSel.value = s.condition;
    }

    var lSel = document.getElementById("leadSelect");
    if (lSel.value !== s.selectedLead) lSel.value = s.selectedLead;

    document.getElementById("focusSelect").value = s.focus;
    document.getElementById("labelSelect").value = s.labelSet;

    var speed = document.getElementById("speedRange");
    speed.value = String(Math.round(rateToSlider(s.playbackRate)));
    document.getElementById("speedVal").textContent = formatSpeed(s.playbackRate);
  }

  /* Logarithmic speed control from 0.05x to 2x — the slow end is where the
   * teaching happens, so it gets most of the travel. */
  function sliderToRate(v) {
    var lo = Math.log(0.05), hi = Math.log(2);
    return Math.exp(lo + (v / 100) * (hi - lo));
  }
  function rateToSlider(r) {
    var lo = Math.log(0.05), hi = Math.log(2);
    return ((Math.log(r) - lo) / (hi - lo)) * 100;
  }
  function formatSpeed(r) {
    return (r < 0.1 ? r.toFixed(2) : r < 1 ? r.toFixed(2).replace(/0$/, "") : r.toFixed(2).replace(/0$/, "")) + "×";
  }

  /* --------------------------------------------------------------- options */

  var RHYTHM_GROUPS = [
    ["Sinus", ["nsr", "sinus-brady", "sinus-tachy"]],
    ["Ectopy", ["pac", "pvc"]],
    ["Atrial", ["af", "aflutter", "svt"]],
    ["AV conduction", ["avb1", "mobitz1", "mobitz2", "avb2to1", "avb3"]],
    ["Ventricular and arrest", ["vt", "vf", "asystole"]]
  ];

  function buildRhythmOptions(sel) {
    sel.innerHTML = "";
    RHYTHM_GROUPS.forEach(function (g) {
      var og = document.createElement("optgroup");
      og.label = g[0];
      g[1].forEach(function (id) {
        var rec = C.content.rhythms[id] || { label: R.DEFS[id] ? R.DEFS[id].label : id };
        var o = document.createElement("option");
        o.value = id; o.textContent = rec.label;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
  }

  var CONDITION_GROUPS = [
    ["", ["normal"]],
    ["Electrolytes", ["hyperkalemia", "hypokalemia", "hypercalcemia", "hypocalcemia", "hypomagnesemia"]],
    ["Structure (needs 12-lead)", ["lvh", "rvh"]],
    ["Pump", ["hfref", "hfpef"]]
  ];

  function buildConditionOptions(sel) {
    var want = [];
    CONDITION_GROUPS.forEach(function (g) {
      g[1].forEach(function (id) {
        var rec = C.content.conditions[id];
        if (!rec) return;
        if (app.state.mode === "basic" && rec.requiresTwelveLead) return;
        want.push(id);
      });
    });
    if (sel.dataset.built === want.join(",")) return;
    sel.dataset.built = want.join(",");
    sel.innerHTML = "";
    CONDITION_GROUPS.forEach(function (g) {
      var ids = g[1].filter(function (id) { return want.indexOf(id) >= 0; });
      if (!ids.length) return;
      var parent = sel;
      if (g[0]) { parent = document.createElement("optgroup"); parent.label = g[0]; sel.appendChild(parent); }
      ids.forEach(function (id) {
        var rec = C.content.conditions[id];
        var o = document.createElement("option");
        o.value = id;
        o.textContent = id === "normal" ? "No added condition" : (rec.short || rec.label);
        parent.appendChild(o);
      });
    });
  }

  function buildLeadOptions(sel) {
    sel.innerHTML = "";
    var g1 = document.createElement("optgroup"); g1.label = "Limb (frontal plane)";
    C.LIMB_LEADS.forEach(function (l) {
      var o = document.createElement("option"); o.value = l;
      o.textContent = l + " — " + C.engine.vector.LEAD_INFO[l].view;
      g1.appendChild(o);
    });
    var g2 = document.createElement("optgroup"); g2.label = "Chest (horizontal plane)";
    C.PRECORDIAL.forEach(function (l) {
      var o = document.createElement("option"); o.value = l;
      o.textContent = l + " — " + C.engine.vector.LEAD_INFO[l].view;
      g2.appendChild(o);
    });
    sel.appendChild(g1); sel.appendChild(g2);
  }

  /* ----------------------------------------------------------------- about */

  function buildAbout() {
    var body = document.getElementById("aboutBody");
    body.innerHTML = "";
    body.appendChild(h("p", { text: "This is a teaching model of the cardiac cycle and the electrocardiogram, built for prelicensure nursing and health-professional students. Everything it draws is generated from a physiological model. Nothing in it was recorded from a patient." }));

    body.appendChild(h("h3", { text: "What it will not do" }));
    body.appendChild(P.list([
      "It will not diagnose. A generated tracing is not a diagnostic ECG and must never be used for patient care.",
      "It will not let the ECG stand in for the patient. The tracing shows electrical activity; it does not measure contraction, pulse, cardiac output or tissue perfusion.",
      "It will not read hypertrophy, ischaemia or axis from one rhythm lead.",
      "It will not infer a serum potassium, calcium or magnesium concentration from a waveform, and it does not claim a fixed severity sequence.",
      "It will not give doses, prescriptions, or patient-specific treatment."
    ]));

    body.appendChild(h("h3", { text: "How the tracing is made" }));
    body.appendChild(h("p", { text: "The heart's electrical activity is modelled as one net dipole vector whose direction and size change through the beat. Each lead is that vector projected onto an axis, so all twelve leads come from the same instants and Einthoven's law (II = I + III) holds exactly. Conditions change the parameters of the underlying currents — conduction speed, plateau length, how synchronous repolarisation is, how much muscle is generating current — and the leads then change together." }));
    body.appendChild(h("p", { class: "illustrative", text: "Amplitudes are calibrated so a normal Lead II R wave is about 1 mV. Chest leads carry a proximity gain because electrodes near the heart see larger deflections. That gain is illustrative, not a physical constant." }));

    body.appendChild(h("h3", { text: "How the pump is made" }));
    body.appendChild(h("p", { text: "Filling is computed from the diastolic time the rhythm actually left available and from whether an atrial contraction landed in it, so tachycardia, a dropped beat and an irregular ventricular response reduce stroke volume for the right reason. Ejection is computed separately for each ventricle from contractility and its own afterload. All values are normalised teaching coordinates: directional and bounded, never a measurement." }));

    body.appendChild(h("h3", { text: "Versions" }));
    body.appendChild(P.list([
      "Application " + C.VERSION,
      "Model " + C.MODEL_VERSION,
      "Content " + C.CONTENT_VERSION,
      C.REVIEWED
    ]));

    body.appendChild(h("h3", { text: "Keyboard" }));
    body.appendChild(P.list([
      "Space — play or pause",
      "Left and Right arrows — step to the previous or next event",
      "R — restart at the teaching start point",
      "1 to 5 — anatomy, conduction, contraction, flow, all together",
      "L — switch between the single lead and the 12-lead view"
    ]));

    body.appendChild(h("h3", { text: "Sources" }));
    var ol = h("ol", { class: "refs" });
    (C.content.sources || []).forEach(function (s) {
      ol.appendChild(h("li", { text: s.cite + (s.note ? " — " + s.note : "") }));
    });
    body.appendChild(ol);
  }

  /* ------------------------------------------------------------------ init */

  function init() {
    app.state = defaults();
    app.reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    buildRhythmOptions(document.getElementById("rhythmSelect"));
    buildConditionOptions(document.getElementById("conditionSelect"));
    buildLeadOptions(document.getElementById("leadSelect"));

    app.heartView = C.render.heart.create(document.getElementById("heartHolder"));
    app.timelineView = C.render.timeline.create(document.getElementById("timelineHost"));

    readUrl();
    rebuild(false);
    applyHeartFocus();
    syncChrome(); syncControls(); syncPlayButton(); renderRail();
    buildAbout();
    wire();

    app._raf = requestAnimationFrame(tick);

    if (app.reducedMotion) {
      document.getElementById("illustrativeNote").textContent =
        "Reduced motion is on, so playback is off. Step through with the Next event button — every teaching point is reachable that way. Waveforms are generated, not recorded, and no value here is a measurement or a diagnosis.";
    }
  }

  function wire() {
    var on = function (id, ev, fn) {
      var el = document.getElementById(id);
      if (el) el.addEventListener(ev, fn);
    };

    on("modeBasic", "click", function () { api.setMode("basic"); });
    on("modeAdvanced", "click", function () { api.setMode("advanced"); });
    on("viewSingle", "click", function () { api.setLeadView("single"); });
    on("viewTwelve", "click", function () { api.setLeadView("twelve"); });

    on("rhythmSelect", "change", function (e) { api.setRhythm(e.target.value); });
    on("conditionSelect", "change", function (e) { api.setCondition(e.target.value); });
    on("leadSelect", "change", function (e) { api.setLead(e.target.value); });
    on("focusSelect", "change", function (e) { api.setFocus(e.target.value); });
    on("labelSelect", "change", function (e) { api.setLabelSet(e.target.value); });

    on("playBtn", "click", function () { api.toggle(); });
    on("prevBtn", "click", function () { api.step(-1); });
    on("nextBtn", "click", function () { api.step(1); });
    on("restartBtn", "click", function () { api.restart(); });

    on("speedRange", "input", function (e) {
      app.state.playbackRate = sliderToRate(parseFloat(e.target.value));
      document.getElementById("speedVal").textContent = formatSpeed(app.state.playbackRate);
      setOrigin();
    });

    /* A tablist is expected to move with the arrow keys, with only the selected
     * tab in the tab order. Without this a keyboard user has to tab through
     * every section heading to reach the panel they want. */
    TABS.forEach(function (t, i) {
      var btn = document.getElementById("tab-" + t);
      btn.setAttribute("tabindex", app.state.tab === t ? "0" : "-1");
      btn.addEventListener("click", function () { api.setTab(t); });
      btn.addEventListener("keydown", function (e) {
        var delta = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        var target = null;
        if (delta) target = TABS[(i + delta + TABS.length) % TABS.length];
        else if (e.key === "Home") target = TABS[0];
        else if (e.key === "End") target = TABS[TABS.length - 1];
        if (!target) return;
        e.preventDefault();
        api.setTab(target);
        document.getElementById("tab-" + target).focus();
      });
    });

    on("railToggle", "click", function (e) {
      var stage = document.getElementById("stage");
      var open = stage.getAttribute("data-rail") !== "closed";
      stage.setAttribute("data-rail", open ? "closed" : "open");
      document.getElementById("rail").hidden = open;
      e.target.setAttribute("aria-pressed", String(!open));
      e.target.textContent = open ? "Show panel" : "Hide panel";
      app._dirty = true;
    });

    on("themeToggle", "click", function () {
      var root = document.documentElement;
      var cur = root.getAttribute("data-theme");
      var next = cur === "dark" ? "light" : cur === "light" ? "dark"
        : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
      root.setAttribute("data-theme", next);
      app._dirty = true;
    });

    on("sizeToggle", "click", function (e) {
      var root = document.documentElement;
      var big = root.getAttribute("data-size") === "large";
      root.setAttribute("data-size", big ? "normal" : "large");
      e.target.setAttribute("aria-pressed", String(!big));
      app._dirty = true;
    });

    on("fullscreenBtn", "click", function () {
      if (!document.fullscreenElement) {
        (document.documentElement.requestFullscreen || function () {}).call(document.documentElement);
      } else if (document.exitFullscreen) document.exitFullscreen();
    });

    /* Modal dialog: focus moves in on open, is kept inside while open, and
     * returns to the trigger on close. */
    function closeAbout() {
      document.getElementById("aboutModal").hidden = true;
      document.getElementById("aboutBtn").focus();
    }
    on("aboutBtn", "click", function () {
      var m = document.getElementById("aboutModal");
      m.hidden = false;
      document.getElementById("aboutClose").focus();
    });
    on("aboutClose", "click", closeAbout);
    on("aboutModal", "click", function (e) {
      if (e.target.id === "aboutModal") closeAbout();
    });
    on("aboutModal", "keydown", function (e) {
      if (e.key === "Escape") { e.stopPropagation(); closeAbout(); return; }
      if (e.key !== "Tab") return;
      var m = document.getElementById("aboutModal");
      var focusable = m.querySelectorAll("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])");
      if (!focusable.length) return;
      var first = focusable[0], last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });

    /* Click a lead in the 12-lead grid to select it. */
    var tw = document.getElementById("twelveCanvas");
    tw.addEventListener("click", function (e) {
      if (!app._twelveLayout) return;
      var lead = C.render.ecg.leadAtPoint(tw, app._twelveLayout, e.clientX, e.clientY);
      if (lead) { api.setLead(lead); api.announce("Lead " + lead + ": " + C.engine.vector.LEAD_INFO[lead].view); }
    });

    /* Click any part of the complex to pause there and have it explained;
     * hover to see what you are about to pick. */
    [["stripCanvas", "strip", function () { return app._stripLayout; }],
     ["detailCanvas", "detail", function () { return app._detailLayout; }]
    ].forEach(function (spec) {
      var cv = document.getElementById(spec[0]);
      cv.classList.add("is-pickable");
      cv.addEventListener("pointermove", function (e) {
        var region = pickRegion(cv, spec[2](), e.clientX);
        var changed = !app._hover || app._hover.on !== spec[1] ||
                      (app._hover.region && region ? app._hover.region.key !== region.key : app._hover.region !== region);
        app._hover = { on: spec[1], region: region };
        cv.title = region && C.content.waveGuide[region.key]
          ? C.content.waveGuide[region.key].label + " — click to pause here" : "";
        if (changed) app._dirty = true;
      });
      cv.addEventListener("pointerleave", function () {
        if (app._hover) { app._hover = null; app._dirty = true; }
      });
      cv.addEventListener("click", function (e) {
        var layout = spec[2]();
        var region = pickRegion(cv, layout, e.clientX);
        if (region) { selectWave(region); return; }
        // Empty paper: fall back to plain scrubbing.
        if (!layout) return;
        app.playing = false; syncPlayButton();
        app.tMs = C.render.ecg.timeAtX(layout, cv, e.clientX);
        setOrigin(); app._dirty = true;
      });
    });

    on("waveClose", "click", function () { selectWave(null); });

    document.addEventListener("keydown", function (e) {
      var tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "select" || tag === "textarea") return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;

      // Space and Enter belong to whatever control has focus. Claiming Space
      // globally would stop every button, tab and quiz option in the app from
      // being activated by keyboard, which is how most of this interface is
      // reached without a mouse.
      var onControl = tag === "button" || tag === "a" ||
                      (e.target.getAttribute && e.target.getAttribute("role") === "tab");
      var inDialog = !document.getElementById("aboutModal").hidden;

      var k = e.key;
      if (k === " ") {
        if (onControl || inDialog) return;
        e.preventDefault(); api.toggle();
      }
      else if (inDialog && k !== "Escape") return;
      else if (k === "ArrowRight") { e.preventDefault(); api.step(1); }
      else if (k === "ArrowLeft") { e.preventDefault(); api.step(-1); }
      else if (k === "r" || k === "R") { api.restart(); }
      else if (k === "l" || k === "L") {
        if (app.state.mode === "advanced") api.setLeadView(app.state.leadView === "single" ? "twelve" : "single");
      }
      else if (k >= "1" && k <= "5") {
        api.setFocus(["anatomy", "conduction", "contraction", "flow", "integrated"][parseInt(k, 10) - 1]);
      }
      else if (k === "Escape") {
        var m = document.getElementById("aboutModal");
        if (!m.hidden) { m.hidden = true; document.getElementById("aboutBtn").focus(); }
      }
    });

    /* Pause when the page is hidden, so a backgrounded tab never advances
     * physiology behind the learner's back. */
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        if (app.playing) api.pause();
      } else {
        // requestAnimationFrame is idle while hidden, so anything that changed
        // in the meantime (a resize, a theme change) has not been drawn yet.
        app._dirty = true;
      }
    });

    var ro = new ResizeObserver(function () { app._dirty = true; });
    ro.observe(document.getElementById("stage"));
    window.addEventListener("resize", function () { app._dirty = true; });
  }

  /* Shareable links carry only a safe, validated subset, and always open paused. */
  function readUrl() {
    var q = new URLSearchParams(location.search);
    if (!q.toString()) return;
    var m = q.get("mode");
    if (m === "advanced" || m === "basic") { app.state.mode = m; app.state.leadView = m === "advanced" ? "twelve" : "single"; }
    var r = q.get("rhythm");
    if (r && R.DEFS[r]) app.state.rhythm = r;
    var c = q.get("condition");
    if (c && C.content.conditions[c]) app.state.condition = c;
    var l = q.get("lead");
    if (l && C.LEAD_ORDER.indexOf(l) >= 0) app.state.selectedLead = l;
    var f = q.get("focus");
    if (f && ["anatomy", "conduction", "contraction", "flow", "integrated"].indexOf(f) >= 0) app.state.focus = f;
    if (app.state.leadView === "twelve") app.state.labelSet = "none";
    var seed = parseInt(q.get("seed"), 10);
    if (isFinite(seed) && seed >= 0) app.state.seed = seed >>> 0;
    app.state.hideName = false;
  }

  C.app = app;
  C.api = api;

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})(window.CARDIAC);

</script>
</body>
</html>
